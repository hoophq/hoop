[package]
name = "agentrs"
version = "0.1.0"
edition = "2024"

[features]
# Fail the BUILD if the linked guard crate is the OSS stub. Release jobs pass
# this so a missing libhoop checkout cannot silently ship an agent that never
# enforces. See the assertion in src/guard.rs.
require-enforcement = []

[dependencies]
# The swappable RDP PII guard. `make libhoop-ensure` symlinks
# `libhoop -> _libhoop`, so this resolves to the OSS passthrough stub; a
# checkout of hoophq/libhoop at ./libhoop resolves it to the enterprise crate.
# Both expose an identical surface, asserted by tests/guard_surface.rs.
#
# An unresolvable Cargo path dependency is a hard error, so every Makefile
# target that runs cargo depends on libhoop-ensure.
hoop-rdp-guard = { path = "../libhoop/rdp-guard" }
futures-core = "0.3.0"
futures-sink = "0.3.0"
tokio = { version = "1.45.0", features = ["signal", "net", "io-util", "time", "rt", "rt-multi-thread", "sync", "macros", "parking_lot", "fs"] }
tokio-util = "0.7.0"
tokio-rustls = { version = "0.26.0", default-features = false, features = ["logging", "tls12", "ring"] }
typed-builder = "0.21.0"
tower = { version = "0.5.0", features = ["timeout"] }
pin-project-lite = "0.2.0"

hyper = "1.6.0"
hyper-util = { version = "0.1.0", features = ["tokio", "server", "server-auto"] }
axum = { version = "0.8.0", default-features = false, features = ["http1", "json", "ws", "query", "tracing", "tower-log"] }
tungstenite = "0.26.0" # Should be the same version as `axum` (we perform error downcasting for better error reporting)
tokio-tungstenite = { version = "0.26.0", features = ["rustls-tls-native-roots"] } # Should use the same version of tungstenite as `axum`
http-body-util = "0.1.0"

uuid = { version = "1.17.0", features = ["v4", "serde"] }
base64 = "0.22.1"
url = "2.5.4"
time = { version = "0.3.0", default-features = false, features = ["std", "serde", "formatting"] }


# Serialization
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0.0"
serde_urlencoded = "0.7.0"
once_cell = "1.19.0"
bitflags = "2.9.0"


camino = { version = "1.1.0", features = ["serde1"] }
cfg-if = "1.0.0"

bytes = "1.10.1"
anyhow = "1.0.0"
futures = "0.3.31"
futures-util = "0.3.31"

ironrdp-connector = { version = "0.5.0" }
ironrdp-async = { version = "0.5.0" }
ironrdp-acceptor = { version = "0.5.0" }
ironrdp-pdu = { version = "0.5.0", features = ["std"] }
ironrdp-core = { version = "0.1.0", features = ["std"] }
ironrdp-tokio = "0.5.0"

# reqwest, tokio-util, parking_lot, async-trait and ironrdp-graphics moved to
# hoop-rdp-guard with the PII gate; the transport does not use them.
rustls = "0.22.0"
rcgen = "0.12.0"

picky = { version = "7.0.0-rc.15", default-features = false, features = ["jose", "x509", "pkcs12", "time_conversion"] }
zeroize = { version = "1.8.0", features = ["derive"] }
multibase = "0.9.0"
x509-cert = { version = "0.2.0", default-features = false, features = ["std"] }

tap = "1.0.0"
tracing = "0.1.0"
tracing-subscriber = "0.3.0"
toml = "0.8.0"


[[example]]
name = "rdp_caps_probe"
path = "examples/rdp_caps_probe.rs"
