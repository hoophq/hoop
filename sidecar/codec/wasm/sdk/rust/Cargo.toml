# hoop-codec: the Rust SDK for hoop codec plug-ins (see ../../abi/ABI.md).
#
# The library itself builds and tests on the host target. A plug-in is a
# separate cdylib crate that depends on it and builds for
# wasm32-unknown-unknown; examples/acmewire is the template.
[package]
name = "hoop-codec"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "SDK for hoop codec plug-ins: implement Codec, call export_codec!, build for wasm32-unknown-unknown"
publish = false

# serde and serde_json are the only dependencies. The ABI is JSON over
# linear memory, and a plug-in author should not have to audit more than
# two crates to trust what sits between their decoder and the relay.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = ["examples/acmewire"]

# The release profile targets the wasm artifact, which is what a plug-in
# ships. opt-level "s" and lto keep acmewire well under the 300 KB
# the conformance budget allows; panic = "abort" turns a panic into the
# trap ABI.md's failure semantics expect, instead of linking unwinding
# tables the host could never drive.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
