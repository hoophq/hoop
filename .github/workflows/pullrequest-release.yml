name: Development Release

on:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'webapp/*.md'
      - '.github/**'
      - 'LICENSE'
      - '.env.sample'

jobs:
  build-rust-binaries-darwin:
    runs-on: macos-latest
    name: Build Darwin Rust Binaries

    steps:
      - name: Checkout Hoop
        uses: actions/checkout@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Add Darwin Rust targets
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Set Git Tag
        run: echo "GIT_TAG=${{ github.event.pull_request.number }}.0.0-g$(git rev-parse --short ${{ github.event.pull_request.head.sha }})" >> $GITHUB_ENV

      - name: Build Darwin Rust Binaries
        env:
          GIT_TAG: ${{ env.GIT_TAG }}
        run: make build-rust-darwin-all

      - uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts-${{ github.job }}
          path: dist/

  build-rust-binary-linux-amd64:
    runs-on: ubuntu-latest
    name: Build Linux Rust Binaries Amd64

    steps:
      - name: Checkout Hoop
        uses: actions/checkout@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Add Linux Rust targets
        run: |
          rustup target add x86_64-unknown-linux-gnu

      - name: Set Git Tag
        run: echo "GIT_TAG=${{ github.event.pull_request.number }}.0.0-g$(git rev-parse --short ${{ github.event.pull_request.head.sha }})" >> $GITHUB_ENV

      - name: Build Linux Rust Binaries
        env:
          GIT_TAG: ${{ env.GIT_TAG }}
        run: GOOS=linux GOARCH=amd64 make build-rust-single

      - uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts-${{ github.job }}
          path: dist/

  build-rust-binary-linux-arm64:
    runs-on: ubuntu-24.04-arm
    name: Build Linux Rust Binaries Arm64

    steps:
      - name: Checkout Hoop
        uses: actions/checkout@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Add Linux Rust targets
        run: |
          rustup target add aarch64-unknown-linux-gnu

      - name: Set Git Tag
        run: echo "GIT_TAG=${{ github.event.pull_request.number }}.0.0-g$(git rev-parse --short ${{ github.event.pull_request.head.sha }})" >> $GITHUB_ENV

      - name: Build Linux Rust Binaries
        env:
          GIT_TAG: ${{ env.GIT_TAG }}
        run: GOOS=linux GOARCH=arm64 make build-rust-single

      - uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts-${{ github.job }}
          path: dist/

  darwin-amd64:
    needs: [build-webapp]
    runs-on: ubuntu-latest
    name: Build Darwin Amd64

    steps:
      - name: Checkout Hoop
        uses: actions/checkout@v3

      - name: Checkout libhoop
        uses: actions/checkout@v3
        with:
          repository: hoophq/libhoop
          path: "./libhoop"
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: Setup Rust for WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Generate WASM
        run: make generate-wasm

      - name: Download Webapp
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts-build-webapp
          path: dist/

      - name: Embed Webapp
        run: make embed-webapp

      - name: Set Git Tag
        run: echo "GIT_TAG=${{ github.event.pull_request.number }}.0.0-g$(git rev-parse --short ${{ github.event.pull_request.head.sha }})" >> $GITHUB_ENV

      - name: amd64
        env:
          GIT_TAG: ${{ env.GIT_TAG }}
        run: GOOS=darwin GOARCH=amd64 make build-go

      - uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts-${{ github.job }}
          path: dist/

  darwin-arm64:
    needs: [build-webapp]
    runs-on: ubuntu-latest
    name: Build Darwin Arm64

    steps:
      - name: Checkout Hoop
        uses: actions/checkout@v3

      - name: Checkout libhoop
        uses: actions/checkout@v3
        with:
          repository: hoophq/libhoop
          path: "./libhoop"
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: Setup Rust for WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Generate WASM
        run: make generate-wasm

      - name: Download Webapp
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts-build-webapp
          path: dist/

      - name: Embed Webapp
        run: make embed-webapp

      - name: Set Git Tag
        run: echo "GIT_TAG=${{ github.event.pull_request.number }}.0.0-g$(git rev-parse --short ${{ github.event.pull_request.head.sha }})" >> $GITHUB_ENV

      - name: Build
        env:
          GIT_TAG: ${{ env.GIT_TAG }}
        run: GOOS=darwin GOARCH=arm64 make build-go

      - uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts-${{ github.job }}
          path: dist/

  windows-amd64:
    needs: [build-webapp]
    runs-on: ubuntu-latest
    name: Build Windows Amd64

    steps:
      - name: Checkout Hoop
        uses: actions/checkout@v3

      - name: Checkout libhoop
        uses: actions/checkout@v3
        with:
          repository: hoophq/libhoop
          path: "./libhoop"
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: Setup Rust for WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Generate WASM
        run: make generate-wasm

      - name: Download Webapp
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts-build-webapp
          path: dist/

      - name: Embed Webapp
        run: make embed-webapp

      - name: Set Git Tag
        run: echo "GIT_TAG=${{ github.event.pull_request.number }}.0.0-g$(git rev-parse --short ${{ github.event.pull_request.head.sha }})" >> $GITHUB_ENV

      - name: Build
        env:
          GIT_TAG: ${{ env.GIT_TAG }}
        run: GOOS=windows GOARCH=amd64 make build-go

      - uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts-${{ github.job }}
          path: dist/

  windows-arm64:
    needs: [build-webapp]
    runs-on: ubuntu-latest
    name: Build Windows Arm64

    steps:
      - name: Checkout Hoop
        uses: actions/checkout@v3

      - name: Checkout libhoop
        uses: actions/checkout@v3
        with:
          repository: hoophq/libhoop
          path: "./libhoop"
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: Setup Rust for WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Generate WASM
        run: make generate-wasm

      - name: Download Webapp
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts-build-webapp
          path: dist/

      - name: Embed Webapp
        run: make embed-webapp

      - name: Set Git Tag
        run: echo "GIT_TAG=${{ github.event.pull_request.number }}.0.0-g$(git rev-parse --short ${{ github.event.pull_request.head.sha }})" >> $GITHUB_ENV

      - name: Build
        env:
          GIT_TAG: ${{ env.GIT_TAG }}
        run: GOOS=windows GOARCH=arm64 make build-go

      - uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts-${{ github.job }}
          path: dist/

  linux-amd64:
    needs: [build-webapp]
    runs-on: ubuntu-latest
    name: Build Linux Amd64

    steps:
      - name: Checkout Hoop
        uses: actions/checkout@v3

      - name: Checkout libhoop
        uses: actions/checkout@v3
        with:
          repository: hoophq/libhoop
          path: "./libhoop"
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: Setup Rust for WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Generate WASM
        run: make generate-wasm

      - name: Download Webapp
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts-build-webapp
          path: dist/

      - name: Embed Webapp
        run: make embed-webapp

      - name: Set Git Tag
        run: echo "GIT_TAG=${{ github.event.pull_request.number }}.0.0-g$(git rev-parse --short ${{ github.event.pull_request.head.sha }})" >> $GITHUB_ENV

      - name: Build
        env:
          GIT_TAG: ${{ env.GIT_TAG }}
          HONEYCOMB_API_KEY: ${{ secrets.HONEYCOMB_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SEGMENT_API_KEY: ${{ secrets.SEGMENT_API_KEY }}
          INTERCOM_HMAC_KEY: ${{ secrets.INTERCOM_HMAC_KEY }}
        run: GOOS=linux GOARCH=amd64 make build-go

      - uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts-${{ github.job }}
          path: dist/

  linux-arm64:
    needs: [build-webapp]
    runs-on: ubuntu-latest
    name: Build Linux Arm64

    steps:
      - name: Checkout Hoop
        uses: actions/checkout@v3

      - name: Checkout libhoop
        uses: actions/checkout@v3
        with:
          repository: hoophq/libhoop
          path: "./libhoop"
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: Setup Rust for WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Generate WASM
        run: make generate-wasm

      - name: Download Webapp
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts-build-webapp
          path: dist/

      - name: Embed Webapp
        run: make embed-webapp

      - name: Set Git Tag
        run: echo "GIT_TAG=${{ github.event.pull_request.number }}.0.0-g$(git rev-parse --short ${{ github.event.pull_request.head.sha }})" >> $GITHUB_ENV

      - name: Build
        env:
          GIT_TAG: ${{ env.GIT_TAG }}
          HONEYCOMB_API_KEY: ${{ secrets.HONEYCOMB_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SEGMENT_API_KEY: ${{ secrets.SEGMENT_API_KEY }}
          INTERCOM_HMAC_KEY: ${{ secrets.INTERCOM_HMAC_KEY }}
        run: GOOS=linux GOARCH=arm64 make build-go

      - uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts-${{ github.job }}
          path: dist/

  build-webapp:
    runs-on: ubuntu-latest
    name: Build Webapp
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: 1.12.0.1479 # releases: https://clojure.org/releases/tools
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json
      - name: Build
        run: make build-webapp
      - uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts-${{ github.job }}
          path: dist/

  build-tar-files:
    runs-on: ubuntu-latest
    name: Build Tar Files
    needs: 
      - build-webapp
      - darwin-amd64
      - darwin-arm64
      - windows-amd64
      - windows-arm64
      - linux-amd64
      - linux-arm64
      - build-rust-binaries-darwin
      - build-rust-binary-linux-amd64
      - build-rust-binary-linux-arm64
    steps:
      - name: Checkout Hoop
        uses: actions/checkout@v3
        
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-artifacts-*
          merge-archive: true
          path: dist/

      - name: Set Git Tag
        run: echo "GIT_TAG=${{ github.event.pull_request.number }}.0.0-g$(git rev-parse --short ${{ github.event.pull_request.head.sha }})" >> $GITHUB_ENV

      - name: Merge Artifacts into dist/
        env:
          GIT_TAG: ${{ env.GIT_TAG }}
        run: make merge-artifacts
          
      - name: Build Tar Files for All Architectures
        env:
          GIT_TAG: ${{ env.GIT_TAG }}
        run: |
          GOOS=darwin GOARCH=amd64 make build-tar-files
          GOOS=darwin GOARCH=arm64 make build-tar-files
          GOOS=windows GOARCH=amd64 make build-tar-files
          GOOS=windows GOARCH=arm64 make build-tar-files
          GOOS=linux GOARCH=amd64 make build-tar-files
          GOOS=linux GOARCH=arm64 make build-tar-files
        
      - uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts-${{ github.job }}
          path: dist/

  docker-publish-hoopgateway-arm64:
    runs-on: GitHub-Linux-Arm-Runner
    name: Dck Publish Gateway (arm64)
    needs:
      - build-tar-files
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: hoophq/hoop
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-artifacts-*
          merge-multiple: true
          path: dist/
      - name: Extract Webapp
        run: make extract-webapp
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          file: ./Dockerfile
          context: '.'
          platforms: linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: |
            hoophq/hoop:${{ github.sha }}-arm64

  docker-publish-hoopgateway-amd64:
    runs-on: ubuntu-latest
    name: Dck Publish Gateway (amd64)
    needs:
      - build-tar-files
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: hoophq/hoop
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-artifacts-*
          merge-multiple: true
          path: dist/
      - name: Extract Webapp
        run: make extract-webapp
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          file: ./Dockerfile
          context: '.'
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: |
            hoophq/hoop:${{ github.sha }}-amd64

  docker-publish-hoopgateway-multiarch:
    runs-on: ubuntu-latest
    name: Publish Gateway Image
    needs:
      - docker-publish-hoopgateway-amd64
      - docker-publish-hoopgateway-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: hoophq/hoop
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set Git Tag
        run: echo "GIT_TAG=${{ github.event.pull_request.number }}.0.0-g$(git rev-parse --short ${{ github.event.pull_request.head.sha }})" >> $GITHUB_ENV
      - name: Create SHA manifest and push
        env:
          GIT_TAG: ${{ env.GIT_TAG }}
        run: |
          docker manifest create hoophq/hoop:${{ env.GIT_TAG }} \
            --amend hoophq/hoop:${{ github.sha }}-amd64 \
            --amend hoophq/hoop:${{ github.sha }}-arm64
          docker manifest push hoophq/hoop:${{ env.GIT_TAG }}


  docker-publish-hoopagent-arm64:
    runs-on: GitHub-Linux-Arm-Runner
    name: Dck Publish Agent (arm64)
    needs:
      - build-tar-files
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: hoophq/hoopdev
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-artifacts-*
          merge-multiple: true
          path: dist/
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          file: ./Dockerfile.dev
          context: '.'
          platforms: linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: |
            hoophq/hoopdev:${{ github.sha }}-arm64

  docker-publish-hoopagent-amd64:
    runs-on: ubuntu-latest
    name: Dck Publish Agent (amd64)
    needs:
      - build-tar-files
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: hoophq/hoopdev
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-artifacts-*
          merge-multiple: true
          path: dist/
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          file: ./Dockerfile.dev
          context: '.'
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: |
            hoophq/hoopdev:${{ github.sha }}-amd64

  docker-publish-hoopagent-multiarch:
    runs-on: ubuntu-latest
    name: Publish Hoopagent Image
    needs:
      - docker-publish-hoopagent-amd64
      - docker-publish-hoopagent-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: hoophq/hoopdev
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set Git Tag
        run: echo "GIT_TAG=${{ github.event.pull_request.number }}.0.0-g$(git rev-parse --short ${{ github.event.pull_request.head.sha }})" >> $GITHUB_ENV
      - name: Create SHA manifest and push
        env:
          GIT_TAG: ${{ env.GIT_TAG }}
        run: |
          docker manifest create hoophq/hoopdev:${{ env.GIT_TAG }} \
            --amend hoophq/hoopdev:${{ github.sha }}-amd64 \
            --amend hoophq/hoopdev:${{ github.sha }}-arm64
          docker manifest push hoophq/hoopdev:${{ env.GIT_TAG }}

  # Agent image with the alcatraz NER model baked in, derived from the hoopdev
  # image published above. The release workflow publishes it too; it is built
  # on PRs as well because the image itself is what gets validated -- there is
  # no way to check that the model is present and loadable other than pulling
  # the artifact.
  docker-publish-hoopagent-alcatraz:
    runs-on: ubuntu-latest
    name: Publish Agent Alcatraz Image
    # Fork PRs cannot push to Docker Hub, and the base image this derives from
    # is only published for same-repo PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs:
      # hoophq/hoopdev is the agent image this derives from.
      - docker-publish-hoopagent-multiarch
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      # Only for its go.mod: the alcatraz version is read from it below.
      - name: Checkout libhoop
        uses: actions/checkout@v3
        with:
          repository: hoophq/libhoop
          path: "./libhoop"
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      # The model baked into the image has to come from the same alcatraz
      # version the agent binary links, or the agent rejects the files when it
      # loads them. Deriving it keeps that from becoming a second pin to
      # hand-sync. Read from libhoop's own module graph (GOWORK=off), because
      # libhoop is the module that actually requires alcatraz: the workspace
      # view would answer with the stale "// indirect" requirement in
      # agent/go.mod if libhoop ever stopped requiring it, silently baking a
      # mismatched model instead of failing here.
      #
      # This resolves in the image job, not in the binary build that also has
      # libhoop checked out: a version this job cannot answer is a reason to
      # publish no image, never a reason to hold back the preview binaries.
      - name: Resolve alcatraz version
        id: alcatraz
        run: |
          set -euo pipefail
          version="$(GOWORK=off go -C libhoop list -m -f '{{.Version}}' github.com/hoophq/alcatraz)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set Git Tag
        run: echo "GIT_TAG=${{ github.event.pull_request.number }}.0.0-g$(git rev-parse --short ${{ github.event.pull_request.head.sha }})" >> $GITHUB_ENV
      - name: Build and push (multiarch)
        uses: docker/build-push-action@v4
        with:
          file: ./Dockerfile.agent-alcatraz
          context: '.'
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: true
          build-args: |
            HOOP_IMAGE=hoophq/hoopdev:${{ env.GIT_TAG }}
            ALCATRAZ_VERSION=${{ steps.alcatraz.outputs.version }}
          tags: |
            hoophq/hoop-agent-alcatraz:${{ env.GIT_TAG }}
      # The build already verified the model inside the image it produced; this
      # re-checks the artifact that actually landed in the registry, and does it
      # per-architecture, which a single-platform build stage cannot.
      - name: Verify published image
        run: |
          for platform in linux/amd64 linux/arm64; do
            echo "verifying $platform"
            docker run --rm --platform "$platform" \
              --entrypoint alcatraz \
              hoophq/hoop-agent-alcatraz:${{ env.GIT_TAG }} \
              models verify -dir /opt/alcatraz/models
          done

  # Preview build of hoophq/hoopagent, both slim flavours (see Dockerfile.agent).
  # Mirrors the release workflow. hoophq/hoopagent is a clean-only repository —
  # see the bright-line note in Dockerfile.agent before adding a tag here.
  docker-publish-hoopagent:
    runs-on: ubuntu-latest
    name: Publish Agent Image (hoopagent)
    needs:
      - build-tar-files
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-artifacts-*
          merge-multiple: true
          path: dist/
      - name: Set Git Tag
        run: echo "GIT_TAG=${{ github.event.pull_request.number }}.0.0-g$(git rev-parse --short ${{ github.event.pull_request.head.sha }})" >> $GITHUB_ENV
      - name: Build and push (minimal)
        uses: docker/build-push-action@v4
        with:
          file: ./Dockerfile.agent
          context: '.'
          target: minimal
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: |
            hoophq/hoopagent:${{ env.GIT_TAG }}-minimal
      - name: Build and push (distroless)
        uses: docker/build-push-action@v4
        with:
          file: ./Dockerfile.agent
          context: '.'
          target: distroless
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: |
            hoophq/hoopagent:${{ env.GIT_TAG }}-distroless

  publish-release:
    runs-on: ubuntu-latest
    name: Publish Release
    needs:
      - docker-publish-hoopgateway-multiarch
      - docker-publish-hoopagent-multiarch

    steps:
      - name: Checkout Hoop
        uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        id: download
        with:
          pattern: dist-artifacts-*
          merge-multiple: true
          path: dist/


      - name: Set Git Tag
        run: echo "GIT_TAG=${{ github.event.pull_request.number }}.0.0-g$(git rev-parse --short ${{ github.event.pull_request.head.sha }})" >> $GITHUB_ENV

      - name: Build Gateway Bundle (amd64)
        env:
          GIT_TAG: ${{ env.GIT_TAG }}
          GOARCH: amd64
        run: make build-gateway-bundle

      - name: Build Gateway Bundle (arm64)
        env:
          GIT_TAG: ${{ env.GIT_TAG }}
          GOARCH: arm64
        run: make build-gateway-bundle

      - name: Build Helm Chart
        env:
          GIT_TAG: "${{ env.GIT_TAG }}"
          GITHUB_CONTAINER_REGISTRY_TOKEN: ${{ secrets.GH_CONTAINER_REGISTRY_TOKEN }}
          GITHUB_USERNAME: ${{ github.actor }}
        run: make build-helm-chart

      - name: Publish Release
        env:
          GIT_TAG: ${{ env.GIT_TAG }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make release-s3

      - name: Comment on PR on Success
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GIT_TAG: ${{ env.GIT_TAG }}
        run: |-
          gh pr comment ${{ github.event.pull_request.number }} -b "✅ Build Completed with Success, Version=${GIT_TAG}" || true


  # PoC: scan the preview images for forbidden (AGPL-family) licenses and
  # keep a single reconciled PR comment: created/updated when findings
  # exist, updated to "resolved" when a later push fixes them. Non-blocking
  # on purpose while we evaluate the tool; make the check step fail to turn
  # it into a gate.
  license-scan:
    runs-on: ubuntu-latest
    name: License Scan (Trivy)
    # The preview images only exist for same-repo PRs (fork PRs cannot push
    # to Docker Hub), and this guard also keeps the PAT away from any
    # fork-triggered context.
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    permissions:
      contents: read
    needs:
      - docker-publish-hoopgateway-amd64
      - docker-publish-hoopagent-amd64
    steps:
      - name: Scan preview images
        run: |
          mkdir -p /tmp/license-scan
          for image in hoop hoopdev; do
            ref="hoophq/${image}:${{ github.sha }}-amd64"
            echo "scanning $ref"
            docker run --rm \
              -v /tmp/license-scan:/scan \
              aquasec/trivy:0.72.0 image \
              --scanners license \
              --format json \
              --quiet \
              --output "/scan/${image}.json" \
              "$ref"
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for forbidden licenses
        id: check
        run: |
          python3 scripts/ci/check-forbidden-licenses.py \
            --comment-out /tmp/license-scan/comment.json \
            hoophq/hoop=/tmp/license-scan/hoop.json \
            hoophq/hoopdev=/tmp/license-scan/hoopdev.json

      - name: Reconcile PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |-
          # Single sticky comment keyed by the marker: upsert on findings,
          # update to "resolved" when a previous finding disappears, stay
          # silent when the PR was never flagged.
          marker='<!-- trivy-license-scan -->'
          comment_id=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)

          if [ "${{ steps.check.outputs.found }}" = "true" ]; then
            if [ -n "$comment_id" ]; then
              gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" \
                --input /tmp/license-scan/comment.json
            else
              gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
                --input /tmp/license-scan/comment.json
            fi
          elif [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" \
              --input /tmp/license-scan/comment.json
          fi
