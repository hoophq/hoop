name: Test

on: pull_request

# proxy.golang.org intermittently resets HTTP/2 streams mid-download
# ("stream error: stream ID N; INTERNAL_ERROR; received from peer"). cmd/go
# turns that into a hard build failure after a ~60s stall: it does not retry,
# and the `direct` GOPROXY fallback only covers 404/410. Frame-level resets
# are HTTP/2-only, so fetch modules over HTTP/1.1.
env:
  GODEBUG: http2client=0

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          # This is a go.work workspace with no root go.mod, so setup-go
          # cannot find a manifest on its own and silently caches nothing.
          cache-dependency-path: "**/go.sum"
      # libhoop is a private module fetched from the proxy. GOPRIVATE keeps it
      # off proxy.golang.org and sum.golang.org; the credential rewrite lets
      # the direct fetch authenticate as the token.
      - name: Authenticate private modules
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "GOPRIVATE=github.com/hoophq/libhoop" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/hoophq/".insteadOf "https://github.com/hoophq/"

      # When this PR's branch is also open as a hoophq/libhoop PR, test
      # against that branch instead of the pinned release. No match keeps
      # the pin; see .github/actions/use-libhoop-pr.
      - name: Use libhoop PR branch when one is open
        uses: ./.github/actions/use-libhoop-pr
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Every Rust job here runs `make generate-wasm`, which is a release-mode
      # cargo build of gateway/rdp/wasm. Nothing else in the job builds Rust.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway/rdp/wasm

      # The workflow-level GODEBUG (see the header comment) downgrades every
      # go command's MODULE DOWNLOADS to HTTP/1.1, but it must not reach the
      # test runtime: sidecar/daemon's gRPC tests drive real h2c clients
      # through net/http, and http2client=0 turns every one of them into
      # "http: Transport does not support unencrypted HTTP/2". So the module
      # graph is fetched first, under the workaround, and the tests then run
      # with client HTTP/2 restored against a warm cache — the flaky
      # downloads and the h2c tests never share a process.
      - name: Download modules over HTTP/1.1
        run: go mod download

      - name: Test
        env:
          GODEBUG: http2client=1
        run: make test-oss

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Hoop
        uses: actions/checkout@v7

      # Integration tests drive the real controller.Agent against real upstream
      # containers via libhoop. Protocol proxying lives in the private
      # github.com/hoophq/libhoop module, which the Authenticate step below
      # makes fetchable; without those credentials the build fails outright
      # rather than degrading to no-op protocol handling. Matches the build
      # jobs in pullrequest-release.yml.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          # This is a go.work workspace with no root go.mod, so setup-go
          # cannot find a manifest on its own and silently caches nothing.
          cache-dependency-path: "**/go.sum"
      # libhoop is a private module fetched from the proxy. GOPRIVATE keeps it
      # off proxy.golang.org and sum.golang.org; the credential rewrite lets
      # the direct fetch authenticate as the token.
      - name: Authenticate private modules
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "GOPRIVATE=github.com/hoophq/libhoop" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/hoophq/".insteadOf "https://github.com/hoophq/"

      # When this PR's branch is also open as a hoophq/libhoop PR, test
      # against that branch instead of the pinned release. No match keeps
      # the pin; see .github/actions/use-libhoop-pr.
      - name: Use libhoop PR branch when one is open
        uses: ./.github/actions/use-libhoop-pr
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: agent/integration/testdata/mssql-jdbc/pom.xml
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Every Rust job here runs `make generate-wasm`, which is a release-mode
      # cargo build of gateway/rdp/wasm. Nothing else in the job builds Rust.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway/rdp/wasm

      # testcontainers-go manages container lifecycle itself via the Docker
      # daemon. ubuntu-latest runners have Docker pre-installed and running,
      # so no services: block is required. See:
      # https://golang.testcontainers.org/system_requirements/
      - name: Integration Test
        run: make test-integration

  transport-test:
    name: Transport Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Hoop
        uses: actions/checkout@v7

      # The transport harness drives the real gateway gRPC transport end to end
      # (real agent controller + real Postgres). Its PostgreSQL protocol
      # round-trip needs the enterprise proxy from the private
      # github.com/hoophq/libhoop module, which the Authenticate step below
      # makes fetchable; without those credentials the build fails outright
      # rather than degrading to no-op protocol handling.
      #
      # This runs as its own job (not folded into Integration Test) so its
      # Postgres containers do not contend on one runner with the heavy agent
      # suite's containers, which caused timeouts when the two ran in parallel.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          # This is a go.work workspace with no root go.mod, so setup-go
          # cannot find a manifest on its own and silently caches nothing.
          cache-dependency-path: "**/go.sum"
      # libhoop is a private module fetched from the proxy. GOPRIVATE keeps it
      # off proxy.golang.org and sum.golang.org; the credential rewrite lets
      # the direct fetch authenticate as the token.
      - name: Authenticate private modules
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "GOPRIVATE=github.com/hoophq/libhoop" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/hoophq/".insteadOf "https://github.com/hoophq/"

      # When this PR's branch is also open as a hoophq/libhoop PR, test
      # against that branch instead of the pinned release. No match keeps
      # the pin; see .github/actions/use-libhoop-pr.
      - name: Use libhoop PR branch when one is open
        uses: ./.github/actions/use-libhoop-pr
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Every Rust job here runs `make generate-wasm`, which is a release-mode
      # cargo build of gateway/rdp/wasm. Nothing else in the job builds Rust.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway/rdp/wasm

      - name: Transport Integration Test
        run: make test-transport

  gateway-smoke-test:
    name: Gateway Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Gateway smoke tests exercise only the HTTP API, auth, RBAC and the
      # model/migration layer — no protocol proxying — but the gateway still
      # links the private github.com/hoophq/libhoop module, so the build
      # needs credentials for it. No Rust toolchain either: the committed
      # rdp_parser.wasm is embedded via go:embed, so make test-gateway does
      # not regenerate it.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          # This is a go.work workspace with no root go.mod, so setup-go
          # cannot find a manifest on its own and silently caches nothing.
          cache-dependency-path: "**/go.sum"

      # libhoop is a private module fetched from the proxy. GOPRIVATE keeps it
      # off proxy.golang.org and sum.golang.org; the credential rewrite lets
      # the direct fetch authenticate as the token.
      - name: Authenticate private modules
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "GOPRIVATE=github.com/hoophq/libhoop" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/hoophq/".insteadOf "https://github.com/hoophq/"

      # When this PR's branch is also open as a hoophq/libhoop PR, test
      # against that branch instead of the pinned release. No match keeps
      # the pin; see .github/actions/use-libhoop-pr.
      - name: Use libhoop PR branch when one is open
        uses: ./.github/actions/use-libhoop-pr
        with:
          token: ${{ secrets.GH_TOKEN }}

      # Boots a throwaway postgres:17.6 via testcontainers; ubuntu-latest
      # runners have Docker pre-installed, so no services: block is needed.
      - name: Gateway Smoke Test
        run: make test-gateway

  gateway-smoke-test-pglite:
    name: Gateway Smoke Test (embedded PGlite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same smoke suite as gateway-smoke-test, but the state store is the
      # embedded PGlite (wasm) database — the standalone-mode regression net.
      # It fails on SQL the embedded backend cannot run and on code that
      # deadlocks the pool capped at one connection, both invisible on
      # regular PostgreSQL. Runs entirely in-process: no Docker, no
      # testcontainers.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          # This is a go.work workspace with no root go.mod, so setup-go
          # cannot find a manifest on its own and silently caches nothing.
          cache-dependency-path: "**/go.sum"

      # libhoop is a private module fetched from the proxy. GOPRIVATE keeps it
      # off proxy.golang.org and sum.golang.org; the credential rewrite lets
      # the direct fetch authenticate as the token.
      - name: Authenticate private modules
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "GOPRIVATE=github.com/hoophq/libhoop" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/hoophq/".insteadOf "https://github.com/hoophq/"

      # When this PR's branch is also open as a hoophq/libhoop PR, test
      # against that branch instead of the pinned release. No match keeps
      # the pin; see .github/actions/use-libhoop-pr.
      - name: Use libhoop PR branch when one is open
        uses: ./.github/actions/use-libhoop-pr
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Gateway Smoke Test (pglite)
        run: make test-gateway-pglite

  standalone-test:
    name: Standalone Mode Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Standalone-mode lifecycle suite (DEP-38): gateway on the embedded
      # PGlite database + the dedicated standalone agent provisioned through
      # the same code path `hoop start standalone` runs, connected via a
      # real agent controller. Runs entirely in-process: no Docker, no
      # protocol proxying, no Rust toolchain. The build still links the
      # private github.com/hoophq/libhoop module, so it needs credentials.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          # This is a go.work workspace with no root go.mod, so setup-go
          # cannot find a manifest on its own and silently caches nothing.
          cache-dependency-path: "**/go.sum"

      # libhoop is a private module fetched from the proxy. GOPRIVATE keeps it
      # off proxy.golang.org and sum.golang.org; the credential rewrite lets
      # the direct fetch authenticate as the token.
      - name: Authenticate private modules
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "GOPRIVATE=github.com/hoophq/libhoop" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/hoophq/".insteadOf "https://github.com/hoophq/"

      # When this PR's branch is also open as a hoophq/libhoop PR, test
      # against that branch instead of the pinned release. No match keeps
      # the pin; see .github/actions/use-libhoop-pr.
      - name: Use libhoop PR branch when one is open
        uses: ./.github/actions/use-libhoop-pr
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Standalone Mode Test
        run: make test-standalone

  standalone-e2e:
    name: Standalone Single-Binary E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Builds the real hoop CLI and runs `hoop start standalone` as a
      # subprocess: first boot (embedded PGlite initdb + migrations + agent
      # provisioning) and resume boot (cluster resume + persisted
      # credentials). The only job that tests the shipped artifact itself —
      # go:embed assets, CLI wiring, and the single-process composition.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          # This is a go.work workspace with no root go.mod, so setup-go
          # cannot find a manifest on its own and silently caches nothing.
          cache-dependency-path: "**/go.sum"

      # libhoop is a private module fetched from the proxy. GOPRIVATE keeps it
      # off proxy.golang.org and sum.golang.org; the credential rewrite lets
      # the direct fetch authenticate as the token.
      - name: Authenticate private modules
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "GOPRIVATE=github.com/hoophq/libhoop" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/hoophq/".insteadOf "https://github.com/hoophq/"

      # When this PR's branch is also open as a hoophq/libhoop PR, test
      # against that branch instead of the pinned release. No match keeps
      # the pin; see .github/actions/use-libhoop-pr.
      - name: Use libhoop PR branch when one is open
        uses: ./.github/actions/use-libhoop-pr
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Standalone Single-Binary E2E
        run: make test-standalone-e2e

  sidecar-e2e:
    name: Sidecar E2E Test
    runs-on: ubuntu-latest
    # 25, against the suite's own 10m `go test -timeout`. The gap is
    # deliberate headroom: module download, building hoop-inspect, pulling
    # mysql:8 and tearing containers down all happen inside the job budget
    # but outside Go's. Too small a gap and a slow runner is cancelled by
    # the workflow before Go can name the test that hung and print its
    # stack — that diagnostic is the whole point of the suite.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The only job that puts a real database behind a real sidecar: it boots
      # mysql:8 and runs the shipped hoop-inspect binary as a subprocess in
      # front of it. The unit suites exercise the codec in isolation and that
      # is not enough — two DEP-170 bugs, masking silently applying nothing and
      # an intermittent client hang during caching_sha2_password auth, passed
      # every unit test and only reproduced against a real server. That is what
      # this job costs its minutes for. The sidecar links the private
      # github.com/hoophq/libhoop module, so the build needs credentials for
      # it. No Rust or Java toolchain: this job does not run generate-wasm and
      # does not touch the MSSQL JDBC fixtures.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          # This is a go.work workspace with no root go.mod, so setup-go
          # cannot find a manifest on its own and silently caches nothing.
          cache-dependency-path: "**/go.sum"

      # libhoop is a private module fetched from the proxy. GOPRIVATE keeps it
      # off proxy.golang.org and sum.golang.org; the credential rewrite lets
      # the direct fetch authenticate as the token.
      - name: Authenticate private modules
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "GOPRIVATE=github.com/hoophq/libhoop" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/hoophq/".insteadOf "https://github.com/hoophq/"

      # When this PR's branch is also open as a hoophq/libhoop PR, test
      # against that branch instead of the pinned release. No match keeps
      # the pin; see .github/actions/use-libhoop-pr.
      - name: Use libhoop PR branch when one is open
        uses: ./.github/actions/use-libhoop-pr
        with:
          token: ${{ secrets.GH_TOKEN }}

      # testcontainers-go manages container lifecycle itself via the Docker
      # daemon. ubuntu-latest runners have Docker pre-installed and running,
      # so no services: block is required. See:
      # https://golang.testcontainers.org/system_requirements/
      # Same GODEBUG split as the Unit Test job, one step further removed:
      # the suite BUILDS hoop-inspect and runs it as a subprocess, which
      # inherits this environment — and a grpc lane's h2c upstream
      # transport dies under http2client=0. Downloads happen under the
      # workaround; the suite and the binary run with client HTTP/2 on.
      - name: Download modules over HTTP/1.1
        run: cd sidecar/e2e && go mod download

      - name: Sidecar E2E Test
        env:
          GODEBUG: http2client=1
        run: make test-sidecar-e2e