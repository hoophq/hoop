name: Test

on: pull_request

# A newer run for the same PR makes this one stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# proxy.golang.org intermittently resets HTTP/2 streams mid-download
# ("stream error: stream ID N; INTERNAL_ERROR; received from peer"). cmd/go
# turns that into a hard build failure after a ~60s stall: it does not retry,
# and the `direct` GOPROXY fallback only covers 404/410. Frame-level resets
# are HTTP/2-only, so fetch modules over HTTP/1.1.
env:
  GODEBUG: http2client=0

jobs:
  # One runner killed the whole suite when the big PGlite packages ran
  # together (ENG-760). scripts/ci/unit-shards.sh spreads them; the number
  # of legs here is SHARDS.
  test:
    name: Unit Test (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go with private modules
        uses: ./.github/actions/setup-go-private
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Every Rust job here runs `make generate-wasm`, which is a release-mode
      # cargo build of gateway/rdp/wasm. Nothing else in the job builds Rust.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway/rdp/wasm

      # The workflow-level GODEBUG (see the header comment) downgrades every
      # go command's MODULE DOWNLOADS to HTTP/1.1, but it must not reach the
      # test runtime: sidecar/daemon's gRPC tests drive real h2c clients
      # through net/http, and http2client=0 turns every one of them into
      # "http: Transport does not support unencrypted HTTP/2". So the module
      # graph is fetched first, under the workaround, and the tests then run
      # with client HTTP/2 restored against a warm cache — the flaky
      # downloads and the h2c tests never share a process.
      - name: Download modules over HTTP/1.1
        run: go mod download

      # The per-module sidecar loop runs in the Sidecar Module Test job.
      # shell: bash adds pipefail, so tee does not hide a failed test.
      - name: Test
        shell: bash
        env:
          GODEBUG: http2client=1
        run: make test-unit SHARD=${{ matrix.shard }} SHARDS=${{ strategy.job-total }} | tee "$RUNNER_TEMP/unit.jsonl"

      - name: List the packages this shard ran
        run: >-
          jq -rR 'fromjson? | select(.Test == null and (.Action == "pass" or .Action == "fail" or .Action == "skip")) | .Package'
          "$RUNNER_TEMP/unit.jsonl" > "$RUNNER_TEMP/packages-${{ matrix.shard }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: unit-packages-${{ matrix.shard }}
          path: ${{ runner.temp }}/packages-${{ matrix.shard }}.txt
          retention-days: 1

  # Fails when a package of go list ran in no Unit Test shard, or in two.
  test-shards:
    name: Unit Test (every package in one shard)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go with private modules
        uses: ./.github/actions/setup-go-private
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Download modules over HTTP/1.1
        run: go mod download

      - uses: actions/download-artifact@v8
        with:
          pattern: unit-packages-*
          merge-multiple: true
          path: ${{ runner.temp }}/shards
      - name: Check the union of the shards
        run: scripts/ci/unit-shards.sh check "$RUNNER_TEMP/shards"
      # A check that cannot fail passes forever: drop one package and expect it to.
      - name: Check that a dropped package fails the check
        run: |
          cp -R "$RUNNER_TEMP/shards" "$RUNNER_TEMP/dropped"
          sed -i 1d "$RUNNER_TEMP/dropped/packages-1.txt"
          if scripts/ci/unit-shards.sh check "$RUNNER_TEMP/dropped"; then
            echo "::error::the check passed with a package missing"; exit 1
          fi

  # The test-sidecar half of `make test-oss`, beside Unit Test: it enters
  # each nested sidecar module to prove its go.mod builds on its own.
  sidecar-modules:
    name: Sidecar Module Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go with private modules
        uses: ./.github/actions/setup-go-private
        with:
          token: ${{ secrets.GH_TOKEN }}

      # Same GODEBUG split as Unit Test: sidecar/daemon's gRPC tests need
      # client HTTP/2 (h2c), the module downloads need HTTP/1.1.
      - name: Download modules over HTTP/1.1
        run: go mod download

      - name: Sidecar Module Test
        env:
          GODEBUG: http2client=1
        run: make test-sidecar

  # The ica image links hoop-inspect with cgo and -tags ORT (Dockerfile.sidecar
  # --target ica); the other builds use CGO_ENABLED=0, which compiles out the
  # ORT NER backend and hugot's Rust tokenizer. This job links that cgo build,
  # so a change that breaks only the cgo path fails on the PR before it
  # reaches the release's image step. libtokenizers.a comes from the
  # daulet/tokenizers release at the version go.mod pins, the same source the
  # image uses. The binary dlopens libonnxruntime at run time, so this job
  # does not need it.
  sidecar-ica-ort:
    name: Sidecar ICA build (cgo, -tags ORT)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go with private modules
        uses: ./.github/actions/setup-go-private
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Fetch libtokenizers.a at the pinned version
        working-directory: sidecar/cmd
        run: |
          set -euo pipefail
          version=$(go list -m -f '{{.Version}}' github.com/daulet/tokenizers)
          mkdir -p "$RUNNER_TEMP/libtokenizers"
          curl -sSfL "https://github.com/daulet/tokenizers/releases/download/${version}/libtokenizers.linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/libtokenizers"
          echo "CGO_LDFLAGS=-L$RUNNER_TEMP/libtokenizers" >> "$GITHUB_ENV"

      - name: Link hoop-inspect with the ORT backend
        working-directory: sidecar/cmd
        env:
          CGO_ENABLED: "1"
        run: |
          go build -tags ORT -trimpath -o "$RUNNER_TEMP/hoop-inspect" .
          "$RUNNER_TEMP/hoop-inspect" -version

  # The test-sidecar-plugins third of `make test-oss`: the codec plug-in
  # SDKs and examples. Go and Rust only; the checked-in .wasm artifacts are
  # proven against the ABI with hoop-inspect. Rebuilding them needs TinyGo
  # and lld and lives in sidecar-plugins-pullrequest.yml, which runs only
  # when the plug-in tree changes.
  sidecar-plugins:
    name: Sidecar Plug-in Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go with private modules
        uses: ./.github/actions/setup-go-private
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sidecar/codec/wasm/sdk/rust
            sidecar/codec/wasm/examples/resp

      - name: Download modules over HTTP/1.1
        run: go mod download

      - name: Sidecar Plug-in Test
        env:
          GODEBUG: http2client=1
        run: make test-sidecar-plugins

  integration-test:
    name: Integration Test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One shard per upstream; containers start lazily, so each shard boots
    # only its own. "rest" skips the other shards' prefixes, so a test with
    # a new prefix still runs somewhere.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: postgres
            run: "^TestPG_"
          - shard: mysql
            run: "^TestMy"
          - shard: mssql
            run: "^TestMSSQL"
          - shard: mongodb
            run: "^TestMongo"
          - shard: rest
            skip: "^(TestPG_|TestMy|TestMSSQL|TestMongo)"

    steps:
      - name: Checkout Hoop
        uses: actions/checkout@v7

      # Integration tests drive the real controller.Agent against real upstream
      # containers via libhoop. Protocol proxying lives in the private
      # github.com/hoophq/libhoop module, which the Go setup step below
      # makes fetchable; without those credentials the build fails outright
      # rather than degrading to no-op protocol handling. Matches the build
      # jobs in pullrequest-release.yml.
      - name: Setup Go with private modules
        uses: ./.github/actions/setup-go-private
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: agent/integration/testdata/mssql-jdbc/pom.xml
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Every Rust job here runs `make generate-wasm`, which is a release-mode
      # cargo build of gateway/rdp/wasm. Nothing else in the job builds Rust.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway/rdp/wasm

      # testcontainers-go manages container lifecycle itself via the Docker
      # daemon. ubuntu-latest runners have Docker pre-installed and running,
      # so no services: block is required. See:
      # https://golang.testcontainers.org/system_requirements/
      - name: Integration Test
        env:
          INTEGRATION_RUN: ${{ matrix.run }}
          INTEGRATION_SKIP: ${{ matrix.skip }}
        run: make test-integration

  transport-test:
    name: Transport Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Hoop
        uses: actions/checkout@v7

      # The transport harness drives the real gateway gRPC transport end to end
      # (real agent controller + real Postgres). Its PostgreSQL protocol
      # round-trip needs the enterprise proxy from the private
      # github.com/hoophq/libhoop module, which the Go setup step below
      # makes fetchable; without those credentials the build fails outright
      # rather than degrading to no-op protocol handling.
      #
      # This runs as its own job (not folded into Integration Test) so its
      # Postgres containers do not contend on one runner with the heavy agent
      # suite's containers, which caused timeouts when the two ran in parallel.
      - name: Setup Go with private modules
        uses: ./.github/actions/setup-go-private
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Every Rust job here runs `make generate-wasm`, which is a release-mode
      # cargo build of gateway/rdp/wasm. Nothing else in the job builds Rust.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway/rdp/wasm

      - name: Transport Integration Test
        run: make test-transport

  gateway-smoke-test:
    name: Gateway Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Gateway smoke tests exercise only the HTTP API, auth, RBAC and the
      # model/migration layer — no protocol proxying — but the gateway still
      # links the private github.com/hoophq/libhoop module, so the build
      # needs credentials for it. No Rust toolchain either: the committed
      # rdp_parser.wasm is embedded via go:embed, so make test-gateway does
      # not regenerate it.
      - name: Setup Go with private modules
        uses: ./.github/actions/setup-go-private
        with:
          token: ${{ secrets.GH_TOKEN }}

      # Boots a throwaway postgres:17.6 via testcontainers; ubuntu-latest
      # runners have Docker pre-installed, so no services: block is needed.
      - name: Gateway Smoke Test
        run: make test-gateway

  gateway-smoke-test-pglite:
    name: Gateway Smoke Test (embedded PGlite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same smoke suite as gateway-smoke-test, but the state store is the
      # embedded PGlite (wasm) database — the standalone-mode regression net.
      # It fails on SQL the embedded backend cannot run and on code that
      # deadlocks the pool capped at one connection, both invisible on
      # regular PostgreSQL. Runs entirely in-process: no Docker, no
      # testcontainers.
      - name: Setup Go with private modules
        uses: ./.github/actions/setup-go-private
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Gateway Smoke Test (pglite)
        run: make test-gateway-pglite

  standalone-test:
    name: Standalone Mode Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Standalone-mode lifecycle suite (DEP-38): gateway on the embedded
      # PGlite database + the dedicated standalone agent provisioned through
      # the same code path `hoop start standalone` runs, connected via a
      # real agent controller. Runs entirely in-process: no Docker, no
      # protocol proxying, no Rust toolchain. The build still links the
      # private github.com/hoophq/libhoop module, so it needs credentials.
      - name: Setup Go with private modules
        uses: ./.github/actions/setup-go-private
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Standalone Mode Test
        run: make test-standalone

  standalone-e2e:
    name: Standalone Single-Binary E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Builds the real hoop CLI and runs `hoop start standalone` as a
      # subprocess: first boot (embedded PGlite initdb + migrations + agent
      # provisioning) and resume boot (cluster resume + persisted
      # credentials). The only job that tests the shipped artifact itself —
      # go:embed assets, CLI wiring, and the single-process composition.
      - name: Setup Go with private modules
        uses: ./.github/actions/setup-go-private
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Standalone Single-Binary E2E
        run: make test-standalone-e2e

  controlplane-readonly:
    name: Control Plane Read-only Boot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Builds both Dockerfile.controlplane flavours and boots each with
      # --read-only against a throwaway PostgreSQL (ENG-602). Fails when the
      # boot needs a writable path that the image does not provide.
      - name: Setup Go with private modules
        uses: ./.github/actions/setup-go-private
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Control Plane Read-only Boot
        run: make test-controlplane-readonly

  sidecar-e2e:
    name: Sidecar E2E Test
    runs-on: ubuntu-latest
    # 25, against the suite's own 10m `go test -timeout`. The gap is
    # deliberate headroom: module download, building hoop-inspect, pulling
    # mysql:8 and tearing containers down all happen inside the job budget
    # but outside Go's. Too small a gap and a slow runner is cancelled by
    # the workflow before Go can name the test that hung and print its
    # stack — that diagnostic is the whole point of the suite.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The only job that puts a real database behind a real sidecar: it boots
      # mysql:8 and runs the shipped hoop-inspect binary as a subprocess in
      # front of it. The unit suites exercise the codec in isolation and that
      # is not enough — two DEP-170 bugs, masking silently applying nothing and
      # an intermittent client hang during caching_sha2_password auth, passed
      # every unit test and only reproduced against a real server. That is what
      # this job costs its minutes for. The sidecar links the private
      # github.com/hoophq/libhoop module, so the build needs credentials for
      # it. No Rust or Java toolchain: this job does not run generate-wasm and
      # does not touch the MSSQL JDBC fixtures.
      - name: Setup Go with private modules
        uses: ./.github/actions/setup-go-private
        with:
          token: ${{ secrets.GH_TOKEN }}

      # testcontainers-go manages container lifecycle itself via the Docker
      # daemon. ubuntu-latest runners have Docker pre-installed and running,
      # so no services: block is required. See:
      # https://golang.testcontainers.org/system_requirements/
      # Same GODEBUG split as the Unit Test job, one step further removed:
      # the suite BUILDS hoop-inspect and runs it as a subprocess, which
      # inherits this environment — and a grpc lane's h2c upstream
      # transport dies under http2client=0. Downloads happen under the
      # workaround; the suite and the binary run with client HTTP/2 on.
      - name: Download modules over HTTP/1.1
        run: cd sidecar/e2e && go mod download

      - name: Sidecar E2E Test
        env:
          GODEBUG: http2client=1
        run: make test-sidecar-e2e
  sidecar-compat:
    name: Sidecar Config Compat
    runs-on: ubuntu-latest

    steps:
      # The previous release must decode the document this plane serves
      # (EVL-338): a 1.197 sidecar crash-looped on a key a 1.198 plane sent.
      # The test builds that release's decoder from its tag, so it needs the
      # tags and their history.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Both trees link the private github.com/hoophq/libhoop module.
      # Only HEAD follows a libhoop PR branch; the release tree keeps its pin.
      - name: Setup Go with private modules
        uses: ./.github/actions/setup-go-private
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Sidecar Config Compat
        run: make test-sidecar-compat

  # A libhoop pin must name a commit on libhoop main (ENG-821). A commit on a
  # PR branch dies with the branch: #1986 pinned one, libhoop squash-merged and
  # deleted the branch, and every Go build failed with "unknown revision".
  # The use-libhoop-pr switch above does not bump the pin, so it still passes.
  libhoop-pin:
    name: libhoop Pin On Main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # go mod edit -json only parses the go.mod files; nothing is fetched.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - name: libhoop pins are on libhoop main
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: scripts/ci/check-libhoop-pins.sh

  # Development Release builds webapp_v2 only after the CLJS bundle; fail fast here.
  webapp-v2:
    name: Webapp v2 Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webapp_v2

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Matches the release build; DEP-306 moves both off Node 20.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp_v2/package-lock.json

      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
