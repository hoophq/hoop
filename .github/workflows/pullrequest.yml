name: Test

on: pull_request

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Test
        run: make test-oss

  rust-test-oss:
    name: Rust Unit Test (OSS stub)
    runs-on: ubuntu-latest

    # No libhoop checkout: libhoop-map symlinks _libhoop, so agentrs resolves
    # its hoop-rdp-guard path dependency to the OSS stub. This is the job that
    # proves an OSS clone still builds a working (unguarded) RDP agent and
    # that the stub satisfies every consumer of the guard seam.
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Test
        run: make test-rust

  rdp-plumbing-test:
    name: RDP Plumbing E2E (FreeRDP shadow)
    runs-on: ubuntu-latest

    # Drives the agent's real IronRDP connect path against a real RDP server
    # in a container: X.224 negotiation -> TLS -> CredSSP/NLA -> capability
    # exchange -> update stream. Asserts the two properties the PII guard
    # depends on — that NLA completes at all, and that the server delivers
    # plain Fast-Path Bitmap updates rather than SurfaceCommands.
    #
    # Uses the OSS stub, so it covers transport only. Detection needs OCR and
    # Presidio and is out of scope here. FreeRDP's NLA is also not Microsoft's,
    # so this is plumbing validation, not Windows conformance.
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: RDP plumbing E2E
        run: make test-rdp-plumbing

  rust-test-enterprise:
    name: Rust Unit Test (libhoop)
    needs: resolve-libhoop
    runs-on: ubuntu-latest

    # The same suite against the real guard crate. agentrs/tests/guard_surface.rs
    # is the point: it is the written contract for the guard boundary, and it
    # only keeps the OSS stub and the enterprise crate from drifting apart if
    # it runs under BOTH flavors. This job is the enterprise half.
    #
    # Also the only PR job that compiles the enterprise crate's own 112 tests,
    # including the adversarial hold-and-release leak suite.
    #
    # As in the integration jobs, libhoop-ensure leaves this checkout alone:
    # it only creates the stub symlink when ./libhoop does not already exist.
    steps:
      - name: Checkout Hoop
        uses: actions/checkout@v3

      - name: Checkout libhoop
        uses: actions/checkout@v3
        with:
          repository: hoophq/libhoop
          path: "./libhoop"
          token: ${{ secrets.GH_TOKEN }}
          ref: ${{ needs.resolve-libhoop.outputs.sha }}

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Test
        run: make test-rust

      # Proves the release path: with libhoop present the enforcement engine
      # must actually be linked. Cheap here, and it means a broken checkout
      # step is caught on the PR rather than at release time.
      - name: Assert enforcement engine is linked
        run: cd agentrs && cargo check --features require-enforcement

  resolve-libhoop:
    name: Resolve libhoop Revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      paired: ${{ steps.resolve.outputs.paired }}
      base: ${{ steps.resolve.outputs.base }}

    steps:
      - name: Checkout libhoop default branch
        uses: actions/checkout@v3
        with:
          repository: hoophq/libhoop
          token: ${{ secrets.GH_TOKEN }}

      # Cross-repository changes use the same branch name in Hoop and libhoop.
      # Pin its current commit once for every dependent job. A missing paired
      # branch falls back to the default branch checked out above; remote
      # failures remain fatal rather than silently testing the wrong revision.
      - name: Resolve paired libhoop revision
        id: resolve
        env:
          HOOP_HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          base="$(gh api repos/hoophq/libhoop --jq .default_branch)"
          set +e
          paired_ref="$(git ls-remote --exit-code --heads origin "refs/heads/${HOOP_HEAD_REF}")"
          status=$?
          set -e

          case "${status}" in
            0)
              sha="${paired_ref%%[[:space:]]*}"
              paired=true
              ;;
            2)
              sha="$(git rev-parse HEAD)"
              paired=false
              ;;
            *)
              exit "${status}"
              ;;
          esac

          {
            echo "sha=${sha}"
            echo "paired=${paired}"
            echo "base=${base}"
          } >> "${GITHUB_OUTPUT}"

  libhoop-dependency:
    name: Libhoop Dependency Merge
    needs: resolve-libhoop
    runs-on: ubuntu-latest

    steps:
      - name: Require paired libhoop revision to be merged
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          HOOP_HEAD_REF: ${{ github.head_ref }}
          LIBHOOP_PAIRED: ${{ needs.resolve-libhoop.outputs.paired }}
          LIBHOOP_SHA: ${{ needs.resolve-libhoop.outputs.sha }}
          LIBHOOP_BASE: ${{ needs.resolve-libhoop.outputs.base }}
        run: |
          set -euo pipefail

          if [[ "${LIBHOOP_PAIRED}" != "true" ]]; then
            echo "No paired libhoop branch; testing its default branch."
            exit 0
          fi

          pulls="$(
            gh api --method GET "repos/hoophq/libhoop/commits/${LIBHOOP_SHA}/pulls" \
              -H "Accept: application/vnd.github+json" \
              -F per_page=100
          )"
          merged_pr_url="$(
            jq -r --arg base "${LIBHOOP_BASE}" \
              '[.[] | select(.base.ref == $base and .merged_at != null) | .html_url][0] // empty' \
              <<<"${pulls}"
          )"

          if [[ -n "${merged_pr_url}" ]]; then
            echo "Paired libhoop revision is merged: ${merged_pr_url}"
            exit 0
          fi

          dependency_pr_url="$(
            jq -r --arg base "${LIBHOOP_BASE}" \
              '[.[] | select(.base.ref == $base) | .html_url][0] // empty' \
              <<<"${pulls}"
          )"
          dependency_target="${dependency_pr_url:-https://github.com/hoophq/libhoop/tree/${HOOP_HEAD_REF}}"
          echo "::error title=Unmerged libhoop dependency::Merge ${dependency_target} before this Hoop pull request."
          exit 1

  integration-test:
    name: Integration Test
    needs: resolve-libhoop
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Hoop
        uses: actions/checkout@v3

      # Integration tests drive the real controller.Agent against real upstream
      # containers via libhoop. The OSS _libhoop stub returns "missing protocol
      # hoop library for X" for every protocol, so we need the enterprise
      # libhoop checked out at ./libhoop. The Makefile's libhoop-map target
      # tries to overwrite this with a symlink, but `rm libhoop || true` is a
      # no-op against a non-empty directory — the checkout wins. Matches the
      # build jobs in pullrequest-release.yml.
      - name: Checkout libhoop
        uses: actions/checkout@v3
        with:
          repository: hoophq/libhoop
          path: "./libhoop"
          token: ${{ secrets.GH_TOKEN }}
          ref: ${{ needs.resolve-libhoop.outputs.sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: agent/integration/testdata/mssql-jdbc/pom.xml
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      # testcontainers-go manages container lifecycle itself via the Docker
      # daemon. ubuntu-latest runners have Docker pre-installed and running,
      # so no services: block is required. See:
      # https://golang.testcontainers.org/system_requirements/
      - name: Integration Test
        run: make test-integration

  transport-test:
    name: Transport Integration Test
    needs: resolve-libhoop
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Hoop
        uses: actions/checkout@v3

      # The transport harness drives the real gateway gRPC transport end to end
      # (real agent controller + real Postgres). Its PostgreSQL protocol
      # round-trip needs the enterprise libhoop proxy — the OSS _libhoop stub
      # returns "missing protocol hoop library" and that one test skips. Same
      # ./libhoop checkout trick as the Integration Test job (libhoop-map's
      # `rm libhoop || true` is a no-op against this non-empty directory).
      #
      # This runs as its own job (not folded into Integration Test) so its
      # Postgres containers do not contend on one runner with the heavy agent
      # suite's containers, which caused timeouts when the two ran in parallel.
      - name: Checkout libhoop
        uses: actions/checkout@v3
        with:
          repository: hoophq/libhoop
          path: "./libhoop"
          token: ${{ secrets.GH_TOKEN }}
          ref: ${{ needs.resolve-libhoop.outputs.sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Transport Integration Test
        run: make test-transport

  gateway-smoke-test:
    name: Gateway Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Gateway smoke tests exercise only the HTTP API, auth, RBAC and the
      # model/migration layer — no protocol proxying — so the OSS _libhoop
      # stub (wired by libhoop-map) is sufficient. No libhoop checkout and no
      # GH_TOKEN are required. No Rust toolchain either: the committed
      # rdp_parser.wasm is embedded via go:embed, so make test-gateway does
      # not regenerate it.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work

      # Boots a throwaway postgres:17.6 via testcontainers; ubuntu-latest
      # runners have Docker pre-installed, so no services: block is needed.
      - name: Gateway Smoke Test
        run: make test-gateway

  gateway-smoke-test-pglite:
    name: Gateway Smoke Test (embedded PGlite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Same smoke suite as gateway-smoke-test, but the state store is the
      # embedded PGlite (wasm) database — the standalone-mode regression net.
      # It fails on SQL the embedded backend cannot run and on code that
      # deadlocks the pool capped at one connection, both invisible on
      # regular PostgreSQL. Runs entirely in-process: no Docker, no
      # testcontainers.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work

      - name: Gateway Smoke Test (pglite)
        run: make test-gateway-pglite

  standalone-test:
    name: Standalone Mode Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Standalone-mode lifecycle suite (DEP-38): gateway on the embedded
      # PGlite database + the dedicated standalone agent provisioned through
      # the same code path `hoop start standalone` runs, connected via a
      # real agent controller. Runs entirely in-process: no Docker, no
      # enterprise libhoop, no Rust toolchain.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work

      - name: Standalone Mode Test
        run: make test-standalone

  standalone-e2e:
    name: Standalone Single-Binary E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Builds the real hoop CLI and runs `hoop start standalone` as a
      # subprocess: first boot (embedded PGlite initdb + migrations + agent
      # provisioning) and resume boot (cluster resume + persisted
      # credentials). The only job that tests the shipped artifact itself —
      # go:embed assets, CLI wiring, and the single-process composition.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work

      - name: Standalone Single-Binary E2E
        run: make test-standalone-e2e