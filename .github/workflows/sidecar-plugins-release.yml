name: Sidecar Plug-in SDK Release

# One tag, `hoop-codec-vX.Y.Z`, publishes the three plug-in SDKs. It is
# pushed by sidecar-plugins-autotag.yml when a merge to main changes
# sdk/VERSION. From it this workflow publishes the Rust crate to
# crates.io, tags the Go module `sidecar/codec/wasm/sdk/tinygo/vX.Y.Z`
# (Go's nested-module rule makes the tag the module path below the repo
# root plus the version, so the tag IS the publication), and opens a PR
# against hoophq/plugins that pins the examples to vX.Y.Z and carries the
# C header, which is how the C SDK is published. It creates no GitHub
# release: this repository's release list is the product's.
on:
  push:
    tags:
      - "hoop-codec-v*"

permissions:
  contents: write

# One run per tag at a time: a re-run started while the first is still
# publishing would race it on the Go tag and the mirror PR.
concurrency:
  group: sidecar-plugins-release-${{ github.ref }}
  cancel-in-progress: false

# proxy.golang.org intermittently resets HTTP/2 streams mid-download
# ("stream error: stream ID N; INTERNAL_ERROR; received from peer"). cmd/go
# turns that into a hard build failure after a ~60s stall: it does not retry,
# and the `direct` GOPROXY fallback only covers 404/410. Frame-level resets
# are HTTP/2-only, so fetch modules over HTTP/1.1.
env:
  GODEBUG: http2client=0

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A tag build has no PR branch to track, so the libhoop PR switch is off.
      - name: Setup Go with private modules
        uses: ./.github/actions/setup-go-private
        with:
          token: ${{ secrets.GH_TOKEN }}
          libhoop-pr: "false"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # The memcache example is TinyGo. Its Linux package carries the
      # wasm-opt it prefers; apt's binaryen is the fallback for a release
      # that ships without one.
      - name: Setup TinyGo
        uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: 0.43.0
      - name: Install binaryen
        run: sudo apt-get install -y binaryen

      # The sqlframe example is C++ against sdk/c/hoop_codec.h: clang for
      # the wasm32 target, lld for wasm-ld.
      - name: Install clang and lld
        run: sudo apt-get install -y clang lld

      # The workflow-level GODEBUG (see the header comment) applies to the
      # module downloads only: the tests run with client HTTP/2 restored,
      # the same split as the Unit Test job.
      - name: Download modules over HTTP/1.1
        run: go mod download

      - name: Test
        env:
          GODEBUG: http2client=1
        run: make test-sidecar-plugins

      # Every checked-in artifact rebuilt from source. Each build.sh writes
      # over the checked-in copy, so the compare below reads the committed
      # bytes back from git.
      - name: Rebuild artifacts
        env:
          CC: clang++
        run: |
          set -euo pipefail
          sidecar/codec/wasm/sdk/rust/examples/acmewire/build.sh
          sidecar/codec/wasm/examples/resp/build.sh
          sidecar/codec/wasm/examples/memcache/build.sh
          sidecar/codec/wasm/examples/sqlframe/build.sh

      # Not a byte compare: rustc on Linux emits a module a few hundred
      # bytes different from the macOS build of the same source, and Rust
      # promises no cross-OS reproducibility. The rebuilt file is proven
      # with the conformance runner against the fixtures the checked-in one
      # passed in `make test-sidecar-plugins` above; the publish job ships
      # the checked-in copies, so a broken rebuild here still stops them.
      - name: Prove the rebuilt artifacts
        run: |
          set -euo pipefail
          w=sidecar/codec/wasm
          bin=$w/.build/hoop-inspect
          test -x "$bin" || (cd sidecar/cmd && env CGO_ENABLED=0 go build -o "../../$bin" .)
          "$bin" -codec-test $w/testdata/acmewire.wasm $w/testdata/acmewire.fixtures.json
          for e in resp memcache sqlframe; do
            "$bin" -codec-test $w/examples/$e/$e.wasm $w/examples/$e/fixtures.json
          done

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 20

    steps:
      # The Go tag step below checks the existing tags, so the checkout
      # needs all of them.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # The version is decided here, before anything is published, so a
      # run that cannot complete fails with nothing half shipped. The tag
      # names it; sdk/VERSION and Cargo.toml must say the same, because
      # cargo publishes what Cargo.toml says and the Go module and the C
      # header are released under what the tag says.
      - name: Resolve version
        id: versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#hoop-codec-v}"
          sdk_version=$(sidecar/codec/wasm/sdk/version.sh)
          if [ "$version" != "$sdk_version" ]; then
            echo "::error::tag $TAG names $version but sidecar/codec/wasm/sdk/VERSION says $sdk_version; the tag was not made by sidecar-plugins-autotag.yml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse "refs/tags/${TAG}^{commit}")" >> "$GITHUB_OUTPUT"

      # Go resolves `sdk/tinygo@vX.Y.Z` to the tag below at the commit the
      # Rust tag names, so the three SDKs come from one tree. A version the
      # proxy may already have served cannot move: the tag at another
      # commit is a different release and fails. The same commit is a rerun
      # and skips. The push uses the default GITHUB_TOKEN on purpose: a
      # push with it triggers no workflow, and this tag must not start a
      # second run of this one.
      - name: Tag the Go module
        env:
          VERSION: ${{ steps.versions.outputs.version }}
          COMMIT: ${{ steps.versions.outputs.commit }}
        run: |
          set -euo pipefail
          tag="sidecar/codec/wasm/sdk/tinygo/v${VERSION}"
          if existing=$(git rev-parse -q --verify "refs/tags/${tag}^{commit}"); then
            if [ "$existing" != "$COMMIT" ]; then
              echo "::error::${tag} exists at ${existing}, not at ${COMMIT}; v${VERSION} of the Go module is another tree, bump sidecar/codec/wasm/sdk/VERSION"
              exit 1
            fi
            echo "${tag} already at ${COMMIT}"
            exit 0
          fi
          git tag "$tag" "$COMMIT"
          # A rejected push means another run created the tag between the
          # check above and here. That is a success when the remote tag is
          # at this commit, and the same error as above when it is not.
          if ! git push origin "refs/tags/${tag}"; then
            git fetch origin "refs/tags/${tag}:refs/remotes/origin/tags/${tag}"
            remote=$(git rev-parse "refs/remotes/origin/tags/${tag}^{commit}")
            if [ "$remote" != "$COMMIT" ]; then
              echo "::error::${tag} exists at ${remote}, not at ${COMMIT}; v${VERSION} of the Go module is another tree, bump sidecar/codec/wasm/sdk/VERSION"
              exit 1
            fi
            echo "${tag} already at ${COMMIT} (pushed by another run)"
            exit 0
          fi
          echo "pushed ${tag} at ${COMMIT}"

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --manifest-path sidecar/codec/wasm/sdk/rust/Cargo.toml

      # No GitHub release. One would sit in this repository's release list
      # beside the product releases, which the deploy tooling reads as
      # "newest release = version to deploy"; the plug-in SDK is not a
      # product release and must not appear there. The header and the ABI
      # text travel in the examples PR below instead, so hoophq/plugins is
      # where a C vendor fetches them.

      - name: Checkout hoophq/plugins
        uses: actions/checkout@v7
        with:
          repository: hoophq/plugins
          token: ${{ secrets.GH_TOKEN }}
          path: plugins

      # The examples in this tree depend on the SDKs by relative path. The
      # copies in hoophq/plugins stand alone, so each dependency becomes
      # the published version: the crates.io version for Rust, the module
      # tag for Go, and for C++ the header itself beside the source. The
      # header, the ABI text and the SDK version also land under sdk/ in
      # that repository: it is the C SDK's publication. Every rewrite
      # checks that its line existed: a sed with no match would ship a
      # path dependency into a repository that has no such path.
      - name: Rewrite examples to the published SDKs
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          src=sidecar/codec/wasm/examples
          dst=plugins/examples
          mkdir -p "$dst"
          for name in resp memcache sqlframe; do
            rsync -a --delete --exclude target/ --exclude dist/ "$src/$name/" "$dst/$name/"
          done

          cargo_toml="$dst/resp/Cargo.toml"
          grep -q '^hoop-codec = { path = "../../sdk/rust" }$' "$cargo_toml"
          sed -i 's#^hoop-codec = { path = "../../sdk/rust" }$#hoop-codec = "'"$VERSION"'"#' "$cargo_toml"

          (
            cd "$dst/memcache"
            export GOWORK=off
            go mod edit \
              -dropreplace=github.com/hoophq/hoop/sidecar/codec/wasm/sdk/tinygo \
              -require=github.com/hoophq/hoop/sidecar/codec/wasm/sdk/tinygo@v"$VERSION"
            # The tag was pushed moments ago: fetch it from GitHub directly
            # instead of waiting for the proxy and the checksum database to
            # notice it. go.sum still records the hash of what was fetched.
            GOPROXY=direct GONOSUMDB=github.com/hoophq/hoop go mod tidy
          )

          build_sh="$dst/sqlframe/build.sh"
          grep -q '^include="\$here/../../sdk/c"$' "$build_sh"
          sed -i 's#^include="\$here/../../sdk/c"$#include="$here"#' "$build_sh"
          cp sidecar/codec/wasm/sdk/c/hoop_codec.h "$dst/sqlframe/hoop_codec.h"

          mkdir -p plugins/sdk/c
          cp sidecar/codec/wasm/sdk/c/hoop_codec.h plugins/sdk/c/hoop_codec.h
          cp sidecar/codec/wasm/abi/ABI.md plugins/sdk/ABI.md
          echo "$VERSION" > plugins/sdk/VERSION

      - name: Open the examples PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_TOKEN }}
          path: plugins
          branch: sidecar-plugins/v${{ steps.versions.outputs.version }}
          commit-message: "examples: pin to SDK v${{ steps.versions.outputs.version }}"
          title: "examples: SDK v${{ steps.versions.outputs.version }}"
          body: |
            Examples from hoophq/hoop at `${{ github.ref_name }}`, pinned to
            `hoop-codec = "${{ steps.versions.outputs.version }}"` and
            `github.com/hoophq/hoop/sidecar/codec/wasm/sdk/tinygo@v${{ steps.versions.outputs.version }}`.
            `sdk/c/hoop_codec.h`, `sdk/ABI.md` and `sdk/VERSION` are the C SDK at this version.
            Source: https://github.com/hoophq/hoop/tree/${{ github.ref_name }}/sidecar/codec/wasm
