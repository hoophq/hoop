# Validates the Helm charts on every PR that touches them. Its main job is to
# catch breakage in the DEP-66 clean-line wrapper charts (hoop-ng / hoopagent-ng)
# before release: they depend on the base charts via file:// and only override
# image defaults, so a base-chart rename or version bump can break only the
# wrappers — which otherwise wouldn't surface until `make build-helm-chart` at
# release time.
#
# It also covers the sidecar and control plane charts, for a different reason:
# those charts refuse to render a Deployment that cannot start, and their guards
# are the only thing standing between a typo and a CrashLoopBackOff. A guard
# that silently stopped firing looks exactly like a chart that works.
name: helm-charts

on:
  pull_request:
    paths:
      - deploy/helm-chart/**
      - .github/workflows/helm-charts.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Lint + render charts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.2
      - name: Build wrapper dependencies
        run: |
          helm dependency build ./deploy/helm-chart/chart/hoop-ng
          helm dependency build ./deploy/helm-chart/chart/hoopagent-ng
      - name: Lint charts
        run: |
          helm lint ./deploy/helm-chart/chart/gateway
          helm lint ./deploy/helm-chart/chart/agent
          helm lint ./deploy/helm-chart/chart/hoop-ng
          helm lint ./deploy/helm-chart/chart/hoopagent-ng
          # The sidecar chart has no startable default: a config naming no
          # listeners does not start, so the chart refuses to render one. Lint
          # it against the smallest values that pass its guards.
          helm lint ./deploy/helm-chart/chart/sidecar \
            --set config.admin.listen=0.0.0.0:19000
          # Same for the control plane: POSTGRES_DB_URI and API_URL are
          # required, so there is no startable default to lint against.
          helm lint ./deploy/helm-chart/chart/controlplane \
            --set config.POSTGRES_DB_URI=postgres://u:p@h:5432/db \
            --set config.API_URL=https://cp.example.tld
      - name: Assert clean line renders the -ng images
        run: |
          set -euo pipefail
          gw=$(helm template t ./deploy/helm-chart/chart/hoop-ng \
            --set hoop-chart.config.POSTGRES_DB_URI=postgres://u:p@h:5432/db \
            --set hoop-chart.config.API_URL=https://example.tld \
            --set hoop-chart.defaultAgent.enabled=true)
          echo "$gw" | grep -q 'hoophq/hoop-ng:' \
            || { echo "::error::hoop-ng did not render hoophq/hoop-ng"; exit 1; }
          echo "$gw" | grep -q 'hoophq/hoopdev-ng:' \
            || { echo "::error::hoop-ng did not render hoophq/hoopdev-ng"; exit 1; }
          ag=$(helm template t ./deploy/helm-chart/chart/hoopagent-ng)
          echo "$ag" | grep -q 'hoophq/hoopdev-ng:' \
            || { echo "::error::hoopagent-ng did not render hoophq/hoopdev-ng"; exit 1; }
          echo "clean-line charts resolve dependencies and render the -ng images"

      - name: Assert the sidecar chart renders and its guards hold
        run: |
          set -euo pipefail
          chart=./deploy/helm-chart/chart/sidecar

          sc=$(helm template t "$chart" \
            --set config.admin.listen=0.0.0.0:19000 \
            --set config.listeners[0].name=appdb \
            --set config.listeners[0].protocol=postgres \
            --set config.listeners[0].listen=0.0.0.0:15432 \
            --set config.listeners[0].upstream=appdb:5432)

          echo "$sc" | grep -q 'hoophq/hoopsidecar:' \
            || { echo "::error::sidecar chart did not render hoophq/hoopsidecar"; exit 1; }
          # The image entrypoint runs the relay. A command here would mean the
          # chart is overriding it again, which is what the image exists to avoid.
          echo "$sc" | grep -qE '^ *(command|args):' \
            && { echo "::error::sidecar chart emitted a command/args override"; exit 1; }
          # 19000 is hardcoded in the Deployment, the Service and both probes.
          # Any other port number means one of the four drifted.
          if echo "$sc" | grep -E 'containerPort:|targetPort:|port:' | grep -qv 19000; then
            echo "::error::sidecar chart declared a port other than the admin port 19000"
            exit 1
          fi

          # Each of these MUST fail to render. A guard that stopped firing ships
          # a Deployment that cannot start, and nothing else in CI would notice.
          guard() {
            local why=$1; shift
            if helm template t "$chart" "$@" >/dev/null 2>&1; then
              echo "::error::sidecar chart guard no longer fires: $why"
              exit 1
            fi
          }
          guard "no config source"      
          guard "config + existingConfigMap" --set config.admin.listen=0.0.0.0:19000 --set existingConfigMap=x
          guard "control plane, no token" --set controlPlane.url=https://cp.example.com
          guard "token, no control plane" --set controlPlane.token=t --set config.admin.listen=0.0.0.0:19000
          guard "admin server disabled"   --set config.log_level=info
          guard "admin on a wrong port"   --set config.admin.listen=0.0.0.0:9901

          echo "sidecar chart renders hoophq/hoopsidecar on 19000 and all six guards fire"

          # Two releases in one namespace must be independent: the chart is
          # installed once per upstream it fronts. A hardcoded resource name or
          # a selector without the instance label makes the second install
          # adopt the first one's pods, which routes a client to the wrong
          # database and looks like a working deploy.
          # An array, not a string: the flags must stay separate words without
          # relying on unquoted expansion.
          base=(--set config.admin.listen=0.0.0.0:19000
                --set serviceAccount.create=true
                --set extraSecret.K=v)
          helm template pg-lane    "$chart" "${base[@]}" > /tmp/rel1.yaml
          helm template mssql-lane "$chart" "${base[@]}" > /tmp/rel2.yaml
          names() { grep -E '^  name: ' "$1" | sort -u; }
          if comm -12 <(names /tmp/rel1.yaml) <(names /tmp/rel2.yaml) | grep -q .; then
            echo "::error::two sidecar releases share a resource name:"
            comm -12 <(names /tmp/rel1.yaml) <(names /tmp/rel2.yaml)
            exit 1
          fi
          grep -q 'app.kubernetes.io/instance: pg-lane' /tmp/rel1.yaml \
            || { echo "::error::sidecar selector lost its instance label"; exit 1; }
          grep -q 'app.kubernetes.io/instance: mssql-lane' /tmp/rel1.yaml \
            && { echo "::error::sidecar release pg-lane leaked mssql-lane labels"; exit 1; }

          echo "two sidecar releases in one namespace share no resource name or selector"

          # An existingConfigMap lives outside the release, so the chart's
          # checksums cannot see it change and the relay reads its file only at
          # boot. configRevision is the only thing that rolls those pods; if it
          # stops reaching the pod template, an operator edits a ConfigMap and
          # the fleet silently keeps the old policy.
          ext() {
            helm template t "$chart" --set existingConfigMap=cm --set probe.port=19000 \
              --set configRevision="$1"
          }
          ext rev-a | grep -q 'hoop.dev/config-revision: "rev-a"' \
            || { echo "::error::configRevision did not reach the sidecar pod annotations"; exit 1; }
          if ext rev-a | diff -q - <(ext rev-b) >/dev/null; then
            echo "::error::changing configRevision did not change the sidecar pod template"
            exit 1
          fi
          # Absent unless asked for, so an unset value adds no annotation churn.
          helm template t "$chart" --set existingConfigMap=cm --set probe.port=19000 \
            | grep -q 'hoop.dev/config-revision' \
            && { echo "::error::config-revision annotation rendered with no configRevision set"; exit 1; }

          echo "configRevision changes the pod template, so an external ConfigMap edit can roll the pods"

          # Lane Services. The admin Service must stay admin-only whatever
          # these do, and each entry must be its own object: Service type and
          # every cloud LB knob are per-Service, so one lane internal and
          # another public is two objects and cannot collapse into one.
          lanes=(--set config.admin.listen=0.0.0.0:19000
                 --set laneServices.internal.enabled=true
                 --set laneServices.internal.ports[0].port=18080
                 --set laneServices.public.enabled=true
                 --set laneServices.public.type=LoadBalancer
                 --set laneServices.public.ports[0].port=5432
                 --set laneServices.public.ports[0].targetPort=15432)
          out=$(helm template t "$chart" "${lanes[@]}")
          # 15432 appears nowhere else in these values, so it proves the
          # port -> targetPort remap on the public entry actually happened.
          for want in "-internal" "-public" "type: LoadBalancer" "targetPort: 15432"; do
            echo "$out" | grep -q -- "$want" \
              || { echo "::error::lane Services did not render: $want"; exit 1; }
          done
          # A lane Service that loses the instance label selects the OTHER
          # release's pods in a shared namespace, which routes a client to the
          # wrong upstream and still looks healthy. The whole-render isolation
          # check above cannot see this: the Deployment supplies the label
          # regardless.
          lanesvc=$(helm template pg-lane "$chart" "${lanes[@]}" \
            --show-only templates/service-lanes.yaml)
          # Scoped to the selector block. A plain grep of the document passes
          # on a broken selector, because metadata.labels carries the same
          # labels regardless.
          sel=$(echo "$lanesvc" | awk '/^  selector:$/{f=1;next} f&&/^  [^ ]/{f=0} f')
          nsvc=$(echo "$lanesvc" | grep -c '^kind: Service')
          ninst=$(echo "$sel" | grep -c 'app.kubernetes.io/instance: pg-lane' || true)
          nname=$(echo "$sel" | grep -c 'app.kubernetes.io/name: hoopsidecar' || true)
          if [ "$ninst" != "$nsvc" ] || [ "$nname" != "$nsvc" ]; then
            echo "::error::a lane Service selector is missing the name/instance labels ($nsvc services, $nname name, $ninst instance)"
            exit 1
          fi

          # --show-only isolates the admin Service: it must still be ClusterIP
          # on 19000 and must never pick up a lane port.
          admin=$(helm template t "$chart" "${lanes[@]}" --show-only templates/service.yaml)
          echo "$admin" | grep -q 'port: 19000' \
            || { echo "::error::the admin Service lost port 19000"; exit 1; }
          echo "$admin" | grep -q 'type: ClusterIP' \
            || { echo "::error::the admin Service is no longer ClusterIP"; exit 1; }
          echo "$admin" | grep -qE 'port: (5432|15432)$' \
            && { echo "::error::a lane port leaked into the admin Service"; exit 1; }
          # A Service with no ports reaches nothing; the chart must refuse it,
          # and say why. Asserting the message and not just the failure: without
          # the guard the template still errors, with an unreadable
          # "len of nil pointer" from the next line instead.
          # Captured first: under pipefail a failing helm would poison the
          # pipeline even when grep found the message.
          noports=$(helm template t "$chart" --set config.admin.listen=0.0.0.0:19000 \
            --set laneServices.x.enabled=true 2>&1 || true)
          echo "$noports" | grep -q 'names no ports' \
            || { echo "::error::an enabled lane Service with no ports was not refused with a clear message"; exit 1; }

          echo "lane Services render per entry and leave the admin Service alone"

      - name: Assert the control plane chart renders and its guards hold
        run: |
          set -euo pipefail
          chart=./deploy/helm-chart/chart/controlplane
          base=(--set config.POSTGRES_DB_URI=postgres://u:p@h:5432/db
                --set config.API_URL=https://cp.example.tld)

          out=$(helm template t "$chart" "${base[@]}")

          echo "$out" | grep -q 'hoophq/hoopcontrolplane:' \
            || { echo "::error::control plane chart did not render hoophq/hoopcontrolplane"; exit 1; }
          # The image runs `hoop start control-plane` from its own CMD behind a
          # tini ENTRYPOINT, and that subcommand is the only thing that picks
          # the mode. A command/args here means the chart is picking it again,
          # which is what the image exists to avoid — and picking it wrong
          # boots a full gateway on :8010 with every proxy and all six plugins.
          # Same assertion the sidecar block makes, for the same reason.
          echo "$out" | grep -qE '^ *(command|args):' \
            && { echo "::error::control plane chart emitted a command/args override"; exit 1; }
          # And they cannot be set: an override is refused, not ignored. The
          # value that would be dropped is the one selecting the mode, and a
          # wrong one boots a full gateway from a chart named controlplane.
          argv=$(helm template t "$chart" "${base[@]}" --set 'image.command={hoop}' 2>&1 || true)
          echo "$argv" | grep -q 'argv belongs to the image\|not supported by this chart' \
            || { echo "::error::image.command was not refused"; exit 1; }
          # STATIC_UI_PATH must not appear at all. The image compiles the web
          # UI into the binary and ships no webapp files, and resolveSource()
          # returns on a non-empty value WITHOUT checking the path exists — it
          # never falls through to the embed. Any value serves API-only with a
          # 404 at /, and nothing shows it: /api/healthz still answers 200, so
          # any probe stays green and the rollout completes.
          echo "$out" | grep -q 'STATIC_UI_PATH' \
            && { echo "::error::the chart rendered STATIC_UI_PATH; the UI would 404"; exit 1; }

          # 8009 is read by the Deployment's containerPort, the Service and
          # the default HTTPRoute backend. Any other number means one of the
          # three drifted.
          if echo "$out" | grep -E 'containerPort:|targetPort:|port:' | grep -qv 8009; then
            echo "::error::control plane chart declared a port other than 8009"
            exit 1
          fi

          # Both directions. A default that drifted and a value that stopped
          # being read look identical in a passing lint.
          echo "$out" | grep -q 'replicas: 1' \
            || { echo "::error::replicas no longer defaults to 1 (ADR-0013)"; exit 1; }
          helm template t "$chart" "${base[@]}" --set replicas=3 | grep -q 'replicas: 3' \
            || { echo "::error::replicas is no longer configurable"; exit 1; }

          echo "control plane chart renders hoophq/hoopcontrolplane on 8009, one replica, no command"

          # No probe by default, and none conjured from anything. The chart
          # cannot know the listener's protocol: TLS_CERT/TLS_KEY decide it and
          # either can arrive through extraSecret or existingSecret, which no
          # template can read. The kubelet does not negotiate, so a wrong
          # scheme does not degrade — it stops the pod from ever going ready.
          # Measured on a real cluster: HTTP against TLS gets a 400 and the pod
          # never goes ready; HTTPS against TLS with a deliberately wrong CN
          # goes ready, because kubelet HTTPS probes always skip verification
          # and there is no field to change that.
          for kind in readinessProbe livenessProbe; do
            echo "$out" | grep -q "$kind:" \
              && { echo "::error::$kind rendered by default; the chart must not guess the listener protocol"; exit 1; }
            # Neither an API_URL path nor a TLS pair may produce one.
            helm template t "$chart" "${base[@]}" --set config.API_URL=https://cp.example.tld/hoop \
              --set config.TLS_CERT=x --set config.TLS_KEY=y | grep -q "$kind:" \
              && { echo "::error::$kind appeared once TLS/API_URL were set; probes must stay the operator's"; exit 1; }
          done
          # Set, they render verbatim: with + toYaml is all that stands between
          # the value and the pod, so a lost field is a silent wrong probe.
          probes=$(helm template t "$chart" "${base[@]}" \
            --set readinessProbe.httpGet.path=/api/healthz \
            --set readinessProbe.httpGet.port=8009 \
            --set readinessProbe.httpGet.scheme=HTTPS \
            --set readinessProbe.initialDelaySeconds=10 \
            --set livenessProbe.tcpSocket.port=8009 --show-only templates/deployment.yaml)
          for want in 'readinessProbe:' 'path: /api/healthz' 'scheme: HTTPS' 'initialDelaySeconds: 10' 'livenessProbe:' 'tcpSocket:'; do
            echo "$probes" | grep -q "$want" \
              || { echo "::error::a probe set in values lost '$want' on the way to the pod"; exit 1; }
          done
          echo "control plane chart renders no probe by default and passes a set one through unchanged"

          # The default HTTPRoute match DOES follow the API_URL path: that one
          # is the outside world's address, and it is the only reader of
          # basePath left now that the probes are the operator's.
          helm template t "$chart" --set config.POSTGRES_DB_URI=postgres://u:p@h:5432/db \
            --set config.API_URL=https://cp.example.tld/hoop --set gatewayApi.enabled=true \
            --show-only templates/httproute.yaml | grep -q 'value: /hoop/' \
            || { echo "::error::the default HTTPRoute match did not follow the API_URL path"; exit 1; }

          # Every Secret value goes through helm's quote function rather than
          # being wrapped in single quotes by hand. A PEM is multi-line, and a
          # hand-quoted one renders a Secret that is not valid YAML — the error
          # names the template, not the value, so it is a slow thing to debug.
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/probe-k.pem \
            -out /tmp/probe-c.pem -days 1 -subj /CN=localhost >/dev/null 2>&1
          helm template t "$chart" "${base[@]}" \
            --set-file config.TLS_CERT=/tmp/probe-c.pem \
            --set-file config.TLS_KEY=/tmp/probe-k.pem >/dev/null \
            || { echo "::error::a multi-line PEM broke the Secret manifest"; exit 1; }
          rm -f /tmp/probe-c.pem /tmp/probe-k.pem

          echo "a multi-line PEM renders a valid Secret"

          # Each of these MUST fail to render. A guard that stopped firing ships
          # a Deployment that cannot start, or one that is silently wrong, and
          # nothing else in CI would notice.
          guard() {
            local why=$1; shift
            if helm template t "$chart" "$@" >/dev/null 2>&1; then
              echo "::error::control plane chart guard no longer fires: $why"
              exit 1
            fi
          }
          guard "no POSTGRES_DB_URI"  --set config.API_URL=https://cp.example.tld
          guard "no API_URL"          --set config.POSTGRES_DB_URI=postgres://u:p@h:5432/db
          guard "pglite"              --set config.POSTGRES_DB_URI=pglite:///data --set config.API_URL=https://cp.example.tld
          guard "API_URL no scheme"   --set config.POSTGRES_DB_URI=postgres://u:p@h:5432/db --set config.API_URL=cp.example.tld
          guard "PORT moved"          "${base[@]}" --set config.PORT=9000
          guard "issuer, no client"   "${base[@]}" --set config.IDP_ISSUER=https://idp
          guard "image.command"       "${base[@]}" --set 'image.command={hoop}'
          guard "image.args"          "${base[@]}" --set 'image.args={start}'
          guard "no parentRefs"       "${base[@]}" --set gatewayApi.enabled=true --set gatewayApi.createGateway=false
          # A default route backed by a Service the chart was told not to
          # create resolves to nothing: BackendNotFound, and every request
          # gets a 500 from an install that rendered clean.
          guard "route, no Service"   "${base[@]}" --set gatewayApi.enabled=true --set service.enabled=false

          # The inverse: valid values must still render. Without this, a guard
          # that fires on everything also passes above.
          helm template t "$chart" "${base[@]}" --set config.TLS_CERT=a --set config.TLS_KEY=b >/dev/null \
            || { echo "::error::a complete TLS pair was refused"; exit 1; }
          # Half a pair is ACCEPTED and degrades to plaintext, matching
          # appconfig: TLS is on exactly when both are set. The chart must not
          # reinvent a rule the binary does not have.
          helm template t "$chart" "${base[@]}" --set config.TLS_CERT=a >/dev/null \
            || { echo "::error::half a TLS pair was refused; the binary accepts it and serves plaintext"; exit 1; }
          # Custom rules name their own backend, so the Service is genuinely
          # optional there. The guard above must not catch this.
          helm template t "$chart" "${base[@]}" --set gatewayApi.enabled=true --set service.enabled=false \
            --set 'gatewayApi.httpRoute.rules[0].backendRefs[0].name=my-own-svc' \
            --set 'gatewayApi.httpRoute.rules[0].backendRefs[0].port=8009' >/dev/null \
            || { echo "::error::a route with custom rules was refused without the chart's Service"; exit 1; }
          idp=$(helm template t "$chart" "${base[@]}" --set config.IDP_ISSUER=https://idp \
            --set config.IDP_CLIENT_ID=i --set config.IDP_CLIENT_SECRET=s) \
            || { echo "::error::a complete IDP block was refused"; exit 1; }
          # OIDC is inferred from these keys alone — loadAuthMethod picks it up
          # when any IDP_* is set.
          echo "$idp" | grep -q 'IDP_ISSUER' \
            || { echo "::error::the IDP block did not reach the Secret"; exit 1; }

          echo "all ten control plane guards fire, and valid values still render"

          # The chart renders the control plane's environment and nothing else.
          # It does not police what an operator writes under config: a key it
          # does not know is simply not rendered, and extraSecret is the way
          # through. What must hold is the output — nothing gateway-only in the
          # Secret.
          # TLS_CERT/TLS_KEY are rendered unconditionally, empty when unset.
          # A conditionally-rendered key can never be un-set on an existing
          # release: Helm writes stringData, Kubernetes stores data, so the
          # patch that would delete the key is a no-op and the old value
          # survives the upgrade.
          secret=$(helm template t "$chart" "${base[@]}" --show-only templates/secret-config.yaml)
          for k in TLS_CERT TLS_KEY; do
            echo "$secret" | grep -qE "^  $k: (''|\"\")$" \
              || { echo "::error::$k is not rendered empty by default; clearing it on an upgrade would not take effect"; exit 1; }
          done
          for k in GRPC_URL DLP_PROVIDER PLUGIN_AUDIT_PATH USE_TLS HOOP_SPIFFE_MODE ORG_MULTI_TENANT STATIC_UI_PATH AUTH_METHOD; do
            echo "$secret" | grep -qE "^  $k:" \
              && { echo "::error::$k leaked into the control plane Secret"; exit 1; }
          done

          echo "no gateway-only key reaches the control plane Secret"

          # Gateway API. The gateway chart renders an HTTPRoute with no rules
          # when an operator enables the block and reads no further: it
          # attaches, routes nothing, and looks installed. This chart defaults
          # both parentRefs and rules, so assert they survive.
          gw=$(helm template cp "$chart" "${base[@]}" --set gatewayApi.enabled=true)
          echo "$gw" | grep -q 'kind: Gateway' \
            || { echo "::error::createGateway did not render a Gateway"; exit 1; }
          route=$(helm template cp "$chart" "${base[@]}" --set gatewayApi.enabled=true \
            --show-only templates/httproute.yaml)
          echo "$route" | grep -q 'name: cp-hoopcontrolplane$' \
            || { echo "::error::the default HTTPRoute lost its parentRef or backendRef"; exit 1; }
          echo "$route" | grep -q 'port: 8009' \
            || { echo "::error::the default HTTPRoute backend is not 8009"; exit 1; }
          # createGateway: false must attach to somebody else's Gateway and
          # render no Gateway of its own.
          helm template cp "$chart" "${base[@]}" --set gatewayApi.enabled=true \
            --set gatewayApi.createGateway=false --set 'gatewayApi.httpRoute.parentRefs[0].name=shared' \
            | grep -q 'kind: Gateway' \
            && { echo "::error::createGateway=false still rendered a Gateway"; exit 1; }

          echo "Gateway API renders with working parentRefs and rules defaults"

          # Two releases in one namespace must be independent. A hardcoded
          # resource name or a selector without the instance label makes the
          # second install adopt the first one's pods — the bug the gateway
          # chart has and this one must not.
          iso=(--set config.POSTGRES_DB_URI=postgres://u:p@h:5432/db
               --set config.API_URL=https://cp.example.tld
               --set serviceAccount.create=true
               --set extraSecret.K=v)
          helm template cp-a "$chart" "${iso[@]}" > /tmp/cp1.yaml
          helm template cp-b "$chart" "${iso[@]}" > /tmp/cp2.yaml
          names() { grep -E '^  name: ' "$1" | sort -u; }
          if comm -12 <(names /tmp/cp1.yaml) <(names /tmp/cp2.yaml) | grep -q .; then
            echo "::error::two control plane releases share a resource name:"
            comm -12 <(names /tmp/cp1.yaml) <(names /tmp/cp2.yaml)
            exit 1
          fi
          # Scoped to the selector block: metadata.labels carries the same
          # labels, so a plain grep passes on a broken selector.
          sel=$(awk '/^  selector:$/{f=1;next} f&&/^  [^ ]/{f=0} f' /tmp/cp1.yaml)
          echo "$sel" | grep -q 'app.kubernetes.io/instance: cp-a' \
            || { echo "::error::the control plane Service selector lost its instance label"; exit 1; }
          echo "$sel" | grep -q 'app.kubernetes.io/instance: cp-b' \
            && { echo "::error::release cp-a leaked cp-b labels"; exit 1; }

          echo "two control plane releases in one namespace share no resource name or selector"
