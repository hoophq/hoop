# Validates the Helm charts on every PR that touches them. Its main job is to
# catch breakage in the DEP-66 clean-line wrapper charts (hoop-ng / hoopagent-ng)
# before release: they depend on the base charts via file:// and only override
# image defaults, so a base-chart rename or version bump can break only the
# wrappers — which otherwise wouldn't surface until `make build-helm-chart` at
# release time.
#
# It also covers the sidecar and control plane charts, for a different reason:
# those charts refuse to render a Deployment that cannot start, and their guards
# are the only thing standing between a typo and a CrashLoopBackOff. A guard
# that silently stopped firing looks exactly like a chart that works.
name: helm-charts

on:
  pull_request:
    paths:
      - deploy/helm-chart/**
      - deploy/managed-agents/**
      - deploy/openai-agents/**
      - .github/workflows/helm-charts.yml

# A newer run for the same PR makes this one stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Lint + render charts
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.20.2
      - name: Build wrapper dependencies
        run: |
          helm dependency build ./deploy/helm-chart/chart/hoop-ng
          helm dependency build ./deploy/helm-chart/chart/hoopagent-ng
      - name: Lint charts
        run: |
          helm lint ./deploy/helm-chart/chart/gateway
          helm lint ./deploy/helm-chart/chart/agent
          helm lint ./deploy/helm-chart/chart/hoop-ng
          helm lint ./deploy/helm-chart/chart/hoopagent-ng
          # The sidecar chart has no startable default: a config naming no
          # listeners does not start, so the chart refuses to render one. Lint
          # it against the smallest values that pass its guards.
          helm lint ./deploy/helm-chart/chart/sidecar \
            --set config.admin.listen=0.0.0.0:19000
          # Same for the control plane: POSTGRES_DB_URI and API_URL are
          # required, so there is no startable default to lint against.
          helm lint ./deploy/helm-chart/chart/controlplane \
            --set config.POSTGRES_DB_URI=postgres://u:p@h:5432/db \
            --set config.API_URL=https://cp.example.tld
      - name: Assert clean line renders the -ng images
        run: |
          set -euo pipefail
          gw=$(helm template t ./deploy/helm-chart/chart/hoop-ng \
            --set hoop-chart.config.POSTGRES_DB_URI=postgres://u:p@h:5432/db \
            --set hoop-chart.config.API_URL=https://example.tld \
            --set hoop-chart.defaultAgent.enabled=true)
          echo "$gw" | grep -q 'hoophq/hoop-ng:' \
            || { echo "::error::hoop-ng did not render hoophq/hoop-ng"; exit 1; }
          echo "$gw" | grep -q 'hoophq/hoopdev-ng:' \
            || { echo "::error::hoop-ng did not render hoophq/hoopdev-ng"; exit 1; }
          ag=$(helm template t ./deploy/helm-chart/chart/hoopagent-ng)
          echo "$ag" | grep -q 'hoophq/hoopdev-ng:' \
            || { echo "::error::hoopagent-ng did not render hoophq/hoopdev-ng"; exit 1; }
          echo "clean-line charts resolve dependencies and render the -ng images"

      - name: Assert the gateway chart IDP client credential guards hold
        run: |
          set -euo pipefail
          chart=./deploy/helm-chart/chart/gateway
          base=(--set config.POSTGRES_DB_URI=postgres://u:p@h:5432/db
                --set config.API_URL=https://gw.example.tld
                --set config.IDP_ISSUER=https://idp
                --set config.IDP_CLIENT_ID=i)

          # A federated token in place of the client secret (ENG-594).
          fed=$(helm template t "$chart" "${base[@]}" --set idpFederatedToken.enabled=true)
          for want in "IDP_CLIENT_ASSERTION_FILE: '/var/run/secrets/hoop/idp/token'" \
                      "IDP_CLIENT_SECRET: ''" 'mountPath: /var/run/secrets/hoop/idp' \
                      'audience: "api://AzureADTokenExchange"' 'serviceAccountName: hoopgateway'; do
            echo "$fed" | grep -qF "$want" \
              || { echo "::error::idpFederatedToken did not render: $want"; exit 1; }
          done
          # helm upgrade --reuse-values keeps the values of a release from an
          # older chart, which have no idpFederatedToken key.
          helm template t "$chart" "${base[@]}" --set config.IDP_CLIENT_SECRET=s \
            --set idpFederatedToken=null >/dev/null \
            || { echo "::error::a release without the idpFederatedToken key no longer renders"; exit 1; }
          # Only a client assertion makes the chart parse IDP_URI.
          helm template t "$chart" "${base[@]}" --set config.IDP_CLIENT_SECRET=s \
            --set 'config.IDP_URI=https://i:a%zz@idp' >/dev/null \
            || { echo "::error::an IDP_URI was parsed without a client assertion"; exit 1; }

          # Each of these MUST fail to render: the gateway refuses to start.
          guard() {
            local why=$1; shift
            if helm template t "$chart" "$@" >/dev/null 2>&1; then
              echo "::error::gateway chart guard no longer fires: $why"
              exit 1
            fi
          }
          guard "issuer, no secret or assertion" "${base[@]}"
          guard "token + IDP_CLIENT_SECRET"  "${base[@]}" --set idpFederatedToken.enabled=true --set config.IDP_CLIENT_SECRET=s
          guard "file + IDP_CLIENT_SECRET"   "${base[@]}" --set config.IDP_CLIENT_ASSERTION_FILE=/f --set config.IDP_CLIENT_SECRET=s
          guard "token + IDP_URI secret"     "${base[@]}" --set idpFederatedToken.enabled=true --set config.IDP_URI=https://i:s@idp

          echo "gateway chart renders a federated token and all four guards fire"

      - name: Assert the gateway chart takes credentials from existingSecret
        run: |
          set -euo pipefail
          chart=./deploy/helm-chart/chart/gateway
          idp=(--set config.IDP_ISSUER=https://idp --set config.IDP_CLIENT_ID=i)

          # GitOps: every credential lives in a Secret the chart does not manage
          # (ENG-681). The values hold none of them, so the render must not fail.
          out=$(helm template t "$chart" "${idp[@]}" --set existingSecret=creds \
            --set defaultAgent.enabled=true)
          echo "$out" | grep -qxF "  API_URL: ''" \
            || { echo "::error::hoop-config did not render API_URL empty"; exit 1; }
          # Every credential-named key of hoop-config renders empty. The count
          # stops the check from passing when it matches nothing.
          creds=$(echo "$out" | awk '/^  name: hoop-config$/{f=1} f&&/^---/{exit} f' \
            | grep -E "^  [A-Z_]*(SECRET|KEY|PASS|TOKEN|CREDENTIALS|_URI)[A-Z_]*: ")
          [ "$(echo "$creds" | wc -l)" -ge 10 ] \
            || { echo "::error::found $(echo "$creds" | wc -l) credential keys in hoop-config, want at least 10"; exit 1; }
          leaked=$(echo "$creds" | grep -vE ": ''$" || true)
          [ -z "$leaked" ] \
            || { echo "::error::hoop-config renders a credential with no value set: $leaked"; exit 1; }
          # Both containers load the Secret after hoop-config, so its keys win.
          refs() { grep -A4 'envFrom:' | grep 'name:' | awk '{print $2}' | paste -sd, -; }
          got=$(echo "$out" | refs)
          [ "$got" = "hoop-config,creds,hoop-config,creds" ] \
            || { echo "::error::envFrom order is '$got', want hoop-config then creds in both containers"; exit 1; }

          # Without existingSecret, nothing else is loaded and the checks still fire.
          base=(--set config.POSTGRES_DB_URI=postgres://u:p@h:5432/db
                --set config.API_URL=https://gw.example.tld)
          got=$(helm template t "$chart" "${base[@]}" --set defaultAgent.enabled=true | refs)
          [ "$got" = "hoop-config,hoop-config" ] \
            || { echo "::error::envFrom is '$got' without existingSecret, want hoop-config only"; exit 1; }
          guard() {
            local why=$1; shift
            if helm template t "$chart" "$@" >/dev/null 2>&1; then
              echo "::error::gateway chart guard no longer fires: $why"
              exit 1
            fi
          }
          guard "no POSTGRES_DB_URI"   --set config.API_URL=https://gw.example.tld
          guard "no API_URL"           --set config.POSTGRES_DB_URI=postgres://u:p@h:5432/db
          guard "no IDP_CLIENT_SECRET" "${base[@]}" "${idp[@]}"

          echo "gateway chart renders with credentials only in existingSecret, and its checks fire without it"

      - name: Assert the sidecar chart renders and its guards hold
        run: |
          set -euo pipefail
          chart=./deploy/helm-chart/chart/sidecar

          sc=$(helm template t "$chart" \
            --set config.admin.listen=0.0.0.0:19000 \
            --set config.listeners[0].name=appdb \
            --set config.listeners[0].protocol=postgres \
            --set config.listeners[0].listen=0.0.0.0:15432 \
            --set config.listeners[0].upstream=appdb:5432)

          echo "$sc" | grep -q 'hoophq/hoopsidecar:' \
            || { echo "::error::sidecar chart did not render hoophq/hoopsidecar"; exit 1; }
          # The image entrypoint runs the relay. A command here would mean the
          # chart is overriding it again, which is what the image exists to avoid.
          echo "$sc" | grep -qE '^ *(command|args):' \
            && { echo "::error::sidecar chart emitted a command/args override"; exit 1; }
          # 19000 is hardcoded in the Deployment, the Service and both probes.
          # Any other port number means one of the four drifted.
          if echo "$sc" | grep -E 'containerPort:|targetPort:|port:' | grep -qv 19000; then
            echo "::error::sidecar chart declared a port other than the admin port 19000"
            exit 1
          fi

          # Each of these MUST fail to render. A guard that stopped firing ships
          # a Deployment that cannot start, and nothing else in CI would notice.
          guard() {
            local why=$1; shift
            if helm template t "$chart" "$@" >/dev/null 2>&1; then
              echo "::error::sidecar chart guard no longer fires: $why"
              exit 1
            fi
          }
          guard "no config source"      
          guard "config + existingConfigMap" --set config.admin.listen=0.0.0.0:19000 --set existingConfigMap=x
          guard "control plane, no token" --set controlPlane.url=https://cp.example.com
          guard "token, no control plane" --set controlPlane.token=t --set config.admin.listen=0.0.0.0:19000
          guard "admin server disabled"   --set config.log_level=info
          guard "admin on a wrong port"   --set config.admin.listen=0.0.0.0:9901

          echo "sidecar chart renders hoophq/hoopsidecar on 19000 and all six guards fire"

          # existingSecret is loaded last, so HOOP_LICENSE / HOOP_SIDECAR_TOKEN
          # there win over the chart's own Secret and over extraSecret. It also
          # satisfies the credential guard: the chart cannot read it, so it
          # must not refuse a control plane whose token lives only there.
          es=$(helm template t "$chart" --set controlPlane.url=https://cp.example.com \
            --set extraSecret.K=v --set existingSecret=hoop-sidecar-credentials \
            --show-only templates/deployment.yaml)
          refs=$(echo "$es" | awk '/^ *envFrom:$/{f=1;next} f&&/^ *- secretRef:$/{getline; print $2; next} f&&/^ *[a-z]+:/{f=0}' | tr '\n' ' ')
          [ "$refs" = "t-hoopsidecar-env t-hoopsidecar-extra-env hoop-sidecar-credentials " ] \
            || { echo "::error::existingSecret is not the last envFrom Secret, after extraSecret: $refs"; exit 1; }

          echo "existingSecret is loaded last and carries the control plane token"

          # Two releases in one namespace must be independent: the chart is
          # installed once per upstream it fronts. A hardcoded resource name or
          # a selector without the instance label makes the second install
          # adopt the first one's pods, which routes a client to the wrong
          # database and looks like a working deploy.
          # An array, not a string: the flags must stay separate words without
          # relying on unquoted expansion.
          base=(--set config.admin.listen=0.0.0.0:19000
                --set serviceAccount.create=true
                --set extraSecret.K=v)
          helm template pg-lane    "$chart" "${base[@]}" > /tmp/rel1.yaml
          helm template mssql-lane "$chart" "${base[@]}" > /tmp/rel2.yaml
          names() { grep -E '^  name: ' "$1" | sort -u; }
          if comm -12 <(names /tmp/rel1.yaml) <(names /tmp/rel2.yaml) | grep -q .; then
            echo "::error::two sidecar releases share a resource name:"
            comm -12 <(names /tmp/rel1.yaml) <(names /tmp/rel2.yaml)
            exit 1
          fi
          grep -q 'app.kubernetes.io/instance: pg-lane' /tmp/rel1.yaml \
            || { echo "::error::sidecar selector lost its instance label"; exit 1; }
          grep -q 'app.kubernetes.io/instance: mssql-lane' /tmp/rel1.yaml \
            && { echo "::error::sidecar release pg-lane leaked mssql-lane labels"; exit 1; }

          echo "two sidecar releases in one namespace share no resource name or selector"

          # An existingConfigMap lives outside the release, so the chart's
          # checksums cannot see it change and the relay reads its file only at
          # boot. configRevision is the only thing that rolls those pods; if it
          # stops reaching the pod template, an operator edits a ConfigMap and
          # the fleet silently keeps the old policy.
          ext() {
            helm template t "$chart" --set existingConfigMap=cm --set probe.port=19000 \
              --set configRevision="$1"
          }
          ext rev-a | grep -q 'hoop.dev/config-revision: "rev-a"' \
            || { echo "::error::configRevision did not reach the sidecar pod annotations"; exit 1; }
          if ext rev-a | diff -q - <(ext rev-b) >/dev/null; then
            echo "::error::changing configRevision did not change the sidecar pod template"
            exit 1
          fi
          # Absent unless asked for, so an unset value adds no annotation churn.
          helm template t "$chart" --set existingConfigMap=cm --set probe.port=19000 \
            | grep -q 'hoop.dev/config-revision' \
            && { echo "::error::config-revision annotation rendered with no configRevision set"; exit 1; }

          echo "configRevision changes the pod template, so an external ConfigMap edit can roll the pods"

          # Lane Services. The admin Service must stay admin-only whatever
          # these do, and each entry must be its own object: Service type and
          # every cloud LB knob are per-Service, so one lane internal and
          # another public is two objects and cannot collapse into one.
          lanes=(--set config.admin.listen=0.0.0.0:19000
                 --set laneServices.internal.enabled=true
                 --set laneServices.internal.ports[0].port=18080
                 --set laneServices.public.enabled=true
                 --set laneServices.public.type=LoadBalancer
                 --set laneServices.public.ports[0].port=5432
                 --set laneServices.public.ports[0].targetPort=15432)
          out=$(helm template t "$chart" "${lanes[@]}")
          # 15432 appears nowhere else in these values, so it proves the
          # port -> targetPort remap on the public entry actually happened.
          for want in "-internal" "-public" "type: LoadBalancer" "targetPort: 15432"; do
            echo "$out" | grep -q -- "$want" \
              || { echo "::error::lane Services did not render: $want"; exit 1; }
          done
          # A lane Service that loses the instance label selects the OTHER
          # release's pods in a shared namespace, which routes a client to the
          # wrong upstream and still looks healthy. The whole-render isolation
          # check above cannot see this: the Deployment supplies the label
          # regardless.
          lanesvc=$(helm template pg-lane "$chart" "${lanes[@]}" \
            --show-only templates/service-lanes.yaml)
          # Scoped to the selector block. A plain grep of the document passes
          # on a broken selector, because metadata.labels carries the same
          # labels regardless.
          sel=$(echo "$lanesvc" | awk '/^  selector:$/{f=1;next} f&&/^  [^ ]/{f=0} f')
          nsvc=$(echo "$lanesvc" | grep -c '^kind: Service')
          ninst=$(echo "$sel" | grep -c 'app.kubernetes.io/instance: pg-lane' || true)
          nname=$(echo "$sel" | grep -c 'app.kubernetes.io/name: hoopsidecar' || true)
          if [ "$ninst" != "$nsvc" ] || [ "$nname" != "$nsvc" ]; then
            echo "::error::a lane Service selector is missing the name/instance labels ($nsvc services, $nname name, $ninst instance)"
            exit 1
          fi

          # --show-only isolates the admin Service: it must still be ClusterIP
          # on 19000 and must never pick up a lane port.
          admin=$(helm template t "$chart" "${lanes[@]}" --show-only templates/service.yaml)
          echo "$admin" | grep -q 'port: 19000' \
            || { echo "::error::the admin Service lost port 19000"; exit 1; }
          echo "$admin" | grep -q 'type: ClusterIP' \
            || { echo "::error::the admin Service is no longer ClusterIP"; exit 1; }
          echo "$admin" | grep -qE 'port: (5432|15432)$' \
            && { echo "::error::a lane port leaked into the admin Service"; exit 1; }
          # A Service with no ports reaches nothing; the chart must refuse it,
          # and say why. Asserting the message and not just the failure: without
          # the guard the template still errors, with an unreadable
          # "len of nil pointer" from the next line instead.
          # Captured first: under pipefail a failing helm would poison the
          # pipeline even when grep found the message.
          noports=$(helm template t "$chart" --set config.admin.listen=0.0.0.0:19000 \
            --set laneServices.x.enabled=true 2>&1 || true)
          echo "$noports" | grep -q 'names no ports' \
            || { echo "::error::an enabled lane Service with no ports was not refused with a clear message"; exit 1; }

          echo "lane Services render per entry and leave the admin Service alone"

          # podLabels reach the pod template and nothing else. GCP Marketplace
          # tracks consumption by the label it finds on the pod; one that leaked
          # into the selector would make every later `helm upgrade` fail.
          pl=$(helm template t "$chart" --set config.admin.listen=0.0.0.0:19000 \
            --set podLabels.goog-partner-solution=isol_test --show-only templates/deployment.yaml)
          tpl=$(echo "$pl" | awk '/^  template:$/{f=1} f')
          echo "$tpl" | grep -q 'goog-partner-solution: isol_test' \
            || { echo "::error::podLabels did not reach the pod template"; exit 1; }
          sel=$(echo "$pl" | awk '/^  selector:$/{f=1;next} /^  [^ ]/{f=0} f')
          echo "$sel" | grep -q 'goog-partner-solution' \
            && { echo "::error::podLabels leaked into the Deployment selector"; exit 1; }
          guard "podLabels overrides a chart label" --set config.admin.listen=0.0.0.0:19000 \
            --set podLabels.app\\.kubernetes\\.io/instance=x

          echo "podLabels land on the pod template only"

      # deploy/managed-agents/http/values.yaml is a template users install as
      # is, so a chart change that breaks it must fail here, not at install.
      - name: Assert the Managed Agents http template renders
        run: |
          set -euo pipefail
          chart=./deploy/helm-chart/chart/sidecar
          values=./deploy/managed-agents/http/values.yaml
          helm lint "$chart" -f "$values"
          out=$(helm template t "$chart" -f "$values")
          echo "$out" | grep -q 'HOOP_SIDECAR_INSTALL_SOURCE: "managed-agents-http"' \
            || { echo "::error::the template lost its analytics install source"; exit 1; }
          echo "$out" | grep -q "HOOP_SIDECAR_FREE_STANDALONE: 'true'" \
            || { echo "::error::the template lost HOOP_SIDECAR_FREE_STANDALONE: its free sidecar would wait for a login code"; exit 1; }
          echo "$out" | grep -q 'type: LoadBalancer' \
            || { echo "::error::the template's public lane Service is not a LoadBalancer"; exit 1; }
          echo "$out" | grep -qE 'port: 443$' \
            || { echo "::error::the template's lane is not on port 443"; exit 1; }
          echo "$out" | grep -q 'caller_token' \
            || { echo "::error::the template's lane lost its caller token"; exit 1; }
          echo "the Managed Agents http template renders"

      - name: Assert the Managed Agents kubernetes template renders
        run: |
          set -euo pipefail
          chart=./deploy/helm-chart/chart/sidecar
          values=./deploy/managed-agents/kubernetes/values.yaml
          helm lint "$chart" -f "$values"
          out=$(helm template t "$chart" -f "$values")
          echo "$out" | grep -q 'HOOP_SIDECAR_INSTALL_SOURCE: "managed-agents-kubernetes"' \
            || { echo "::error::the template lost its analytics install source"; exit 1; }
          echo "$out" | grep -q "HOOP_SIDECAR_FREE_STANDALONE: 'true'" \
            || { echo "::error::the template lost HOOP_SIDECAR_FREE_STANDALONE: its free sidecar would wait for a login code"; exit 1; }
          echo "$out" | grep -q 'type: LoadBalancer' \
            || { echo "::error::the template's public lane Service is not a LoadBalancer"; exit 1; }
          echo "$out" | grep -qE 'port: 443$' \
            || { echo "::error::the template's lane is not on port 443"; exit 1; }
          echo "$out" | grep -q 'no-delete' \
            || { echo "::error::the template lost its delete guardrail"; exit 1; }
          # The lane verifies the API server with the CA that Kubernetes
          # mounts in every pod that keeps its service account token.
          echo "$out" | grep -q 'automountServiceAccountToken: false' \
            && { echo "::error::the pod no longer mounts the cluster CA the lane trusts"; exit 1; }
          echo "the Managed Agents kubernetes template renders"

      - name: Assert the OpenAI Agents http template renders
        run: |
          set -euo pipefail
          chart=./deploy/helm-chart/chart/sidecar
          dir=./deploy/openai-agents/http
          values=$dir/values.yaml
          helm lint "$chart" -f "$values"
          out=$(helm template t "$chart" -f "$values")
          echo "$out" | grep -q 'HOOP_SIDECAR_INSTALL_SOURCE: "openai-agents-http"' \
            || { echo "::error::the template lost its analytics install source"; exit 1; }
          echo "$out" | grep -q "HOOP_SIDECAR_FREE_STANDALONE: 'true'" \
            || { echo "::error::the template lost HOOP_SIDECAR_FREE_STANDALONE: its free sidecar would wait for a login code"; exit 1; }
          echo "$out" | grep -q 'type: LoadBalancer' \
            || { echo "::error::the template's public lane Service is not a LoadBalancer"; exit 1; }
          echo "$out" | grep -qE 'port: 443$' \
            || { echo "::error::the template's lane is not on port 443"; exit 1; }
          echo "$out" | grep -q 'name: openai-agents' \
            || { echo "::error::the template's lane lost its caller token"; exit 1; }
          echo "$out" | grep -q 'X-OpenAI-Session-Id' \
            || { echo "::error::the template's lane no longer records the OpenAI session header"; exit 1; }
          # Older releases report the install source as "other".
          tag=$(yq '.image.tag' "$values")
          [[ "$tag" =~ ^([0-9.]+)@sha256:[0-9a-f]{64}$ ]] \
            && [[ "$(printf '1.263.0\n%s\n' "${BASH_REMATCH[1]}" | sort -V | head -1)" == 1.263.0 ]] \
            || { echo "::error::values.yaml must pin hoophq/hoopsidecar 1.263.0 or later by digest: $tag"; exit 1; }
          # The README promises the Claude template's free-tier rules and exposure.
          for block in .config.guardrails .config.mask .extraVolumes .extraVolumeMounts .laneServices; do
            [[ "$(yq -o=json "$block" "$values")" == "$(yq -o=json "$block" ./deploy/managed-agents/http/values.yaml)" ]] \
              || { echo "::error::$values and the Managed Agents http template differ in $block"; exit 1; }
          done
          # setup.sh, for this agent and the quick start's: the sandbox reaches
          # only the sidecar host, and the vault fills each token toward that
          # host only.
          host=sidecar.ci.example
          full=$(SIDECAR_HOST=$host "$dir/setup.sh" create --dry-run)
          demo=$(SIDECAR_HOST=$host AGENT_DIR=$dir/quickstart/openai "$dir/setup.sh" create --dry-run --no-api-token)
          for bodies in "$full" "$demo"; do
            jq -e --arg h "$host" '.environment_template.network == {access: "restricted", allowed_domains: [$h]}' <<<"$bodies" >/dev/null \
              || { echo "::error::the environment template reaches more than the sidecar host"; exit 1; }
            jq -e --arg h "$host" '[.credentials[].auth | .type == "environment_variable" and .networking == {type: "limited", allowed_hosts: [$h]}] | length > 0 and all' <<<"$bodies" >/dev/null \
              || { echo "::error::a vault credential is not bound to the sidecar host alone"; exit 1; }
            jq -e '([.. | strings | select(test("sidecar\\.example\\.com"))] == []) and all(.. | objects; has("secret_value") | not)' <<<"$bodies" >/dev/null \
              || { echo "::error::a request body kept the example host or holds a secret"; exit 1; }
          done
          jq -e '[.credentials[].auth.secret_name] == ["HOOP_CALLER_TOKEN", "CUSTOMER_API_TOKEN"]' <<<"$full" >/dev/null \
            || { echo "::error::the vault lost a credential"; exit 1; }
          # The demo API takes no token; AGENT_DIR picks the demo agent.
          jq -e '[.credentials[].auth.secret_name] == ["HOOP_CALLER_TOKEN"] and .agent.name == "hoop-demo-api"' <<<"$demo" >/dev/null \
            || { echo "::error::the quick start's vault holds more than the caller token, or its agent is not the demo agent"; exit 1; }
          # A short-form mount turns a missing token into a folder, which
          # run.sh then takes for the token. ENG-878 brings this to the
          # Claude quick start; then this moves to the quick start loop.
          mount=$(yq -o=json -I=0 '[.services.sidecar.volumes[] | select(tag == "!!map" and .target == "/run/secrets/caller-token") | .bind.create_host_path]' "$dir/quickstart/docker-compose.yml")
          [[ "$mount" == '[false]' ]] \
            || { echo "::error::the quick start's token mount creates a folder when the token is missing: $mount"; exit 1; }
          echo "the OpenAI Agents http template renders and its OpenAI side reaches only the sidecar"

      # The OpenAI kubernetes template copies the Managed Agents one's policy
      # and exposure, so a fix to either must reach both.
      - name: Assert the OpenAI Agents kubernetes template renders
        run: |
          set -euo pipefail
          chart=./deploy/helm-chart/chart/sidecar
          dir=./deploy/openai-agents/kubernetes
          values=$dir/values.yaml
          helm lint "$chart" -f "$values"
          out=$(helm template t "$chart" -f "$values")
          echo "$out" | grep -q 'HOOP_SIDECAR_INSTALL_SOURCE: "openai-agents-kubernetes"' \
            || { echo "::error::the template lost its analytics install source"; exit 1; }
          echo "$out" | grep -q "HOOP_SIDECAR_FREE_STANDALONE: 'true'" \
            || { echo "::error::the template lost HOOP_SIDECAR_FREE_STANDALONE: its free sidecar would wait for a login code"; exit 1; }
          echo "$out" | grep -q 'type: LoadBalancer' \
            || { echo "::error::the template's public lane Service is not a LoadBalancer"; exit 1; }
          echo "$out" | grep -qE 'port: 443$' \
            || { echo "::error::the template's lane is not on port 443"; exit 1; }
          echo "$out" | grep -q 'no-delete' \
            || { echo "::error::the template lost its delete guardrail"; exit 1; }
          # Each row names the session only while the lane records this header.
          echo "$out" | grep -q 'Impersonate-Extra-Hoop-Session' \
            || { echo "::error::the lane no longer records the session header"; exit 1; }
          echo "$out" | grep -q 'automountServiceAccountToken: false' \
            && { echo "::error::the pod no longer mounts the cluster CA the lane trusts"; exit 1; }
          # Older releases report the install source as "other".
          tag=$(yq '.image.tag' "$values")
          [[ "$tag" =~ ^([0-9.]+)@sha256:[0-9a-f]{64}$ ]] \
            && [[ "$(printf '1.263.0\n%s\n' "${BASH_REMATCH[1]}" | sort -V | head -1)" == 1.263.0 ]] \
            || { echo "::error::values.yaml must pin hoophq/hoopsidecar 1.263.0 or later by digest: $tag"; exit 1; }
          # Assigned first, so a yq failure stops the step instead of comparing
          # two empty strings.
          for block in .config.guardrails .config.mask .extraVolumes .extraVolumeMounts .laneServices; do
            ours=$(yq -o=json "$block" "$values")
            twin=$(yq -o=json "$block" ./deploy/managed-agents/kubernetes/values.yaml)
            [[ "$ours" == "$twin" ]] \
              || { echo "::error::$values and the Managed Agents kubernetes template differ in $block"; exit 1; }
          done
          # setup.sh: the sandbox reaches only the sidecar host and gets kubectl
          # as a file; the vault fills the token toward that host only.
          host=sidecar.ci.example
          bodies=$(SIDECAR_HOST=$host "$dir/setup.sh" create --dry-run)
          jq -e --arg h "$host" '.environment_template.network == {access: "restricted", allowed_domains: [$h]}' <<<"$bodies" >/dev/null \
            || { echo "::error::the environment template reaches more than the sidecar host"; exit 1; }
          jq -e '.environment_template.files | map(.path) == ["/workspace/.hoop/kubernetes-client-linux-amd64.tar.gz", "/workspace/.hoop/kubeconfig.sh"]' <<<"$bodies" >/dev/null \
            || { echo "::error::the environment template lost the kubectl tarball or kubeconfig.sh"; exit 1; }
          jq -r '.environment_template.files[] | select(.type == "inline") | .data' <<<"$bodies" | base64 -d \
            | grep -qx "SIDECAR_HOST=$host # setup.sh writes the real host" \
            || { echo "::error::kubeconfig.sh in the template does not name the sidecar host"; exit 1; }
          jq -e --arg h "$host" '[.credentials[].auth | .type == "environment_variable" and .networking == {type: "limited", allowed_hosts: [$h]}] == [true]' <<<"$bodies" >/dev/null \
            || { echo "::error::the vault credential is not bound to the sidecar host alone"; exit 1; }
          jq -e '([.. | strings | select(test("sidecar\\.example\\.com"))] == []) and all(.. | objects; has("secret_value") | not)' <<<"$bodies" >/dev/null \
            || { echo "::error::a request body kept the example host or holds a secret"; exit 1; }
          echo "the OpenAI Agents kubernetes template renders and its OpenAI side reaches only the sidecar"

      # The README promises the Claude twin's rules, login and topology.
      - name: Assert the OpenAI Agents postgres-mcp template matches its Claude twin
        run: |
          set -euo pipefail
          dir=./deploy/openai-agents/postgres-mcp
          twin=./deploy/managed-agents/postgres-mcp
          for f in sidecar.yaml seed.sql docker-compose.test.yml; do
            cmp -s "$dir/$f" "$twin/$f" || { echo "::error::$dir/$f differs from $twin/$f"; exit 1; }
          done
          # Assigned first, so a yq failure stops the step instead of comparing
          # two empty strings.
          for block in .services.postgres .services.dbhub '.services.sidecar | del(.image)' .networks; do
            a=$(yq -o=json "$block" "$dir/docker-compose.yml")
            b=$(yq -o=json "$block" "$twin/docker-compose.yml")
            [[ "$a" == "$b" ]] \
              || { echo "::error::$dir/docker-compose.yml and its Claude twin differ in $block"; exit 1; }
          done
          # ENG-855: older sidecars miss a DELETE after `-- x<CR>`.
          img=$(yq '.services.sidecar.image' "$dir/docker-compose.yml")
          [[ "$img" =~ ^hoophq/hoopsidecar:([0-9.]+)@sha256:[0-9a-f]{64}$ ]] \
            && [[ "$(printf '1.260.3\n%s\n' "${BASH_REMATCH[1]}" | sort -V | head -1)" == 1.260.3 ]] \
            || { echo "::error::docker-compose.yml must pin hoophq/hoopsidecar 1.260.3 or later by digest: $img"; exit 1; }
          # setup.sh: OpenAI's servers make the MCP call with the vault token,
          # and the sandbox has no network.
          host=mcp.ci.example
          bodies=$(MCP_HOST=$host "$dir/setup.sh" create --dry-run)
          jq -e '.environment_template.network == {access: "disabled"}' <<<"$bodies" >/dev/null \
            || { echo "::error::the environment template has a network"; exit 1; }
          jq -e --arg u "https://$host/mcp" '[.agent.tools[] | {type, connection_origin, url: .transport.server_url, required}]
              == [{type: "mcp", connection_origin: "service", url: $u, required: true}]' <<<"$bodies" >/dev/null \
            || { echo "::error::the agent's tools are not one required service-origin MCP server"; exit 1; }
          jq -e --arg u "https://$host/mcp" '.credential.auth == {type: "static_bearer", mcp_server_url: $u}' <<<"$bodies" >/dev/null \
            || { echo "::error::the vault credential does not name the agent's MCP URL, or holds a secret"; exit 1; }
          jq -e '[.. | strings | select(test("mcp\\.example\\.com"))] == []' <<<"$bodies" >/dev/null \
            || { echo "::error::a request body kept the example host"; exit 1; }
          # The production Caddy config admits only the list run.sh writes.
          # Two lists, so a prefix written into the Caddyfile cannot pass as
          # the imported one.
          img=$(yq '.services.caddy.image' "$dir/docker-compose.yml")
          for range in 192.0.2.0/24 198.51.100.0/24; do
            tmp=$(mktemp -d)
            echo "@outside not client_ip $range" > "$tmp/openai.caddy"
            prod=$(docker run --rm -e SITE_ADDRESS=mcp.ci.example -v "$PWD/$dir/Caddyfile:/etc/caddy/Caddyfile:ro" \
              -v "$tmp:/etc/caddy/ranges:ro" "$img" caddy adapt --config /etc/caddy/Caddyfile)
            jq -e --arg r "$range" '[.. | .client_ip? // empty | .ranges[]] == [$r]' <<<"$prod" >/dev/null \
              || { echo "::error::the Caddyfile admits other than the imported list $range"; exit 1; }
            # The 403 must run before the one proxy, or it guards nothing.
            jq -e --arg r "$range" '[.. | objects | select(.handler? == "subroute") | .routes | select(any(.[]; .handle[0].handler == "reverse_proxy"))]
                | length == 1 and (.[0][0] == {match: [{not: [{client_ip: {ranges: [$r]}}]}],
                    handle: [{handler: "static_response", status_code: 403, body: "forbidden"}]})' <<<"$prod" >/dev/null \
              || { echo "::error::the Caddyfile does not refuse a caller outside $range before it proxies"; exit 1; }
          done
          # A file mount would keep serving the list that ./run.sh ranges replaced.
          yq -e '.services.caddy.volumes[] | select(. == "./ranges:/etc/caddy/ranges:ro")' "$dir/docker-compose.yml" >/dev/null \
            || { echo "::error::Caddy does not mount the ranges directory that run.sh writes"; exit 1; }
          jq -e '[.apps.http.servers[].trusted_proxies.ranges] == [["127.0.0.1/32"]]' <<<"$prod" >/dev/null \
            || { echo "::error::the production Caddyfile trusts a proxy other than loopback"; exit 1; }
          echo "the OpenAI Agents postgres-mcp template matches its Claude twin and admits only OpenAI's list"

      # Each quick start runs on its pinned image: the demo API it relies on,
      # and the free-tier message its README quotes. The helm values share
      # that image and those rules, so they fit the free tier too.
      - name: Assert the http quick starts work on their pinned images
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          echo ci-token > "$tmp/token"
          token=(-v "$tmp/token:/run/secrets/caller-token:ro")
          trap 'docker rm -f quickstart >/dev/null 2>&1 || true' EXIT
          call() { curl -sS -i -X "$1" "http://127.0.0.1:8080$2" ${3:+-H "X-Hoop-Token: $3"}; }

          for dir in ./deploy/managed-agents/http ./deploy/openai-agents/http; do
            qs=$dir/quickstart
            img=$(yq '.services.sidecar.image' "$qs/docker-compose.yml")
            [[ "$img" == "hoophq/hoopsidecar:$(yq '.image.tag' "$dir/values.yaml")" ]] \
              || { echo "::error::$qs and values.yaml pin different images"; exit 1; }
            [[ "$(yq '.services.sidecar.environment.HOOP_SIDECAR_INSTALL_SOURCE' "$qs/docker-compose.yml")" == "$(yq '.analytics.installSource' "$dir/values.yaml")" ]] \
              || { echo "::error::$qs and values.yaml report different install sources"; exit 1; }
            for block in guardrails mask 'listeners[0].caller_token.name' 'listeners[0].http'; do
              [[ "$(yq -o=json ".$block" "$qs/config/sidecar.yaml")" == "$(yq -o=json ".config.$block" "$dir/values.yaml")" ]] \
                || { echo "::error::$qs and values.yaml differ in $block"; exit 1; }
            done

            docker run -d --name quickstart -p 127.0.0.1:8080:8080 -p 127.0.0.1:19000:19000 \
              -v "$PWD/$qs/config/sidecar.yaml:/etc/hoop-inspect/config.yaml:ro" "${token[@]}" "$img" >/dev/null
            for _ in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:19000/healthz && break; sleep 1; done
            out=$(call GET /users/1 ci-token) \
              || { echo "::error::$qs: no answer through the lane: does the image still serve x-hoop-demo-api?"; docker logs quickstart; exit 1; }
            for want in ' 200 ' '[REDACTED:EMAIL_ADDRESS]' '[REDACTED:PHONE_NUMBER]' '[REDACTED:CREDIT_CARD]'; do
              grep -qF -- "$want" <<<"$out" || { echo "::error::$qs: GET /users/1 lacks '$want': $out"; exit 1; }
            done
            # Captured first: under pipefail, grep -q can end curl with SIGPIPE.
            out=$(call DELETE /users/1 ci-token)
            grep -qi '^x-hoop-denied: policy' <<<"$out" \
              || { echo "::error::$qs: DELETE /users/1 was not refused"; exit 1; }
            out=$(call GET /users/1)
            [[ "$out" == HTTP/*" 403 "* ]] \
              || { echo "::error::$qs: a request without the caller token was not refused"; exit 1; }
            docker rm -f quickstart >/dev/null

            yq '.guardrails.rules += [{"name": "second", "type": "operation", "operations": ["delete"]}]' \
              "$qs/config/sidecar.yaml" > "$tmp/over.yaml"
            if out=$(docker run --rm -v "$tmp/over.yaml:/etc/hoop-inspect/config.yaml:ro" "${token[@]}" \
                "$img" hoop start sidecar --validate 2>&1); then
              echo "::error::$qs: the image accepted a second guardrail rule"; exit 1
            fi
            # Without this, an empty or header-only refusal passes the quote check.
            grep -qF -- "2 guardrail rules are configured (guardrails: 2) and this process enforces at most 1" <<<"$out" \
              || { echo "::error::$qs: the image refused the config, but not with the cap message: $out"; exit 1; }
            while IFS= read -r line; do
              grep -qxF -- "$line" "$dir/README.md" \
                || { echo "::error::$dir/README.md does not quote this line of the message: $line"; exit 1; }
            done <<<"$out"
            echo "$qs masks and refuses on its pinned image, and $dir/README.md quotes the cap message"
          done

      - name: Assert image references live only in values.yaml
        run: |
          set -euo pipefail
          # AWS Marketplace rewrites image references in values.yaml when it
          # copies a Helm chart across regions, and rejects a chart whose
          # templates name an image themselves (INVALID_IMAGE_REFERENCE). A
          # template-side default would ship the Docker Hub image to a buyer.
          for c in sidecar controlplane; do
            chart=./deploy/helm-chart/chart/$c
            if grep -rnE 'hoophq/|:latest' "$chart/templates"; then
              echo "::error::$c chart names an image in a template; put it in values.yaml"
              exit 1
            fi
            case $c in
              sidecar) args=(--set config.admin.listen=0.0.0.0:19000) ;;
              controlplane) args=(--set config.POSTGRES_DB_URI=postgres://u:p@h:5432/db --set config.API_URL=https://cp.example.tld) ;;
            esac
            img=$(helm template t "$chart" "${args[@]}" \
              --set image.repository=709825985650.dkr.ecr.us-east-1.amazonaws.com/hoop/$c --set image.tag=1.0 \
              --show-only templates/deployment.yaml | awk '$1=="-" && $2=="image:"{print $3}')
            [ "$img" = "'709825985650.dkr.ecr.us-east-1.amazonaws.com/hoop/$c:1.0'" ] \
              || { echo "::error::$c chart did not render the image from values.yaml: $img"; exit 1; }
          done
          # A release made when the templates held the image defaults has no
          # image values, and `helm upgrade --reuse-values` keeps them. The
          # chart must refuse with the way out, not render ":" as the image.
          for c in sidecar controlplane; do
            chart=./deploy/helm-chart/chart/$c
            case $c in
              sidecar) args=(--set config.admin.listen=0.0.0.0:19000) ;;
              controlplane) args=(--set config.POSTGRES_DB_URI=postgres://u:p@h:5432/db --set config.API_URL=https://cp.example.tld) ;;
            esac
            for unset in "image=null" "image.tag=" "image.repository="; do
              out=$(helm template t "$chart" "${args[@]}" --set "$unset" 2>&1 || true)
              echo "$out" | grep -q 'reset-then-reuse-values' \
                || { echo "::error::$c chart rendered with $unset instead of refusing"; exit 1; }
            done
          done
          echo "both charts take their image only from values.yaml"

      - name: Assert the control plane chart renders and its guards hold
        run: |
          set -euo pipefail
          chart=./deploy/helm-chart/chart/controlplane
          base=(--set config.POSTGRES_DB_URI=postgres://u:p@h:5432/db
                --set config.API_URL=https://cp.example.tld)

          out=$(helm template t "$chart" "${base[@]}")

          echo "$out" | grep -q 'hoophq/hoopcontrolplane:' \
            || { echo "::error::control plane chart did not render hoophq/hoopcontrolplane"; exit 1; }
          # The image runs `hoop start control-plane` from its own CMD behind a
          # tini ENTRYPOINT, and that subcommand is the only thing that picks
          # the mode. A command/args here means the chart is picking it again,
          # which is what the image exists to avoid — and picking it wrong
          # boots a full gateway on :8010 with every proxy and all six plugins.
          # Same assertion the sidecar block makes, for the same reason.
          echo "$out" | grep -qE '^ *(command|args):' \
            && { echo "::error::control plane chart emitted a command/args override"; exit 1; }
          # And they cannot be set: an override is refused, not ignored. The
          # value that would be dropped is the one selecting the mode, and a
          # wrong one boots a full gateway from a chart named controlplane.
          argv=$(helm template t "$chart" "${base[@]}" --set 'image.command={hoop}' 2>&1 || true)
          echo "$argv" | grep -q 'argv belongs to the image\|not supported by this chart' \
            || { echo "::error::image.command was not refused"; exit 1; }
          # STATIC_UI_PATH must not appear at all. The image compiles the web
          # UI into the binary and ships no webapp files, and resolveSource()
          # returns on a non-empty value WITHOUT checking the path exists — it
          # never falls through to the embed. Any value serves API-only with a
          # 404 at /, and nothing shows it: /api/healthz still answers 200, so
          # any probe stays green and the rollout completes.
          echo "$out" | grep -q 'STATIC_UI_PATH' \
            && { echo "::error::the chart rendered STATIC_UI_PATH; the UI would 404"; exit 1; }

          # 8009 is read by the Deployment's containerPort, the Service and
          # the default HTTPRoute backend. Any other number means one of the
          # three drifted.
          if echo "$out" | grep -E 'containerPort:|targetPort:|port:' | grep -qv 8009; then
            echo "::error::control plane chart declared a port other than 8009"
            exit 1
          fi

          # Both directions. A default that drifted and a value that stopped
          # being read look identical in a passing lint.
          echo "$out" | grep -q 'replicas: 1' \
            || { echo "::error::replicas no longer defaults to 1 (ADR-0024)"; exit 1; }
          helm template t "$chart" "${base[@]}" --set replicas=3 | grep -q 'replicas: 3' \
            || { echo "::error::replicas is no longer configurable"; exit 1; }

          echo "control plane chart renders hoophq/hoopcontrolplane on 8009, one replica, no command"

          # No probe by default, and none conjured from anything. The chart
          # cannot know the listener's protocol: TLS_CERT/TLS_KEY decide it and
          # either can arrive through extraSecret or existingSecret, which no
          # template can read. The kubelet does not negotiate, so a wrong
          # scheme does not degrade — it stops the pod from ever going ready.
          # Measured on a real cluster: HTTP against TLS gets a 400 and the pod
          # never goes ready; HTTPS against TLS with a deliberately wrong CN
          # goes ready, because kubelet HTTPS probes always skip verification
          # and there is no field to change that.
          for kind in readinessProbe livenessProbe; do
            echo "$out" | grep -q "$kind:" \
              && { echo "::error::$kind rendered by default; the chart must not guess the listener protocol"; exit 1; }
            # Neither an API_URL path nor a TLS pair may produce one.
            helm template t "$chart" "${base[@]}" --set config.API_URL=https://cp.example.tld/hoop \
              --set config.TLS_CERT=x --set config.TLS_KEY=y | grep -q "$kind:" \
              && { echo "::error::$kind appeared once TLS/API_URL were set; probes must stay the operator's"; exit 1; }
          done
          # Set, they render verbatim: with + toYaml is all that stands between
          # the value and the pod, so a lost field is a silent wrong probe.
          probes=$(helm template t "$chart" "${base[@]}" \
            --set readinessProbe.httpGet.path=/api/healthz \
            --set readinessProbe.httpGet.port=8009 \
            --set readinessProbe.httpGet.scheme=HTTPS \
            --set readinessProbe.initialDelaySeconds=10 \
            --set livenessProbe.tcpSocket.port=8009 --show-only templates/deployment.yaml)
          for want in 'readinessProbe:' 'path: /api/healthz' 'scheme: HTTPS' 'initialDelaySeconds: 10' 'livenessProbe:' 'tcpSocket:'; do
            echo "$probes" | grep -q "$want" \
              || { echo "::error::a probe set in values lost '$want' on the way to the pod"; exit 1; }
          done
          echo "control plane chart renders no probe by default and passes a set one through unchanged"

          # The default HTTPRoute match DOES follow the API_URL path: that one
          # is the outside world's address, and it is the only reader of
          # basePath left now that the probes are the operator's.
          helm template t "$chart" --set config.POSTGRES_DB_URI=postgres://u:p@h:5432/db \
            --set config.API_URL=https://cp.example.tld/hoop --set gatewayApi.enabled=true \
            --show-only templates/httproute.yaml | grep -q 'value: /hoop/' \
            || { echo "::error::the default HTTPRoute match did not follow the API_URL path"; exit 1; }

          # Every Secret value goes through helm's quote function rather than
          # being wrapped in single quotes by hand. A PEM is multi-line, and a
          # hand-quoted one renders a Secret that is not valid YAML — the error
          # names the template, not the value, so it is a slow thing to debug.
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/probe-k.pem \
            -out /tmp/probe-c.pem -days 1 -subj /CN=localhost >/dev/null 2>&1
          helm template t "$chart" "${base[@]}" \
            --set-file config.TLS_CERT=/tmp/probe-c.pem \
            --set-file config.TLS_KEY=/tmp/probe-k.pem >/dev/null \
            || { echo "::error::a multi-line PEM broke the Secret manifest"; exit 1; }
          rm -f /tmp/probe-c.pem /tmp/probe-k.pem

          echo "a multi-line PEM renders a valid Secret"

          # Each of these MUST fail to render. A guard that stopped firing ships
          # a Deployment that cannot start, or one that is silently wrong, and
          # nothing else in CI would notice.
          guard() {
            local why=$1; shift
            if helm template t "$chart" "$@" >/dev/null 2>&1; then
              echo "::error::control plane chart guard no longer fires: $why"
              exit 1
            fi
          }
          guard "no POSTGRES_DB_URI"  --set config.API_URL=https://cp.example.tld
          guard "no API_URL"          --set config.POSTGRES_DB_URI=postgres://u:p@h:5432/db
          guard "pglite"              --set config.POSTGRES_DB_URI=pglite:///data --set config.API_URL=https://cp.example.tld
          guard "API_URL no scheme"   --set config.POSTGRES_DB_URI=postgres://u:p@h:5432/db --set config.API_URL=cp.example.tld
          guard "PORT moved"          "${base[@]}" --set config.PORT=9000
          guard "issuer, no client"   "${base[@]}" --set config.IDP_ISSUER=https://idp
          guard "issuer, no secret"   "${base[@]}" --set config.IDP_ISSUER=https://idp --set config.IDP_CLIENT_ID=i
          guard "token + secret"      "${base[@]}" --set idpFederatedToken.enabled=true --set config.IDP_CLIENT_SECRET=s
          guard "token, no SA"        "${base[@]}" --set idpFederatedToken.enabled=true
          guard "image.command"       "${base[@]}" --set 'image.command={hoop}'
          guard "image.args"          "${base[@]}" --set 'image.args={start}'
          guard "no parentRefs"       "${base[@]}" --set gatewayApi.enabled=true --set gatewayApi.createGateway=false
          # A default route backed by a Service the chart was told not to
          # create resolves to nothing: BackendNotFound, and every request
          # gets a 500 from an install that rendered clean.
          guard "route, no Service"   "${base[@]}" --set gatewayApi.enabled=true --set service.enabled=false

          # The inverse: valid values must still render. Without this, a guard
          # that fires on everything also passes above.
          helm template t "$chart" "${base[@]}" --set config.TLS_CERT=a --set config.TLS_KEY=b >/dev/null \
            || { echo "::error::a complete TLS pair was refused"; exit 1; }
          # Half a pair is ACCEPTED and degrades to plaintext, matching
          # appconfig: TLS is on exactly when both are set. The chart must not
          # reinvent a rule the binary does not have.
          helm template t "$chart" "${base[@]}" --set config.TLS_CERT=a >/dev/null \
            || { echo "::error::half a TLS pair was refused; the binary accepts it and serves plaintext"; exit 1; }
          # Custom rules name their own backend, so the Service is genuinely
          # optional there. The guard above must not catch this.
          helm template t "$chart" "${base[@]}" --set gatewayApi.enabled=true --set service.enabled=false \
            --set 'gatewayApi.httpRoute.rules[0].backendRefs[0].name=my-own-svc' \
            --set 'gatewayApi.httpRoute.rules[0].backendRefs[0].port=8009' >/dev/null \
            || { echo "::error::a route with custom rules was refused without the chart's Service"; exit 1; }
          idp=$(helm template t "$chart" "${base[@]}" --set config.IDP_ISSUER=https://idp \
            --set config.IDP_CLIENT_ID=i --set config.IDP_CLIENT_SECRET=s) \
            || { echo "::error::a complete IDP block was refused"; exit 1; }
          # OIDC is inferred from these keys alone — loadAuthMethod picks it up
          # when any IDP_* is set.
          echo "$idp" | grep -q 'IDP_ISSUER' \
            || { echo "::error::the IDP block did not reach the Secret"; exit 1; }

          # A federated token replaces the client secret (ENG-594), also on a
          # release whose values predate the idpFederatedToken key.
          fed=$(helm template t "$chart" "${base[@]}" --set config.IDP_ISSUER=https://idp \
            --set config.IDP_CLIENT_ID=i --set idpFederatedToken.enabled=true --set serviceAccount.create=true) \
            || { echo "::error::an IDP block with a federated token was refused"; exit 1; }
          echo "$fed" | grep -qF 'IDP_CLIENT_ASSERTION_FILE: "/var/run/secrets/hoop/idp/token"' \
            || { echo "::error::idpFederatedToken did not set IDP_CLIENT_ASSERTION_FILE"; exit 1; }
          helm template t "$chart" "${base[@]}" --set idpFederatedToken=null >/dev/null \
            || { echo "::error::a release without the idpFederatedToken key no longer renders"; exit 1; }

          echo "all thirteen control plane guards fire, and valid values still render"

          # The chart renders the control plane's environment and nothing else.
          # It does not police what an operator writes under config: a key it
          # does not know is simply not rendered, and extraSecret is the way
          # through. What must hold is the output — nothing gateway-only in the
          # Secret.
          # TLS_CERT/TLS_KEY are rendered unconditionally, empty when unset.
          # A conditionally-rendered key can never be un-set on an existing
          # release: Helm writes stringData, Kubernetes stores data, so the
          # patch that would delete the key is a no-op and the old value
          # survives the upgrade.
          secret=$(helm template t "$chart" "${base[@]}" --show-only templates/secret-config.yaml)
          for k in TLS_CERT TLS_KEY; do
            echo "$secret" | grep -qE "^  $k: (''|\"\")$" \
              || { echo "::error::$k is not rendered empty by default; clearing it on an upgrade would not take effect"; exit 1; }
          done
          for k in GRPC_URL DLP_PROVIDER PLUGIN_AUDIT_PATH USE_TLS HOOP_SPIFFE_MODE ORG_MULTI_TENANT STATIC_UI_PATH AUTH_METHOD; do
            echo "$secret" | grep -qE "^  $k:" \
              && { echo "::error::$k leaked into the control plane Secret"; exit 1; }
          done

          echo "no gateway-only key reaches the control plane Secret"

          # Gateway API. The gateway chart renders an HTTPRoute with no rules
          # when an operator enables the block and reads no further: it
          # attaches, routes nothing, and looks installed. This chart defaults
          # both parentRefs and rules, so assert they survive.
          gw=$(helm template cp "$chart" "${base[@]}" --set gatewayApi.enabled=true)
          echo "$gw" | grep -q 'kind: Gateway' \
            || { echo "::error::createGateway did not render a Gateway"; exit 1; }
          route=$(helm template cp "$chart" "${base[@]}" --set gatewayApi.enabled=true \
            --show-only templates/httproute.yaml)
          echo "$route" | grep -q 'name: cp-hoopcontrolplane$' \
            || { echo "::error::the default HTTPRoute lost its parentRef or backendRef"; exit 1; }
          echo "$route" | grep -q 'port: 8009' \
            || { echo "::error::the default HTTPRoute backend is not 8009"; exit 1; }
          # createGateway: false must attach to somebody else's Gateway and
          # render no Gateway of its own.
          helm template cp "$chart" "${base[@]}" --set gatewayApi.enabled=true \
            --set gatewayApi.createGateway=false --set 'gatewayApi.httpRoute.parentRefs[0].name=shared' \
            | grep -q 'kind: Gateway' \
            && { echo "::error::createGateway=false still rendered a Gateway"; exit 1; }

          echo "Gateway API renders with working parentRefs and rules defaults"

          # Two releases in one namespace must be independent. A hardcoded
          # resource name or a selector without the instance label makes the
          # second install adopt the first one's pods — the bug the gateway
          # chart has and this one must not.
          iso=(--set config.POSTGRES_DB_URI=postgres://u:p@h:5432/db
               --set config.API_URL=https://cp.example.tld
               --set serviceAccount.create=true
               --set extraSecret.K=v)
          helm template cp-a "$chart" "${iso[@]}" > /tmp/cp1.yaml
          helm template cp-b "$chart" "${iso[@]}" > /tmp/cp2.yaml
          names() { grep -E '^  name: ' "$1" | sort -u; }
          if comm -12 <(names /tmp/cp1.yaml) <(names /tmp/cp2.yaml) | grep -q .; then
            echo "::error::two control plane releases share a resource name:"
            comm -12 <(names /tmp/cp1.yaml) <(names /tmp/cp2.yaml)
            exit 1
          fi
          # Scoped to the selector block: metadata.labels carries the same
          # labels, so a plain grep passes on a broken selector.
          sel=$(awk '/^  selector:$/{f=1;next} f&&/^  [^ ]/{f=0} f' /tmp/cp1.yaml)
          echo "$sel" | grep -q 'app.kubernetes.io/instance: cp-a' \
            || { echo "::error::the control plane Service selector lost its instance label"; exit 1; }
          echo "$sel" | grep -q 'app.kubernetes.io/instance: cp-b' \
            && { echo "::error::release cp-a leaked cp-b labels"; exit 1; }

          echo "two control plane releases in one namespace share no resource name or selector"
