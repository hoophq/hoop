# Weekly base-OS re-patch of the minimal production agent image
# (hoophq/hoopdev-minimal). Closes DEP-91 point 4: "weekly base-OS patches".
#
# hoophq/hoopdev-minimal is the low-CVE production base — Dockerfile.minimal runs
# `apt-get upgrade -y`, so rebuilding it re-pulls current OS security patches
# even when no code changed. Releases already rebuild every image; this fills the
# gap BETWEEN releases so :latest does not accrue unpatched OS CVEs for weeks.
#
# The application binary is NOT rebuilt here. This job re-patches only the OS
# layer under the exact binary of the latest published release. It prefers
# GitHub Release assets and their independently recorded SHA-256 digests.
# Pre-DEP-91 releases fall back to releases.hoop.dev only when both that
# release's checksum list and a reviewed compatibility pin match the archive.
# The ENFORCING gate is scoped to the OS layer (--pkg-types os) — the layer this
# rebuild actually changes — and runs against EVERY published platform. The
# shipped Go binary's dependency/toolchain CVEs are fixed by a RELEASE (source
# bumps + the govulncheck PR gate + the release-time Trivy scan), never by an OS
# rebuild, so they are only REPORTED here — otherwise a release lagging a Go fix
# would perpetually block OS patching.
#
# Published tags:
#   hoophq/hoopdev-minimal:latest                — moving, always the latest patches
#   hoophq/hoopdev-minimal:<release>-<YYYYMMDD>  — weekly patched snapshot
# The plain release tag hoophq/hoopdev-minimal:<release> is left untouched.
# :latest moves on every successful run; a dated tag may move on a same-day
# retry. Pin hoophq/hoopdev-minimal@sha256:... whenever immutable bytes matter.
name: Minimal Agent Weekly Rebuild

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

concurrency:
  group: minimal-rebuild
  cancel-in-progress: false

jobs:
  rebuild-minimal:
    runs-on: ubuntu-latest
    name: Re-patch and publish hoophq/hoopdev-minimal
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Prefer GitHub Release assets: their recorded SHA-256 digests are an
      # independent trust anchor. Releases before DEP-91 have no Hoop assets
      # there, so they may use the canonical releases.hoop.dev distribution
      # only when its checksum also matches a reviewed compatibility pin in
      # this checkout. Partial GitHub uploads, missing pins, invalid digests,
      # failed downloads, or either mismatch fail closed before any build.
      - name: Resolve latest release and stage binaries
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName')"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::could not resolve a valid latest release version"; exit 1
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          mkdir -p dist/binaries

          assets=(
            "hoop_${ver}_Linux_x86_64.tar.gz"
            "hoop_${ver}_Linux_aarch64.tar.gz"
          )
          verified_checksums="dist/binaries/.verified-checksums"
          : > "$verified_checksums"

          asset_metadata="$(gh release view "$ver" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets)"
          declare -A github_digests=()
          github_asset_count=0
          for asset in "${assets[@]}"; do
            mapfile -t digests < <(
              jq -r --arg name "$asset" \
                '.assets[] | select(.name == $name) | .digest // ""' \
                <<< "$asset_metadata"
            )
            if [ "${#digests[@]}" -gt 1 ]; then
              echo "::error::duplicate GitHub Release asset ${asset}"; exit 1
            fi
            if [ "${#digests[@]}" -eq 1 ]; then
              if ! [[ "${digests[0]}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "::error::missing or invalid GitHub digest for ${asset}"; exit 1
              fi
              github_digests["$asset"]="${digests[0]#sha256:}"
              github_asset_count=$((github_asset_count + 1))
            fi
          done

          if [ "$github_asset_count" -eq 2 ]; then
            for asset in "${assets[@]}"; do
              gh release download "$ver" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset" \
                --dir dist/binaries
              printf '%s  %s\n' "${github_digests[$asset]}" \
                "dist/binaries/${asset}" >> "$verified_checksums"
            done
          elif [ "$github_asset_count" -eq 0 ]; then
            echo "::warning::${ver} predates GitHub Hoop assets; using reviewed releases.hoop.dev compatibility pins"
            base_url="https://releases.hoop.dev/release/${ver}"
            checksums="dist/binaries/checksums.txt"
            curl --fail --location --silent --show-error \
              --proto '=https' --tlsv1.2 \
              --retry 3 --retry-all-errors \
              --output "$checksums" "${base_url}/checksums.txt"

            for asset in "${assets[@]}"; do
              curl --fail --location --silent --show-error \
                --proto '=https' --tlsv1.2 \
                --retry 3 --retry-all-errors \
                --output "dist/binaries/${asset}" "${base_url}/${asset}"

              mapfile -t release_digests < <(
                awk -v expected="./dist/binaries/${asset}" \
                  '$2 == expected { print $1 }' "$checksums"
              )
              mapfile -t reviewed_digests < <(
                awk -v expected="$asset" \
                  '$2 == expected { print $1 }' \
                  scripts/ci/legacy-release-checksums.sha256
              )
              if [ "${#release_digests[@]}" -ne 1 ] || \
                [ "${#reviewed_digests[@]}" -ne 1 ] || \
                ! [[ "${release_digests[0]}" =~ ^[0-9a-f]{64}$ ]] || \
                ! [[ "${reviewed_digests[0]}" =~ ^[0-9a-f]{64}$ ]] || \
                [ "${release_digests[0]}" != "${reviewed_digests[0]}" ]; then
                echo "::error::missing, duplicate, invalid, or unreviewed checksum for ${asset}"
                exit 1
              fi
              printf '%s  %s\n' "${reviewed_digests[0]}" \
                "dist/binaries/${asset}" >> "$verified_checksums"
            done
          else
            echo "::error::partial GitHub Hoop asset set for ${ver}; refusing fallback"
            exit 1
          fi

          test "$(wc -l < "$verified_checksums")" -eq 2
          sha256sum -c "$verified_checksums"
          rm -f "$verified_checksums" dist/binaries/checksums.txt

      # Build each published platform and load it for the OS-layer gate BEFORE
      # publishing anything: a rebuild that regresses on EITHER arch must not
      # reach :latest.
      - name: Build (amd64, load for gates)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: ./Dockerfile.minimal
          context: '.'
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: false
          load: true
          tags: hoophq/hoopdev-minimal:cand-amd64

      # The image must run as the unprivileged 'hoop' user (uid 10001). The USER
      # directive is arch-independent, so assert it once on the amd64 candidate.
      - name: Verify runtime user is unprivileged
        run: |
          uid="$(docker run --rm --entrypoint id hoophq/hoopdev-minimal:cand-amd64 -u)"
          echo "runtime uid: ${uid}"
          test "${uid}" = "10001"

      - name: Gate on fixable CRITICAL/HIGH (amd64 OS layer, enforcing)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f image \
            --pkg-types os --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --exit-code 1 --no-progress \
            hoophq/hoopdev-minimal:cand-amd64

      - name: Build (arm64, load for gate)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: ./Dockerfile.minimal
          context: '.'
          platforms: linux/arm64
          provenance: false
          sbom: false
          push: false
          load: true
          tags: hoophq/hoopdev-minimal:cand-arm64

      - name: Gate on fixable CRITICAL/HIGH (arm64 OS layer, enforcing)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f image \
            --pkg-types os --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --exit-code 1 --no-progress \
            hoophq/hoopdev-minimal:cand-arm64

      # REPORT-ONLY: the shipped Go binary's fixable CVEs are fixed by a release
      # (dependency bumps + the govulncheck gate), not by this OS rebuild. Surface
      # them so a lagging release is visible, but never block an OS patch on them.
      # The Go binary's deps are identical across arches, so report once.
      - name: Report shipped-binary fixable CRITICAL/HIGH (Go layer, non-blocking)
        run: |
          if ! docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f image \
            --pkg-types library --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --quiet --format json \
            hoophq/hoopdev-minimal:cand-amd64 > go-vuln.json; then
            echo "::warning::Go-layer vulnerability report unavailable"; exit 0
          fi
          n=$(jq '[.Results[]?.Vulnerabilities // []] | add | length' go-vuln.json 2>/dev/null || echo "?")
          {
            echo "### hoophq/hoopdev-minimal ${{ steps.rel.outputs.version }} — shipped-binary fixable CRITICAL/HIGH: ${n} (report-only)"
            echo ""
            echo "Fixed by cutting a release (dependency bumps + govulncheck gate), not by this OS rebuild."
            echo '```'
            jq -r '[.Results[]?.Vulnerabilities // []] | add | .[:20][] | "\(.Severity)\t\(.PkgName)\t\(.VulnerabilityID)\t-> \(.FixedVersion)"' go-vuln.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Registry credentials enter the job only after every candidate scan has
      # finished, so neither Trivy nor an untrusted image can access a push token.
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Both arches passed every gate. Push those exact loaded image objects
      # under unique, per-run candidate tags, then compose :latest and the dated
      # multiarch snapshot from those candidates. Never rebuild after scanning:
      # a second apt transaction could produce different, ungated bytes.
      - name: Push gated candidates and multiarch tags
        env:
          RELEASE_VERSION: ${{ steps.rel.outputs.version }}
          SNAPSHOT_DATE: ${{ steps.rel.outputs.date }}
        run: |
          repo="hoophq/hoopdev-minimal"
          candidate="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          amd64_ref="${repo}:weekly-${candidate}-amd64"
          arm64_ref="${repo}:weekly-${candidate}-arm64"

          docker tag "${repo}:cand-amd64" "$amd64_ref"
          docker tag "${repo}:cand-arm64" "$arm64_ref"
          docker push "$amd64_ref"
          docker push "$arm64_ref"

          for tag in latest "${RELEASE_VERSION}-${SNAPSHOT_DATE}"; do
            docker manifest create "${repo}:${tag}" \
              --amend "$amd64_ref" \
              --amend "$arm64_ref"
            docker manifest push "${repo}:${tag}"
          done
