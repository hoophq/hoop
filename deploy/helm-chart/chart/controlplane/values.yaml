## Default values for the Hoop control plane.
## This is a YAML-formatted file.

# -- Image to run. The control plane is the gateway image started with a
# different container command.
image:
  repository: hoophq/hoop
  tag: latest
  pullPolicy: Always

# -- Name of an existing Secret loaded into the container as environment
# variables. Required: the control plane reads the gateway's database and API
# configuration (POSTGRES_DB_URI, API_URL, ...) and this chart renders no
# Secret of its own.
existingSecret: ''

# -- Number of replicas.
replicas: 1
