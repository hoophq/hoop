{{- if .Values.gatewayApi.enabled -}}
{{- $fullname := include "hoopcontrolplane.fullname" . -}}
{{- $gwName := .Values.gatewayApi.gateway.name | default $fullname -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.gatewayApi.httpRoute.name | default (printf "%s-route" $fullname) }}
  labels:
    {{- include "hoopcontrolplane.labels" . | nindent 4 }}
  {{- with .Values.gatewayApi.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with .Values.gatewayApi.httpRoute.parentRefs }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - name: {{ $gwName }}
    {{- end }}
  {{- with .Values.gatewayApi.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- with .Values.gatewayApi.httpRoute.rules }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ include "hoopcontrolplane.basePath" . }}/
      backendRefs:
        - name: {{ $fullname }}
          port: {{ include "hoopcontrolplane.httpPort" . }}
    {{- end }}
{{- end }}
