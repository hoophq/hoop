{{- if not .Values.existingSecret -}}
{{- fail "existingSecret is required: the control plane reads the gateway's database and API configuration (POSTGRES_DB_URI, API_URL, ...) and this chart renders no Secret of its own." -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hoopcontrolplane
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: hoopcontrolplane
  # maxUnavailable 0 keeps the running pod until the new one is ready, so an
  # upgrade does not drop the API.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: hoopcontrolplane
    spec:
      containers:
      - image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
        name: hoopcontrolplane
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        # The command selects the component. Booting this image as
        # "hoop start gateway" would open the gRPC transport and the protocol
        # proxies, which a control plane has no agents to serve.
        args:
        - hoop
        - start
        - control-plane
        envFrom:
        - secretRef:
            name: {{ .Values.existingSecret }}
        # /api/healthz is the only route the control plane serves today.
        livenessProbe:
          httpGet:
            path: /api/healthz
            port: 8009
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/healthz
            port: 8009
          initialDelaySeconds: 5
          periodSeconds: 10
        ports:
        - containerPort: 8009
          name: api
