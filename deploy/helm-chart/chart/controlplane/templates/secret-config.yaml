apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hoopcontrolplane.configSecretName" . }}
  labels:
    {{- include "hoopcontrolplane.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB_URI: {{ required "config.POSTGRES_DB_URI is required" .Values.config.POSTGRES_DB_URI | quote }}
  API_URL: {{ required "config.API_URL is required" .Values.config.API_URL | quote }}

  {{- $idpAssertionFile := include "hoopcontrolplane.idpClientAssertionFile" . }}
  IDP_CLIENT_ASSERTION_FILE: {{ $idpAssertionFile | quote }}
  {{- if .Values.config.IDP_ISSUER }}
  IDP_ISSUER: {{ .Values.config.IDP_ISSUER | quote }}
  IDP_CLIENT_ID: {{ required "config.IDP_CLIENT_ID is required when config.IDP_ISSUER is set" .Values.config.IDP_CLIENT_ID | quote }}
  {{- if $idpAssertionFile }}
  IDP_CLIENT_SECRET: ""
  {{- else }}
  IDP_CLIENT_SECRET: {{ required "config.IDP_CLIENT_SECRET or idpFederatedToken.enabled is required when config.IDP_ISSUER is set" .Values.config.IDP_CLIENT_SECRET | quote }}
  {{- end }}
  IDP_CUSTOM_SCOPES: {{ .Values.config.IDP_CUSTOM_SCOPES | default "" | quote }}
  IDP_GROUPS_CLAIM: {{ .Values.config.IDP_GROUPS_CLAIM | default "" | quote }}
  {{- end }}
  IDP_AUDIENCE: {{ .Values.config.IDP_AUDIENCE | default "" | quote }}

  MIGRATION_PATH_FILES: {{ .Values.config.MIGRATION_PATH_FILES | default "" | quote }}
  POSTGRES_MAX_OPEN_CONNS: {{ include "hoopcontrolplane.pgMaxOpenConns" . | quote }}
  GIN_MODE: {{ .Values.config.GIN_MODE | default "release" | quote }}
  LOG_ENCODING: {{ .Values.config.LOG_ENCODING | default "json" | quote }}
  LOG_LEVEL: {{ .Values.config.LOG_LEVEL | default "info" | quote }}
  SLACK_SOCKET_SLOTS: {{ .Values.config.SLACK_SOCKET_SLOTS | default "3" | quote }}

  TLS_CERT: {{ .Values.config.TLS_CERT | default "" | quote }}
  TLS_KEY: {{ .Values.config.TLS_KEY | default "" | quote }}

  HOOP_LICENSE: {{ .Values.config.HOOP_LICENSE | default "" | quote }}
  ANALYTICS_TRACKING: {{ .Values.config.ANALYTICS_TRACKING | default "" | quote }}
  ORG_ID: {{ .Values.config.ORG_ID | default "" | quote }}

  # OpenTelemetry push of the control plane's own signals. Off while
  # OTEL_EXPORTER_OTLP_ENDPOINT is empty.
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.OTEL_EXPORTER_OTLP_ENDPOINT | default "" | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.config.OTEL_EXPORTER_OTLP_PROTOCOL | default "" | quote }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ .Values.config.OTEL_EXPORTER_OTLP_HEADERS | default "" | quote }}
  OTEL_EXPORTER_OTLP_INSECURE: {{ .Values.config.OTEL_EXPORTER_OTLP_INSECURE | default "" | quote }}
  OTEL_EXPORTER_OTLP_CERTIFICATE: {{ .Values.config.OTEL_EXPORTER_OTLP_CERTIFICATE | default "" | quote }}
  OTEL_EXPORTER_OTLP_TIMEOUT: {{ .Values.config.OTEL_EXPORTER_OTLP_TIMEOUT | default "" | quote }}
  OTEL_METRIC_EXPORT_INTERVAL: {{ .Values.config.OTEL_METRIC_EXPORT_INTERVAL | default "" | quote }}
  OTEL_TRACES_SAMPLER: {{ .Values.config.OTEL_TRACES_SAMPLER | default "" | quote }}
  OTEL_TRACES_SAMPLER_ARG: {{ .Values.config.OTEL_TRACES_SAMPLER_ARG | default "" | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.OTEL_SERVICE_NAME | default "hoop-control-plane" | quote }}
  OTEL_RESOURCE_ATTRIBUTES: {{ .Values.config.OTEL_RESOURCE_ATTRIBUTES | default "" | quote }}
