## Default values for hoop.
## This is a YAML-formatted file.
## Declare variables to be passed into your templates.

# Refer to this guide for more details: https://hoop.dev/docs/setup/deployment/overview

# -- Define a custom image configuration
image: {}
  # repository: hoophq/hoopdev
  # pullPolicy: Always
  # tag: latest
  #
  # Realtime RDP PII guard: to enable agent-side PII analysis, use the
  # bundled-OCR agent image (the OCR engine runs on loopback inside the
  # container — screen pixels never leave the agent). Provide
  # MSPRESIDIO_ANALYZER_URL below; the gateway turns the guard on per-org via
  # the experimental.rdp_pii_guard flag. Pick one variant:
  #   # CPU:
  #   repository: hoophq/hoop-agent-ocr
  #   tag: <release>
  #   # GPU (pod needs a GPU + the nvidia device plugin/runtime):
  #   repository: hoophq/hoop-agent-ocr
  #   tag: <release>-gpu
  #
  # Live Data Masking with the gateway's DLP_PROVIDER=alcatraz: to serve the
  # statistical entity types (PERSON, LOCATION, NRP), the model has to be on
  # disk. The images that bake it in are the hoophq/hoopagent `-alcatraz` tags
  # below, which set ALCATRAZ_NER_MODEL_PATH themselves; with hoophq/hoopdev,
  # mount the model and set that variable under config:. Either way the model is
  # resident memory once loaded — check the note there before sizing the pod.
  #
  # hoophq/hoopagent ships the `hoop` binary and nothing else — no database
  # clients, no shell tooling, no Rust agent — and runs as uid 10001. It carries
  # no AGPL/SSPL component. Use it when the agent only serves connection types it
  # handles in-process (tcp, postgres, mysql, mssql, mongodb, httpproxy, ssh,
  # ssm). Custom/command-line connections and RDP are NOT supported; those need
  # hoophq/hoopdev above. There is no unsuffixed tag and no `latest` — always
  # name a flavour and a release:
  #   # Ubuntu 24.04 LTS base; keeps a shell for `kubectl exec` debugging:
  #   repository: hoophq/hoopagent
  #   tag: <release>-minimal
  #   # distroless base; no OS packages and no shell at all (smallest surface):
  #   repository: hoophq/hoopagent
  #   tag: <release>-distroless
  #   # either flavour with the alcatraz NER model baked in, for the statistical
  #   # entity types (PERSON, LOCATION, NRP) below — the same image plus ~250MB
  #   # of weights, setting ALCATRAZ_NER_MODEL_PATH itself:
  #   repository: hoophq/hoopagent
  #   tag: <release>-minimal-alcatraz
  #   # or
  #   tag: <release>-distroless-alcatraz

config: {}
  # HOOP_KEY: '<AUTH_KEY>'
  # LOG_ENCODING: 'console|json'
  # LOG_LEVEL: 'debug|info|warn|error'
  # LOG_GRPC: '0|1|2'
  # HOOP_GATEWAY_URL: 'https://gateway.example.com'
  # Presidio analyzer for the RDP PII guard (and terminal DLP). Required to
  # enable guarding when using the bundled-OCR agent image above.
  # MSPRESIDIO_ANALYZER_URL: ''
  # MSPRESIDIO_ANONYMIZER_URL: ''
  # DLP_MODE: 'strict|best-effort'
  #
  # NER module for the gateway's DLP_PROVIDER=alcatraz: detects statistical
  # entity types (PERSON, LOCATION, NRP) with an in-process ONNX model. The
  # model is never fetched at runtime, so having it on disk is what enables
  # the module: point ALCATRAZ_NER_MODEL_PATH at the models directory — the
  # parent that holds one subdirectory per model id, which is what
  # "alcatraz models download --dest <dir>" writes into — mounted from a
  # volume. Leave this unset if you run an image that bakes the model in (a
  # hoophq/hoopagent `-alcatraz` tag): it sets the variable itself. With
  # neither the image nor the volume, sessions requesting those entity types
  # are refused. The model costs ~260MB of resident memory: it loads lazily on
  # the first session that needs it and is not released until the pod restarts,
  # so size the agent pod accordingly.
  # ALCATRAZ_NER_MODEL_PATH: ''
  #
  # HashiCorp Vault secrets-manager integration (agent-side). Set VAULT_ADDR
  # plus either a static token (VAULT_TOKEN) or AppRole credentials
  # (VAULT_APP_ROLE_ID + VAULT_APP_ROLE_SECRET_ID, both required together).
  # VAULT_TOKEN and VAULT_CACERT accept the 'base64://<...>' or 'file://<path>'
  # prefixes in addition to a raw value.
  # VAULT_ADDR: 'https://vault.example.com:8200'
  # VAULT_TOKEN: ''
  # VAULT_CACERT: ''
  # VAULT_APP_ROLE_ID: ''
  # VAULT_APP_ROLE_SECRET_ID: ''
  # Per-request timeout for the agent's Vault HTTP calls (Go duration, e.g.
  # '10s', '1m'). Values <= 1s are rejected and the default is used.
  # Defaults to '10s' when unset.
  # VAULT_HTTP_REQ_TIMEOUT: '10s'

# -- Authenticate the agent to the gateway via SPIFFE JWT-SVID instead of HOOP_KEY.
# When enabled:
#   * config.HOOP_KEY MUST be left unset. HOOP_KEY takes precedence over
#     SPIFFE, so leaving a stale HOOP_KEY in your values silently disables
#     SPIFFE on this agent.
#   * the agent reads HOOP_SPIFFE_KEY_FILE=/run/spiffe/agent.jwt
#   * config.HOOP_GATEWAY_URL is ignored; set spiffe.grpcHost to your gateway's
#     gRPC endpoint (host:port, e.g. grpc.hoop.example.com:8010)
#   * a spiffe-helper sidecar writes /run/spiffe/agent.jwt on a shared emptyDir
#     and rotates it before expiry
# Requires a SPIRE Agent DaemonSet reachable from each node where this agent
# may be scheduled, plus a private.agent_spiffe_mappings row on the gateway
# for the SPIFFE ID this pod presents. The chart additionally needs one of:
#   * SPIFFE CSI Driver (csi.spiffe.io) installed — when workloadAPI.type=csi
#   * hostPath access allowed by Pod Security Admission — when workloadAPI.type=hostPath
# Using SPIFFE is the recommended way to run replicaCount > 1, since each
# replica receives its own short-lived SVID instead of sharing a static
# HOOP_KEY (which causes stream flapping on the gateway).
spiffe:
  enabled: false
  # Gateway gRPC endpoint the agent dials, e.g. grpc.hoop.example.com:8010
  grpcHost: ''
  # Skip TLS verification when dialing the gateway. Dev/testing only.
  grpcSkipVerify: false
  # Force plaintext gRPC when dialing the gateway (sets HOOP_GRPC_INSECURE).
  # In SPIFFE mode the agent normally always uses TLS for non-loopback URLs;
  # set this to true when the gateway's gRPC port doesn't terminate TLS
  # (typically local clusters where TLS_KEY/TLS_CERT are unset). Production
  # deployments should always leave this false and run a TLS-terminated
  # gateway. Mutually informational with grpcSkipVerify: when grpcInsecure
  # is true, no TLS handshake is attempted, so grpcSkipVerify is irrelevant.
  grpcInsecure: false
  # Optional cosmetic HOOP_SPIFFE_NAME passed to the agent. Identity is
  # resolved from the SPIFFE mapping, not this field. Leave empty to omit.
  name: ''

  # How the spiffe-helper sidecar reaches the SPIRE Workload API socket
  # exposed by the node-local SPIRE Agent. Pick one of:
  #   csi      — uses the SPIFFE CSI Driver (csi.spiffe.io). Requires the
  #              driver installed as a DaemonSet. Compatible with Pod
  #              Security Admission "baseline" and "restricted".
  #   hostPath — mounts the node's socket directory directly. Drops the
  #              CSI Driver dependency at the cost of requiring a Pod
  #              Security Admission profile that allows hostPath volumes.
  workloadAPI:
    type: csi
    # Only used when type=hostPath. Directory on the node where the SPIRE
    # Agent exposes its Workload API socket. Defaults to the SPIRE Helm
    # chart's convention; adjust if your SPIRE install uses a different
    # socket_path.
    hostPath: /run/spire/agent-sockets

  spiffeHelper:
    image: ghcr.io/spiffe/spiffe-helper:0.9.1
    imagePullPolicy: IfNotPresent
    # Unix socket path (as seen inside the sidecar) to the SPIRE Workload
    # API. Default matches the SPIFFE CSI Driver's convention; for
    # hostPath mode the filename is usually different (e.g. api.sock or
    # agent.sock, depending on your SPIRE agent's socket_path). Override
    # to match your SPIRE install.
    agentAddress: /spiffe-workload-api/spire-agent.sock
    # Required. Must match config.HOOP_SPIFFE_AUDIENCE on the gateway.
    audience: ''
    # resources:
    #   limits:
    #     cpu: 100m
    #     memory: 64Mi
    #   requests:
    #     cpu: 50m
    #     memory: 32Mi

# -- Define extra secret as environment variables
extraSecret: {}
# ENVSECRET1: RAWVALUE1
# ENVSECRET2: RAWVALUE2

# -- Number of agent replicas. Increase this value to run multiple agent instances
# for high availability across nodes/zones. Each replica connects independently to
# the gateway, which distributes connections across healthy agents.
# When using more than one replica, consider setting deploymentStrategy.type to
# RollingUpdate to avoid downtime during deployments.
replicas: 1

# -- Deployment strategy
deploymentStrategy:
  type: Recreate

# -- CPU/Memory resource requests/limits
# resources:
#   limits:
#     cpu: 1024m
#     memory: 1Gi
#   requests:
#     cpu: 1024m
#     memory: 1Gi

# -- Node labels for pod assignment
nodeSelector: {}

# -- Toleration labels for pod assignment
tolerations: []

# -- Affinity settings for pod assignment
affinity: {}

## Set pod annotations
##
podAnnotations: {}

## Set deployment annotations
##
deploymentAnnotations: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}

# -- Additional init containers to run before the agent container
additionalInitContainers: []
# - name: init-myservice
#   image: busybox
#   command: ['sh', '-c', 'echo init']

# -- Volume mounts for the agent container
volumeMounts: []
# - name: my-configmap-volume
#   mountPath: /etc/config/myfile.conf
#   subPath: myfile.conf

# -- Volumes to mount into the pod
volumes: []
# - name: my-configmap-volume
#   configMap:
#     name: my-configmap
