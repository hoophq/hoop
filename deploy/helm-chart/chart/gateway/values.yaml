## Default values for hoop.
## This is a YAML-formatted file.
## Declare variables to be passed into your templates.

# Refer to this guide for more details: https://hoop.dev/docs/setup/deployment/overview

# -- Define a custom image configuration
image:
  gw: {}
  #   repository: hoophq/hoop
  #   pullPolicy: Always
  #   tag: latest

# -- Enable the default agent (authenticates to the gateway via HOOP_KEY / DSN)
defaultAgent:
  enabled: false
  imageRepository: 'hoophq/hoopdev'
  imageTag: latest
  imagePullPolicy: Always
  grpcScheme: grpc
  grpcHost: 127.0.0.1:8010
  # 'base64://<base64-encoded-ca-cert>'
  # 'file:///path/to/ca-cert.pem'
  grpcTlsCa: ''
  grpcSkipVerify: false

# -- Enable PostgreSQL
postgres:
  # it default to host mount when enabled
  enabled: false

  # set a storage class name to use a Persistent Volume Claim
  storageClassName: null

  # -- Size of PVC
  size: 10Gi
  # annotations: {}

# -- Enable data masking with Presidio
dataMasking:
  enabled: false

  # Presidio version information: https://github.com/microsoft/presidio/releases
  version: latest

  # best-effort | strict
  mode: best-effort

  analyzer:
    replicas: 1
    imageRepository: mcr.microsoft.com/presidio-analyzer
    imagePullPolicy: Always
    imageTag: latest

    # Presidio WSGI HTTP Server configuration
    gunicornConfigFile: |
      bind = '0.0.0.0:3000'
      workers = 2
      threads = 4
      timeout = 120
      keep_alive = 65
      preload_app = True
      loglevel = 'debug'
      worker_class = 'gthread'

    resources:
      limits:
        cpu: 2200m
        memory: 2048Mi
      requests:
        cpu: 1024m
        memory: 1024Mi

  anonymizer:
    replicas: 1
    imageRepository: mcr.microsoft.com/presidio-anonymizer
    imagePullPolicy: Always
    imageTag: latest

    # Presidio WSGI HTTP Server configuration
    gunicornConfigFile: |
      bind = '0.0.0.0:3000'
      workers = 2
      threads = 4
      timeout = 120
      keep_alive = 65
      preload_app = True
      loglevel = 'debug'
      worker_class = 'gthread'

    resources:
      limits:
        cpu: 2048m
        memory: 1024Mi
      requests:
        cpu: 256m
        memory: 512Mi

  envoyProxy:
    replicas: 1
    imageRepository: envoyproxy/envoy
    imagePullPolicy: Always
    imageTag: v1.33-latest

    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi

## Set pod annotations
##
podAnnotations: {}

## Set deployment annotations
##
deploymentAnnotations: {}

# -- Pod-level security context for the gateway Pod
# (e.g. fsGroup, runAsNonRoot, runAsUser, seccompProfile)
podSecurityContext: {}

# -- Container-level security context for the gateway and default-agent
# containers (e.g. allowPrivilegeEscalation, capabilities,
# readOnlyRootFilesystem, runAsNonRoot, seccompProfile)
securityContext: {}

# hoop gateway configuration. Please refer to https://hoop.dev/docs/self-hosting
config:
  # postgres://user:pass@host:5432/dbname — external PostgreSQL (recommended).
  # pglite:///path/to/data-dir — embedded PostgreSQL (single-node/standalone
  # only; requires a persistent volume mounted at the data directory).
  POSTGRES_DB_URI: ''
  # Most PostgreSQL connections one gateway pod opens; past it a query waits
  # in process instead of taking a server slot. The database serves the sum
  # over every pod: size the sum at 2-4 x its vCPUs and divide by the pods
  # that can run at once.
  # POSTGRES_MAX_OPEN_CONNS: '50'
  # Optional: load SQL migration files from a directory on disk instead of
  # the copy embedded in the gateway binary. Only set this if you manage
  # migration files externally; the image ships them at /app/migrations.
  # MIGRATION_PATH_FILES: '/app/migrations'
  # API_URL: 'yourdomain.tld'
  IDP_AUDIENCE: null
  IDP_ISSUER: null
  IDP_CLIENT_ID: null
  IDP_CLIENT_SECRET: null
  # Path to a JWT that authenticates the OIDC client in place of
  # IDP_CLIENT_SECRET. idpFederatedToken.enabled sets it for you.
  IDP_CLIENT_ASSERTION_FILE: null
  IDP_CUSTOM_SCOPES: null
  # LOG_ENCODING: 'console|json'
  # LOG_LEVEL: 'debug|info|warn|error'
  # LOG_GRPC: "0|1|2"
  # ASK_AI_CREDENTIALS: ''
  # License of the default organization, stored at every boot: the signed
  # license JSON itself (starts with '{') or the path of a file that holds it.
  # HOOP_LICENSE: ''
  # Analytics of the default organization, set at every boot. Without an
  # enterprise license it is always identified. With one: 'enabled' forces
  # identified, 'disabled' forces disabled, unset keeps the stored mode (a
  # new organization starts disabled).
  # ANALYTICS_TRACKING: ''
  # UUID the default organization is created with on a fresh database, so
  # API_KEY can be set before the first boot. It never renames an existing one.
  # ORG_ID: ''
  # OpenTelemetry: the gateway pushes its own metrics (sidecar handshakes,
  # session event ingest, database pool, API latency) to an OTLP collector.
  # Off while the endpoint is empty. Nothing scrapes the gateway.
  # OTEL_EXPORTER_OTLP_ENDPOINT: 'otel-collector:4317'   # a URL, or host:port for grpc
  # OTEL_EXPORTER_OTLP_PROTOCOL: 'grpc'                  # grpc | http/protobuf
  # OTEL_EXPORTER_OTLP_HEADERS: ''                       # k=v,k2=v2, values URL-encoded
  # OTEL_EXPORTER_OTLP_INSECURE: 'false'                 # true sends a host:port endpoint in the clear
  # OTEL_EXPORTER_OTLP_CERTIFICATE: ''                   # PEM file with the collector's CA
  # OTEL_EXPORTER_OTLP_TIMEOUT: '10000'                  # milliseconds per export
  # OTEL_METRIC_EXPORT_INTERVAL: '60000'                 # milliseconds between exports
  # OTEL_TRACES_SAMPLER: ''                              # empty sends no spans; e.g. parentbased_traceidratio
  # OTEL_TRACES_SAMPLER_ARG: ''                          # the ratio, 0 to 1
  # OTEL_SERVICE_NAME: 'hoop-gateway'
  # OTEL_RESOURCE_ATTRIBUTES: ''                         # e.g. deployment.environment=prod
  # Data masking provider: 'mspresidio' (or dataMasking.enabled above),
  # 'gcp' (requires GOOGLE_APPLICATION_CREDENTIALS_JSON) or 'alcatraz'
  # (in-process pattern engine on the agent, no extra services or
  # credentials; statistical entity types such as PERSON/LOCATION also
  # need the NER model on the agent — see ALCATRAZ_NER_MODEL_PATH in the
  # agent chart).
  # DLP_PROVIDER: ''
  # DLP_MODE: 'best-effort|strict'
  # GOOGLE_APPLICATION_CREDENTIALS_JSON: ''
  # PLUGIN_AUDIT_PATH: ''
  # PLUGIN_INDEX_PATH: ''
  #
  # Async RDP session-replay PII analysis. Workers run OCR + Presidio over
  # recorded RDP bitmap frames so the webapp can highlight PII on top of the
  # replay. Defaults to 0 (disabled). Set RDP_ANALYSIS_WORKERS >= 1 and ensure
  # MSPRESIDIO_ANALYZER_URL is reachable and an OCR engine is available
  # (RDP_OCR_SERVER_URL or tesseract installed in the gateway image).
  # RDP_ANALYSIS_WORKERS: '0'
  # RDP_PII_SNAPSHOT_INTERVAL: '0.25'
  # RDP_PII_SCORE_THRESHOLD: '0.9'
  # RDP_PII_ENTITY_DENYLIST: 'DATE_TIME,NRP'
  #
  # Realtime agent-side PII guard action on detection: redact (default: blank
  # the PII region and continue the session), kill (drop and terminate), or
  # redact_and_kill.
  # RDP_PII_GUARD_POLICY: 'redact'
  #
  # Replicas that open a Slack socket per organization, 1 to 9. Slack allows
  # 10 sockets per app.
  # SLACK_SOCKET_SLOTS: '3'
  #
  # Optional OCR sidecar (RapidOCR/PaddleOCR HTTP server) used instead of the
  # local tesseract subprocess for RDP PII analysis — measured ~10x faster
  # per frame on CPU and ~23x on GPU. The sidecar decides CPU vs GPU on its
  # side; the gateway contract is identical. Leave unset to use tesseract.
  # RDP_OCR_SERVER_URL: 'http://ocr-sidecar:8868'

  ## SPIFFE / JWT-SVID authentication
  ## When HOOP_SPIFFE_MODE=enforce, the gateway validates agent JWT-SVIDs
  ## against the SPIFFE trust bundle. Supply the bundle via exactly one of:
  ##   HOOP_SPIFFE_BUNDLE_JWKS (inline — raw JWKS JSON or base64 of it;
  ##                            autodetected by the gateway on the env side),
  ##   HOOP_SPIFFE_BUNDLE_URL  (HTTPS fetch, refreshed on HOOP_SPIFFE_REFRESH_PERIOD),
  ##   HOOP_SPIFFE_BUNDLE_FILE (path mounted into the container).
  # HOOP_SPIFFE_MODE: 'enforce'
  # HOOP_SPIFFE_TRUST_DOMAIN: 'customer.com'
  # HOOP_SPIFFE_AUDIENCE: 'https://hoop.customer.com'
  # HOOP_SPIFFE_REFRESH_PERIOD: '5m'
  # HOOP_SPIFFE_BUNDLE_URL: ''
  # HOOP_SPIFFE_BUNDLE_JWKS: ''

# -- Load environment variables from a Secret that already exists in the
# namespace (e.g. made by sealed-secrets). The chart only references it, it does
# not create or manage it. The gateway and the default agent load every key of
# the Secret after 'hoop-config', so it overrides the same key defined in
# '.Values.config'.
# When it is set, config.POSTGRES_DB_URI, config.API_URL and
# config.IDP_CLIENT_SECRET are not required: put them in the Secret. The chart
# cannot read the Secret, so it does not check that they are there. A change to
# the Secret does not restart the pods: run
# 'kubectl rollout restart deployment/hoopgateway'.
existingSecret: ''
# existingSecret: hoop-gateway-credentials

mainService:
  # -- Annotations to add in the main service
  annotations: {}
    # beta.cloud.google.com/backend-config: '{"ports": {"http": "hoopgateway-http", "grpc": "hoopgateway-grpc"}}'
    # cloud.google.com/app-protocols: '{"http":"HTTPS", "grpc":"HTTP2"}'
  # -- GCP BackendConfig resource
  httpBackendConfig: {}
    # healthCheckType: HTTPS
    # timeoutSec: 30
  # -- GCP BackendConfig resource
  grpcBackendConfig: {}
    # healthCheckType: HTTPS
    # timeoutSec: 259200

ingressApi:
  # -- Enables Ingress
  enabled: false
  ingressClassName: ''
  # -- Ingress annotations (values are templated)
  annotations:
    # kubernetes.io/tls-acme: "true"

  # -- Ingress hostname for API
  # host: hoop.yourdomain.tld
  # -- TLS configuration
  # tls:
  # - hosts:
  #   - api01.domain.tld
  #   - api02.domain.tld


ingressGrpc:
  # -- Enables Ingress
  enabled: false
  ingressClassName: ''
  # -- Ingress annotations (values are templated)
  annotations:
    # kubernetes.io/tls-acme: "true"

  # -- Ingress hostname for gRPC
  # host: hoop.yourdomain.tld
  # -- TLS configuration
  # tls:
  # - hosts:
  #   - grpc01.domain.tld
  #   - grpc02.domain.tld

# -- Gateway API resources (gateway.networking.k8s.io/v1)
# Requires the Gateway API CRDs to be installed in your cluster.
# For Istio: install with `istioctl install` or the Istio Helm chart.
# For other implementations: https://gateway-api.sigs.k8s.io/guides/
gatewayApi:
  # -- Enable Gateway API resources (HTTPRoute + optional Gateway)
  enabled: false

  # -- Create a Gateway resource.
  # Set to false to attach the HTTPRoute to a pre-existing Gateway.
  createGateway: true

  # -- Gateway resource configuration
  gateway:
    # -- Gateway resource name (also used as the default parentRef for the HTTPRoute)
    name: hoopgateway
    # -- Annotations to add to the Gateway
    annotations: {}
    # -- GatewayClass name (e.g. istio, nginx, cilium)
    gatewayClassName: istio
    # -- Listeners define the addresses and ports for incoming traffic.
    # Refer to: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.Listener
    listeners:
    - name: http
      # -- Restrict the listener to a specific hostname; leave commented to accept all hosts
      # hostname: hoop.yourdomain.org
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same

    # -- Requested addresses for the Gateway (optional).
    # Refer to: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.GatewayAddress
    # addresses:
    # - type: IPAddress
    #   value: 1.2.3.4
    # - type: Hostname
    #   value: hoop.yourdomain.org

    # -- Infrastructure-level parameters passed to the underlying Gateway implementation (optional).
    # Refer to: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.GatewayInfrastructure
    # infrastructure:
    #   labels:
    #     environment: production
    #   annotations:
    #     networking.example.com/service-type: Internal
    #   parametersRef:
    #     group: example.com
    #     kind: Config
    #     name: my-config

    # -- Backend TLS configuration applied to all backends via this Gateway (optional).
    # Refer to: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.GatewayBackendTLS
    # backendTLS:
    #   clientCertificateRef:
    #     name: my-client-cert

  # -- HTTPRoute resource configuration
  httpRoute:
    # -- HTTPRoute resource name
    name: hoopgateway-route
    # -- Annotations to add to the HTTPRoute
    annotations: {}
    # -- Hostnames the route applies to; should match listener hostname(s) above
    # hostnames:
    # - hoop.yourdomain.org

    # -- HTTPRoute rules. Specify the full list of match/backendRef/filter rules.
    # Refer to: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.HTTPRouteRule
    # rules:
    # - matches:
    #   - path:
    #       type: PathPrefix
    #       value: /protobuf.Transport
    #   backendRefs:
    #   - name: hoopgateway
    #     port: 8010
    # - matches:
    #   - path:
    #       type: PathPrefix
    #       value: /
    #   backendRefs:
    #   - name: hoopgateway
    #     port: 8009

    # -- Parent references for this HTTPRoute (optional).
    # Refer to: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.ParentReference
    # parentRefs:
    # - name: hoopgateway
    # - name: hoopgateway
    #   namespace: infra
    #   sectionName: http

# -- Gateway API resources for gRPC (gateway.networking.k8s.io/v1)
# Requires the Gateway API CRDs to be installed in your cluster.
# For Istio: install with `istioctl install` or the Istio Helm chart.
# For other implementations: https://gateway-api.sigs.k8s.io/guides/
gatewayApiGrpc:
  # -- Enable Gateway API resources for gRPC (GRPCRoute + optional Gateway)
  enabled: false

  # -- Create a Gateway resource.
  # Set to false to attach the GRPCRoute to a pre-existing Gateway.
  createGateway: true

  # -- Gateway resource configuration
  gateway:
    # -- Gateway resource name (also used as the default parentRef for the GRPCRoute)
    name: hoopgateway-grpc
    # -- Annotations to add to the Gateway
    annotations: {}
    # -- GatewayClass name (e.g. istio, nginx, cilium)
    gatewayClassName: istio
    # -- Listeners define the addresses and ports for incoming gRPC traffic.
    # Refer to: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.Listener
    listeners:
    - name: grpc
      # hostname: grpc.yourdomain.org
      port: 8443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Same

    # -- Requested addresses for the Gateway (optional).
    # Refer to: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.GatewayAddress
    # addresses:
    # - type: IPAddress
    #   value: 1.2.3.4
    # - type: Hostname
    #   value: grpc.yourdomain.org

    # -- Infrastructure-level parameters passed to the underlying Gateway implementation (optional).
    # Refer to: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.GatewayInfrastructure
    # infrastructure:
    #   labels:
    #     environment: production
    #   annotations:
    #     networking.example.com/service-type: Internal
    #   parametersRef:
    #     group: example.com
    #     kind: Config
    #     name: my-config

    # -- Backend TLS configuration applied to all backends via this Gateway (optional).
    # Refer to: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.GatewayBackendTLS
    # backendTLS:
    #   clientCertificateRef:
    #     name: my-client-cert

  # -- GRPCRoute resource configuration
  grpcRoute:
    # -- GRPCRoute resource name
    name: hoopgateway-grpc-route
    # -- Annotations to add to the GRPCRoute
    annotations: {}
    # -- Hostnames the route applies to; should match listener hostname(s) above
    # hostnames:
    # - grpc.yourdomain.org

    # -- GRPCRoute rules. Specify the full list of match/backendRef/filter rules.
    # Refer to: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.GRPCRouteRule
    # rules:
    # - backendRefs:
    #   - name: hoopgateway
    #     port: 8010

    # -- Parent references for this GRPCRoute (optional).
    # Refer to: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.ParentReference
    # parentRefs:
    # - name: hoopgateway-grpc
    # - name: hoopgateway-grpc
    #   namespace: infra
    #   sectionName: grpc

