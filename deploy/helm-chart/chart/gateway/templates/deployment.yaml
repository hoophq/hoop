{{- $idpToken := (.Values.idpFederatedToken | default dict).enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hoopgateway
  {{- if .Values.deploymentAnnotations }}
  annotations:
  {{- with .Values.deploymentAnnotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app: hoopgateway
  {{- with .Values.deploymentStrategy }}
  strategy: {{- toYaml . | trim | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret-configs.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: hoopgateway
      {{- with omit .Values.podLabels "app" }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if or .Values.serviceAccount.create $idpToken }}
      serviceAccountName: hoopgateway
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - image: '{{ .Values.image.gw.repository | default "hoophq/hoop" }}:{{ .Values.image.gw.tag | default "latest" }}'
        name: hoopgateway
        imagePullPolicy: {{ .Values.image.gw.pullPolicy | default "Always" }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        args:
        - hoop
        - start
        - gateway
        envFrom:
        - secretRef:
            name: hoop-config
        {{- with .Values.existingSecret }}
        - secretRef:
            name: {{ . }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources.gw | nindent 10 }}
        {{- if or .Values.persistence.enabled $idpToken }}
        volumeMounts:
        {{- if .Values.persistence.enabled }}
        - mountPath: /opt/hoop/sessions
          name: walsessions
        {{- end }}
        {{- if $idpToken }}
        - mountPath: {{ include "hoopgateway.idpTokenDir" . }}
          name: idp-federated-token
          readOnly: true
        {{- end }}
        {{- end }}
        ports:
        - containerPort: 8010
          name: grpc
        - containerPort: 8009
          name: api
        - containerPort: 13389
          name: rdp
        - containerPort: 12222
          name: ssh
      {{- if .Values.defaultAgent.enabled }}
      - image: '{{ .Values.defaultAgent.imageRepository | default "hoophq/hoopdev" }}:{{ .Values.defaultAgent.imageTag | default "latest" }}'
        name: defaultagent
        args:
        - hoop-default-agent.sh
        imagePullPolicy: {{ .Values.defaultAgent.imagePullPolicy | default "Always" }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if $.Values.persistence.enabled }}
        volumeMounts:
        - mountPath: /opt/hoop/sessions
          name: walsessions
        {{- end }}
        envFrom:
        - secretRef:
            name: hoop-config
        {{- with .Values.existingSecret }}
        - secretRef:
            name: {{ . }}
        {{- end }}
      {{ end -}}
      {{- if or .Values.persistence.enabled $idpToken }}
      volumes:
      {{- if .Values.persistence.enabled }}
      - name: walsessions
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.existingClaim | default "walsessions" }}
      {{- end }}
      {{- if $idpToken }}
      - name: idp-federated-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: {{ .Values.idpFederatedToken.audience | default "api://AzureADTokenExchange" | quote }}
              expirationSeconds: {{ .Values.idpFederatedToken.expirationSeconds | default 3600 }}
      {{- end }}
      {{ end -}}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
