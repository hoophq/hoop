apiVersion: apps/v1
kind: Deployment
metadata:
  name: hoopgateway
  {{- if .Values.deploymentAnnotations }}
  annotations:
  {{- with .Values.deploymentAnnotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app: hoopgateway
  {{- with .Values.deploymentStrategy }}
  strategy: {{- toYaml . | trim | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret-configs.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: hoopgateway
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: hoopgateway
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - image: '{{ .Values.image.gw.repository | default "hoophq/hoop" }}:{{ .Values.image.gw.tag | default "latest" }}'
        name: hoopgateway
        imagePullPolicy: {{ .Values.image.gw.pullPolicy | default "Always" }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        args:
        - hoop
        - start
        - gateway
        envFrom:
        - secretRef:
            name: hoop-config
        {{- with .Values.existingSecret }}
        - secretRef:
            name: {{ . }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources.gw | nindent 10 }}
        {{- if .Values.persistence.enabled }}
        volumeMounts:
        - mountPath: /opt/hoop/sessions
          name: walsessions
        {{- end }}
        ports:
        - containerPort: 8010
          name: grpc
        - containerPort: 8009
          name: api
        - containerPort: 13389
          name: rdp
        - containerPort: 12222
          name: ssh
      {{- if .Values.defaultAgent.enabled }}
      {{- $agentRepo := .Values.defaultAgent.imageRepository | default "hoophq/hoopdev" }}
      {{- $agentTag := .Values.defaultAgent.imageTag | default "latest" }}
      {{- /*
        DEP-91: this sidecar runs hoop-default-agent.sh, which needs a shell and
        psql. The slim hoophq/hoopagent flavours ship the hoop binary alone, so
        pointing defaultAgent at one produces a container that crash-loops at
        startup with no obvious cause. Fail the render instead, and say what to
        use: a standalone agent Deployment (the hoopagent chart) is the right
        place for a slim image.

        Deliberately narrow. It matches only the official Docker Hub spellings
        of that one repository, never a suffix: a private registry is free to
        host a perfectly capable image at <registry>/hoophq/hoopagent, and
        refusing to render someone's working sidecar is worse than the failure
        this prevents. Mirrors of the real slim image are not caught, and that
        is the intended trade.

        The tag is read with any "@sha256:..." pin removed, so a digest-pinned
        slim flavour is still recognised.
      */}}
      {{- $slimRepo := has $agentRepo (list "hoophq/hoopagent" "docker.io/hoophq/hoopagent" "index.docker.io/hoophq/hoopagent" "registry-1.docker.io/hoophq/hoopagent") }}
      {{- $bareTag := (splitList "@" $agentTag) | first }}
      {{- if and $slimRepo (or (hasSuffix "-minimal" $bareTag) (hasSuffix "-distroless" $bareTag)) }}
      {{- fail (printf "defaultAgent image %s:%s is a slim hoopagent flavour, which cannot run the default-agent sidecar: it has no shell or psql. Use a hoophq/hoopdev tag here, or deploy the slim image as a standalone agent with the hoopagent chart." $agentRepo $agentTag) }}
      {{- end }}
      - image: '{{ $agentRepo }}:{{ $agentTag }}'
        name: defaultagent
        args:
        - hoop-default-agent.sh
        imagePullPolicy: {{ .Values.defaultAgent.imagePullPolicy | default "Always" }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if $.Values.persistence.enabled }}
        volumeMounts:
        - mountPath: /opt/hoop/sessions
          name: walsessions
        {{- end }}
        envFrom:
        - secretRef:
            name: hoop-config
      {{ end -}}
      {{- if .Values.persistence.enabled }}
      volumes:
      - name: walsessions
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.existingClaim | default "walsessions" }}
      {{ end -}}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
