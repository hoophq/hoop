apiVersion: v1
kind: Secret
metadata:
  name: hoop-config
type: Opaque
stringData:
  ORG_MULTI_TENANT: '{{ .Values.config.ORG_MULTI_TENANT | default "false" }}'
  MIGRATION_PATH_FILES: '{{ .Values.config.MIGRATION_PATH_FILES | default "" }}'
  STATIC_UI_PATH: '{{ .Values.config.STATIC_UI_PATH | default "/app/ui/public" }}'
  POSTGRES_DB_URI: '{{ include "hoopgateway.required" (list . "config.POSTGRES_DB_URI is required, or set existingSecret" .Values.config.POSTGRES_DB_URI) }}'
  {{- /* Not `default`: it reads an explicit 0 as unset. 0 reaches the gateway, which refuses to start on it. */}}
  POSTGRES_MAX_OPEN_CONNS: '{{ if kindIs "invalid" .Values.config.POSTGRES_MAX_OPEN_CONNS }}50{{ else }}{{ .Values.config.POSTGRES_MAX_OPEN_CONNS }}{{ end }}'
  API_URL: '{{ include "hoopgateway.required" (list . "config.API_URL is required, or set existingSecret" .Values.config.API_URL) }}'
  GRPC_URL: '{{ .Values.config.GRPC_URL | default "" }}'
  DEFAULT_AGENT_GRPC_SCHEME: '{{ .Values.defaultAgent.grpcScheme | default "grpc" }}'
  DEFAULT_AGENT_GRPC_HOST: '{{ .Values.defaultAgent.grpcHost | default "" }}'
  DEFAULT_AGENT_GRPC_SKIP_VERIFY: '{{ .Values.defaultAgent.grpcSkipVerify | default "false" }}'
  DEFAULT_AGENT_GRPC_TLS_CA: '{{ .Values.defaultAgent.grpcTlsCa | default "" }}'
  PGREST_ROLE: '{{ .Values.config.PGREST_ROLE }}'
  GIN_MODE: '{{ .Values.config.GIN_MODE | default "release" }}'
  LOG_ENCODING: '{{ .Values.config.LOG_ENCODING | default "json" }}'
  LOG_LEVEL: '{{ .Values.config.LOG_LEVEL | default "info" }}'
  LOG_GRPC: '{{ .Values.config.LOG_GRPC | default "0" }}'
  GODEBUG: 'http2debug={{ .Values.config.LOG_GRPC | default 0 }}'
  AUTH_METHOD: '{{ .Values.config.AUTH_METHOD }}'
  API_KEY: '{{ .Values.config.API_KEY }}'
  IDP_URI: '{{ .Values.config.IDP_URI }}'
  {{- $idpAssertionFile := include "hoopgateway.idpClientAssertionFile" . }}
  {{- if $idpAssertionFile }}
  {{- $idpURISecret := and .Values.config.IDP_URI (contains ":" (urlParse .Values.config.IDP_URI).userinfo) }}
  {{- if or .Values.config.IDP_CLIENT_SECRET $idpURISecret }}
  {{- fail "set a client secret (config.IDP_CLIENT_SECRET, config.IDP_URI) or a client assertion (idpFederatedToken.enabled, config.IDP_CLIENT_ASSERTION_FILE), not both" }}
  {{- end }}
  {{- end }}
  IDP_CLIENT_ASSERTION_FILE: '{{ $idpAssertionFile }}'
  {{- if .Values.config.IDP_ISSUER }}
  IDP_ISSUER: '{{ .Values.config.IDP_ISSUER }}'
  IDP_CLIENT_ID: '{{ required "config.IDP_CLIENT_ID is required" .Values.config.IDP_CLIENT_ID }}'
  {{- if $idpAssertionFile }}
  IDP_CLIENT_SECRET: ''
  {{- else }}
  IDP_CLIENT_SECRET: '{{ include "hoopgateway.required" (list . "config.IDP_CLIENT_SECRET is required, or set idpFederatedToken.enabled or existingSecret" .Values.config.IDP_CLIENT_SECRET) }}'
  {{- end }}
  IDP_CUSTOM_SCOPES: '{{ .Values.config.IDP_CUSTOM_SCOPES }}'
  IDP_GROUPS_CLAIM: '{{ .Values.config.IDP_GROUPS_CLAIM }}'
  {{- end }}
  IDP_AUDIENCE: '{{ .Values.config.IDP_AUDIENCE }}'
  HOOP_SPIFFE_MODE: '{{ .Values.config.HOOP_SPIFFE_MODE | default "disabled" }}'
  HOOP_SPIFFE_TRUST_DOMAIN: '{{ .Values.config.HOOP_SPIFFE_TRUST_DOMAIN }}'
  HOOP_SPIFFE_BUNDLE_URL: '{{ .Values.config.HOOP_SPIFFE_BUNDLE_URL }}'
  {{- with .Values.config.HOOP_SPIFFE_BUNDLE_JWKS }}
  HOOP_SPIFFE_BUNDLE_JWKS: {{ . | quote }}
  {{- end }}
  HOOP_SPIFFE_AUDIENCE: '{{ .Values.config.HOOP_SPIFFE_AUDIENCE }}'
  HOOP_SPIFFE_REFRESH_PERIOD: '{{ .Values.config.HOOP_SPIFFE_REFRESH_PERIOD | default "5m" }}'
  TLS_KEY: '{{ .Values.config.TLS_KEY }}'
  TLS_CERT: '{{ .Values.config.TLS_CERT }}'
  TLS_CA: '{{ .Values.config.TLS_CA }}'
  LICENSE_SIGNING_KEY: '{{ .Values.config.LICENSE_SIGNING_KEY }}'
  HOOP_LICENSE: {{ .Values.config.HOOP_LICENSE | default "" | quote }}
  AGENTCONTROLLER_CREDENTIALS: '{{ .Values.config.AGENTCONTROLLER_CREDENTIALS }}'
  ASK_AI_CREDENTIALS: '{{ .Values.config.ASK_AI_CREDENTIALS }}'
  {{- if .Values.dataMasking.enabled }}
  DLP_PROVIDER: 'mspresidio'
  DLP_MODE: '{{ .Values.dataMasking.mode }}'
  MSPRESIDIO_ANALYZER_URL: 'http://presidio-envoy-lb:3010'
  MSPRESIDIO_ANONYMIZER_URL: 'http://presidio-envoy-lb:3010'
  {{ else }}
  DLP_PROVIDER: '{{ .Values.config.DLP_PROVIDER | default "gcp" }}'
  DLP_MODE: '{{ .Values.config.DLP_MODE }}'
  GOOGLE_APPLICATION_CREDENTIALS_JSON: '{{ .Values.config.GOOGLE_APPLICATION_CREDENTIALS_JSON }}'
  MSPRESIDIO_ANALYZER_URL: '{{ .Values.config.MSPRESIDIO_ANALYZER_URL }}'
  MSPRESIDIO_ANONYMIZER_URL: '{{ .Values.config.MSPRESIDIO_ANONYMIZER_URL }}'
  {{- end }}
  # Async RDP session-replay PII analysis (see hoophq/hoop PR #1391).
  # Worker pool runs OCR + Presidio over recorded RDP bitmap frames and stores
  # entity detections so the webapp can highlight PII on top of the replay.
  # Defaults to 0 workers (feature disabled). Requires MSPRESIDIO_ANALYZER_URL
  # to be set and an OCR engine available: RDP_OCR_SERVER_URL (RapidOCR/
  # PaddleOCR sidecar, CPU or GPU decided sidecar-side) or tesseract
  # installed in the gateway image.
  RDP_ANALYSIS_WORKERS: '{{ .Values.config.RDP_ANALYSIS_WORKERS | default "0" }}'
  RDP_PII_SNAPSHOT_INTERVAL: '{{ .Values.config.RDP_PII_SNAPSHOT_INTERVAL | default "0.25" }}'
  RDP_PII_SCORE_THRESHOLD: '{{ .Values.config.RDP_PII_SCORE_THRESHOLD | default "0.9" }}'
  RDP_PII_ENTITY_DENYLIST: '{{ .Values.config.RDP_PII_ENTITY_DENYLIST | default "DATE_TIME,NRP" }}'
  # Action the agent-side realtime PII guard takes on detection:
  # redact (default: blank the PII and keep the session alive), kill (drop and
  # terminate), or redact_and_kill.
  RDP_PII_GUARD_POLICY: '{{ .Values.config.RDP_PII_GUARD_POLICY | default "redact" }}'
  RDP_OCR_SERVER_URL: '{{ .Values.config.RDP_OCR_SERVER_URL }}'
  # Replicas that open a Slack socket per organization, 1 to 9. Slack allows
  # 10 sockets per app. The other replicas post through the Web API only.
  SLACK_SOCKET_SLOTS: '{{ .Values.config.SLACK_SOCKET_SLOTS | default "3" }}'
  WEBHOOK_APPKEY: '{{ .Values.config.WEBHOOK_APPKEY }}'
  WEBHOOK_APPURL: '{{ .Values.config.WEBHOOK_APPURL }}'
  INTEGRATION_AWS_INSTANCE_ROLE_ALLOW: '{{ .Values.config.INTEGRATION_AWS_INSTANCE_ROLE_ALLOW }}'
  ADMIN_USERNAME: '{{ .Values.config.ADMIN_USERNAME | default "admin" }}'
  PLUGIN_AUDIT_PATH: '{{ .Values.config.PLUGIN_AUDIT_PATH | default "/opt/hoop/sessions" }}'
  PLUGIN_INDEX_PATH: '{{ .Values.config.PLUGIN_INDEX_PATH | default "/opt/hoop/sessions/indexes" }}'
  WEBAPP_USERS_MANAGEMENT: '{{ .Values.config.WEBAPP_USERS_MANAGEMENT }}'
  ANALYTICS_TRACKING: '{{ .Values.config.ANALYTICS_TRACKING }}'
  ORG_ID: '{{ .Values.config.ORG_ID }}'
  # OpenTelemetry push of the gateway's own signals. Off while
  # HOOP_OTEL_EXPORTER_OTLP_ENDPOINT is empty. The names carry HOOP_: a
  # platform can inject the standard OTEL_* ones into every pod.
  {{- range $k, $v := .Values.config }}
  {{- if and (hasPrefix "OTEL_" $k) $v }}
  {{- fail (printf "config.%s is not read: the gateway reads config.HOOP_%s" $k $k) }}
  {{- end }}
  {{- end }}
  HOOP_OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.HOOP_OTEL_EXPORTER_OTLP_ENDPOINT | default "" | quote }}
  HOOP_OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.config.HOOP_OTEL_EXPORTER_OTLP_PROTOCOL | default "" | quote }}
  HOOP_OTEL_EXPORTER_OTLP_HEADERS: {{ .Values.config.HOOP_OTEL_EXPORTER_OTLP_HEADERS | default "" | quote }}
  HOOP_OTEL_EXPORTER_OTLP_INSECURE: {{ .Values.config.HOOP_OTEL_EXPORTER_OTLP_INSECURE | default "" | quote }}
  HOOP_OTEL_EXPORTER_OTLP_CERTIFICATE: {{ .Values.config.HOOP_OTEL_EXPORTER_OTLP_CERTIFICATE | default "" | quote }}
  HOOP_OTEL_EXPORTER_OTLP_TIMEOUT: {{ .Values.config.HOOP_OTEL_EXPORTER_OTLP_TIMEOUT | default "" | quote }}
  HOOP_OTEL_METRIC_EXPORT_INTERVAL: {{ .Values.config.HOOP_OTEL_METRIC_EXPORT_INTERVAL | default "" | quote }}
  HOOP_OTEL_TRACES_SAMPLER: {{ .Values.config.HOOP_OTEL_TRACES_SAMPLER | default "" | quote }}
  HOOP_OTEL_TRACES_SAMPLER_ARG: {{ .Values.config.HOOP_OTEL_TRACES_SAMPLER_ARG | default "" | quote }}
  HOOP_OTEL_SERVICE_NAME: {{ .Values.config.HOOP_OTEL_SERVICE_NAME | default "" | quote }}
  HOOP_OTEL_RESOURCE_ATTRIBUTES: {{ .Values.config.HOOP_OTEL_RESOURCE_ATTRIBUTES | default "" | quote }}
