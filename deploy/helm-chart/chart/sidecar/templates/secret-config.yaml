apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hoopsidecar.envSecretName" . }}
  labels:
    {{- include "hoopsidecar.labels" . | nindent 4 }}
type: Opaque
stringData:
  HOOP_SIDECAR_CONFIG: '{{ if include "hoopsidecar.hasConfigFile" . }}{{ include "hoopsidecar.configPath" . }}{{ end }}'
  HOOP_LICENSE: '{{ .Values.license | default "" }}'
  HOOP_CONTROL_PLANE_URL: '{{ .Values.controlPlane.url | default "" }}'
  HOOP_SIDECAR_TOKEN: '{{ .Values.controlPlane.token | default "" }}'
  HOOP_SIDECAR_IDENTITY_TYPE: '{{ .Values.controlPlane.identity | default "" }}'
  HOOP_SIDECAR_IDENTITY_TOKEN_FILE: '{{ if eq .Values.controlPlane.identity "kubernetes" }}{{ include "hoopsidecar.identityTokenPath" . }}{{ end }}'
  HOOP_SIDECAR_IDENTITY_AUDIENCE: {{ ternary .Values.controlPlane.identityAudience "" (eq .Values.controlPlane.identity "gcp") | default "" | quote }}
  HOOP_SIDECAR_ANALYTICS: '{{ if eq (toString .Values.analytics.enabled) "false" }}off{{ end }}'
  HOOP_SIDECAR_ID: '{{ .Values.analytics.sidecarId | default (include "hoopsidecar.fullname" .) }}'
