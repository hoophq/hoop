{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hoopsidecar.fullname" . }}
  labels:
    {{- include "hoopsidecar.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    {{- include "hoopsidecar.selectorLabels" . | nindent 4 }}
  # The admin server only: /healthz, /stats, /config, /events, /api/*.
  # To reach a lane from outside the pod, add a Service of your own with the
  # same selector and the ports your config binds — see the chart README.
  ports:
    - name: admin
      port: 19000
      targetPort: 19000
      protocol: TCP
{{- end }}
