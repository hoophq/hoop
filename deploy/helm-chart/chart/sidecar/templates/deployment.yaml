{{- include "hoopsidecar.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hoopsidecar.fullname" . }}
  labels:
    {{- include "hoopsidecar.labels" . | nindent 4 }}
  {{- if .Values.deploymentAnnotations }}
  annotations:
  {{- with .Values.deploymentAnnotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "hoopsidecar.selectorLabels" . | nindent 6 }}
  {{- with .Values.deploymentStrategy }}
  strategy: {{- toYaml . | trim | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret-config.yaml") . | sha256sum }}
        checksum/sidecar-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/extra-config: {{ include (print $.Template.BasePath "/extra-sidecar-config.yaml") . | sha256sum }}
        {{- with .Values.configRevision }}
        # The checksums above cover only what this chart renders. An
        # existingConfigMap lives outside the release, so editing it changes
        # nothing here. Rule-only edits reach the pods anyway: the relay
        # watches the mounted file. Anything bound at startup (listeners,
        # audit, admin, log_level, top-level analyzer) needs the pod replaced,
        # and this value is the operator's handle for that: change it and the
        # pod template changes, which is what makes the rollout happen.
        hoop.dev/config-revision: {{ . | quote }}
        {{- end }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "hoopsidecar.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with (include "hoopsidecar.serviceAccountName" .) }}
      serviceAccountName: {{ . }}
      {{- end }}
      containers:
      - image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
        name: sidecar
        imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
        envFrom:
        - secretRef:
            name: {{ include "hoopsidecar.envSecretName" . }}
        {{- with .Values.extraSecret }}
        - secretRef:
            name: {{ include "hoopsidecar.extraEnvSecretName" $ }}
        {{- end}}
        {{- with .Values.existingSecret }}
        - secretRef:
            name: {{ . }}
        {{- end }}
        # HOOP_HOST_ID cannot ride in the Secret above: it defaults to the
        # node name, which only the downward API knows, and a Secret has no
        # valueFrom. A literal in values replaces the fieldRef.
        #
        # POD_UID, POD_NAME and POD_NAMESPACE are always set. A lane with
        # `identity: {type: kubernetes}` binds a client's projected token to
        # this pod through POD_UID, and `propagate.application_name` can name
        # the pod. The three cost nothing when unused.
        env:
        - name: HOOP_HOST_ID
          {{- with .Values.analytics.hostId }}
          value: {{ . | quote }}
          {{- else }}
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
          {{- end }}
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # The admin server, and nothing else. Every lane port comes from the
        # config document and differs per deployment, so none is declared
        # here; a containerPort is informational either way, and a lane is
        # reached through whatever fronts this pod — an Envoy sidecar over
        # loopback, or a Service of your own carrying this chart's selector
        # labels — the chart README has one to paste.
        ports:
        - name: admin
          containerPort: 19000
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: 19000
          initialDelaySeconds: {{ .Values.probe.initialDelaySeconds | default 5 }}
          periodSeconds: {{ .Values.probe.periodSeconds | default 10 }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 19000
          initialDelaySeconds: {{ .Values.probe.initialDelaySeconds | default 5 }}
          periodSeconds: {{ .Values.probe.periodSeconds | default 10 }}
        {{- $k8sIdentity := eq .Values.controlPlane.identity "kubernetes" }}
        {{- $spiffe := include "hoopsidecar.mountsSpiffe" . }}
        {{- $krb5 := include "hoopsidecar.mountsKrb5" . }}
        {{- if include "hoopsidecar.hasVolumes" . }}
        volumeMounts:
        {{- if include "hoopsidecar.hasConfigFile" . }}
        - name: sidecar-config-volume
          mountPath: {{ include "hoopsidecar.configDir" . }}
          readOnly: true
        {{- end }}
        {{- if $k8sIdentity }}
        - name: sidecar-identity
          mountPath: {{ include "hoopsidecar.identityTokenDir" . }}
          readOnly: true
        {{- end }}
        {{- if $spiffe }}
        - name: sidecar-spiffe
          mountPath: {{ include "hoopsidecar.spiffeSocketDir" . }}
          readOnly: true
        {{- end }}
        {{- if $krb5 }}
        - name: sidecar-krb5-ccache
          mountPath: {{ .Values.kerberos.ccache.mountPath }}
          readOnly: true
        {{- end }}
        {{- range .Values.credentials.secretMounts }}
        - name: {{ .name }}
          mountPath: {{ .mountPath }}
          readOnly: true
        {{- end }}
        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- if include "hoopsidecar.hasVolumes" . }}
      volumes:
      {{- if include "hoopsidecar.hasConfigFile" . }}
      - name: sidecar-config-volume
        configMap:
          name: {{ include "hoopsidecar.configMapName" . }}
      {{- end }}
      {{- if $k8sIdentity }}
      # The audience is controlPlane.identityAudience, else the control
      # plane URL, so the token is good for the control plane and nothing
      # else. The kubelet rotates it in place.
      - name: sidecar-identity
        projected:
          sources:
          - serviceAccountToken:
              audience: {{ include "hoopsidecar.identityAudience" . | quote }}
              expirationSeconds: {{ include "hoopsidecar.identityTokenExpiration" . }}
              path: token
      {{- end }}
      {{- if $spiffe }}
      # The Workload API socket. The CSI driver projects the agent's socket
      # directory per pod; a hostPath reaches the DaemonSet agent's directory
      # on the node when no driver is installed.
      - name: sidecar-spiffe
        {{- with .Values.spiffe.socketHostPath }}
        hostPath:
          path: {{ . }}
          type: Directory
        {{- else }}
        csi:
          driver: csi.spiffe.io
          readOnly: true
        {{- end }}
      {{- end }}
      {{- if $krb5 }}
      - name: sidecar-krb5-ccache
        {{- with .Values.kerberos.ccache.hostPath }}
        hostPath:
          path: {{ . }}
        {{- else }}
        secret:
          secretName: {{ .Values.kerberos.ccache.secretName }}
          defaultMode: 0400
        {{- end }}
      {{- end }}
      {{- range .Values.credentials.secretMounts }}
      - name: {{ .name }}
        secret:
          secretName: {{ .secretName }}
          defaultMode: {{ .defaultMode | default 0400 }}
      {{- end }}
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
