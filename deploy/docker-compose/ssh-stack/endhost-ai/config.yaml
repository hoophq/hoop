# An end-hop that asks a MODEL about the command before it runs.
#
# The analyzer exists here for a reason a pattern rule cannot cover. A
# regexp over a command line cannot see through the shell's own expansion:
#
#     X=cat; $X /root/.aws/credentials
#
# carries no `.aws/credentials` for a pattern to match, and reaches the
# statement exactly as written. A model reading the whole command can say
# what it intends. That is what this lane buys, and it is the only control
# in the stack that addresses expansion at all.
#
# # What it classifies, and what it does not
#
# On an ssh lane the analyzer answers for `exec_line` and nothing else. A
# variable name (env_set) and a file path (sftp_*) are short structural
# strings with no room for intent; a model asked to rate "/srv/data.csv"
# would return a guess at full price, once per path. Those are already
# better served by a pattern rule scoped with `operations`, and the builder
# skips them — no call, no charge, no invented finding. A trigger that names
# one is refused at load rather than left silently firing at nothing.
#
# # The credential
#
# credentials_file takes a PATH, never the key itself, and the file must not
# be readable by group or other. run.sh writes it from $ANTHROPIC_API_KEY
# into keys/, which is gitignored and wiped by `./run.sh down`, so the key
# never reaches the repository and does not outlive the stack.
#
# This container runs as ROOT, and that is about the key rather than about
# SSH: a 0600 file bind-mounted from the host keeps its host owner, and on
# Linux that uid is not the image's devuser. Root reads it either way, and
# 0600 still satisfies the permission check.

analyzer:
  provider: anthropic
  model: claude-sonnet-5
  credentials_file: /etc/hoop-inspect/keys/anthropic.key

  # redacted: detected entities are replaced before the command leaves the
  # process. raw would send it verbatim; refuse would skip the call rather
  # than send anything at all.
  send: redacted

  # Written out because it is the OPPOSITE default from every other
  # evaluator in the system, and the contrast with endhost-opa is the point:
  # that lane sets fail_open: false, so an unreachable OPA denies. Here an
  # unreachable model ALLOWS.
  #
  # That is deliberate rather than sloppy. A policy engine outage is a
  # security decision nobody made, and denying is the safe reading. A
  # classifier outage is a paid dependency being down, and denying there
  # takes production with it. The observable consequence is worth knowing
  # before you rely on this lane: with a bad credential the provider answers
  # 401, the lane logs it, and the command RUNS. Set false where the
  # classification is a compliance requirement.
  fail_open: true

  # A process-lifetime ceiling on spend. Past it, statements fall through to
  # the local rules — the same outcome as a lane with no analyzer — rather
  # than failing or blocking.
  max_calls: 200

  # Same command shape, same verdict, one call. The key is the command after
  # whitespace normalization and nothing more: `rm -rf /tmp` and `rm -rf /`
  # differ only in their arguments, so arguments cannot be stripped.
  cache:
    size: 512
    ttl_sec: 900

listeners:
  - name: ai-analyzer
    protocol: ssh
    listen: 0.0.0.0:2222

    ssh:
      host_key: /etc/hoop-inspect/keys/endhost_host_key
      trusted_ca: /etc/hoop-inspect/keys/ca.pub

      # exec only. A shell would give the model nothing to read — v1
      # reconstructs no keystrokes — so admitting one here would leave the
      # lane looking analyzed and not be.
      capabilities_allowed: [exec]

      identity:
        subject: key_id
        groups: principals

    analyzer:
      # The trigger is the cost control. Without it every statement on the
      # lane is classified; with it, only the operation that carries an
      # instruction is. On an ssh lane exec_line is also the only operation
      # the builder answers for, so this trigger states what would otherwise
      # be an invisible default -- and naming any other one is refused at
      # load, because the trigger would match, the builder would decline, and
      # the statement would be allowed with nothing to show for it.
      trigger:
        operations: [exec_line]

      high: block
      medium: warn

      # Protocol-specific guidance belongs on the lane, not in the top-level
      # section: that one is process-wide and would reach a database lane
      # reasoning about DROP while it looks at a shell command.
      prompt: |
        You are classifying commands submitted over SSH to a production
        host. Rate as high risk anything that reads credential material,
        disables or tampers with auditing, changes who can log in, or moves
        data off the host. Treat shell indirection as intent: a command that
        assembles a path or a program name from variables should be rated on
        what it would do once expanded.

audit:
  file: /tmp/audit.jsonl

admin:
  listen: 0.0.0.0:9090

log_level: info
