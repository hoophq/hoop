# Envoy-fronted topology, fully local.
#
#   client ──TLS──> envoy ──ext_authz(gRPC)──> opa      (tier 1: fat gate)
#                     │
#                     ▼
#                   hoop-inspect  :18080 http           (tier 2: inspection)
#                                 :15432 postgres
#                     │
#                     ▼
#                   httpbin / appdb                     (upstreams)
#
# Envoy owns TLS, identity and the network path. hoop-inspect is an ordinary
# upstream behind it: it decodes the wire protocol, evaluates policy per
# statement, records an audit trail and masks responses. No UDS, no PROXY
# protocol, no MITM argument with InfoSec -- that is the entire point.
#
# There is no hoop gateway and no hoop agent here. The sidecar is the whole
# tier-2 story.
#
# Bring up:  ./run.sh

name: hoop-envoy-stack

services:
  # The upstream a DBA would actually care about.
  #
  # TLS is ON, so the hop from the sidecar is encrypted. That hop is the one
  # an auditor asks about: Envoy already covers the client's leg, and without
  # this the credentials and rows between hoop-inspect and the database cross
  # the network in the clear.
  #
  # It costs no inspection. hoop-inspect is the TLS CLIENT here, so it
  # decrypts on read and the gate still sees plaintext pgwire. Masking and
  # policy work exactly as they do without it; ./demo.sh proves both.
  appdb:
    image: postgres:17.6
    attach: false
    networks: [inspect]
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
      PGUSER: appuser
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/certs/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/certs/server.key
    volumes:
      - ./upstream/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      # 0600 and owned by the postgres uid, or the server refuses to start.
      - ./upstream/certs/server.crt:/etc/postgresql/certs/server.crt:ro
      - ./upstream/certs/server.key:/etc/postgresql/certs/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "appuser", "-d", "appdb"]
      interval: "2s"
      timeout: "30s"
      retries: 10
      start_period: "20s"

  # Stand-in for one of the ~100 internal HTTP services.
  httpbin:
    image: mccutchen/go-httpbin:latest
    networks: [inspect]

  # Stands in for the sandbox: the only box a developer types on. It reaches
  # nothing directly -- every lane below goes through Envoy.
  client:
    image: alpine:3.20
    networks: [inspect]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - apk add --no-cache postgresql16-client curl >/dev/null
        && exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "command -v psql && command -v curl"]
      interval: "3s"
      timeout: "10s"
      retries: 20
      start_period: "10s"

  # The hoop-inspect sidecar: the hoopinspect library as a process.
  #
  # Envoy forwards to it instead of straight to the upstream. It decodes the
  # wire protocol, evaluates policy, writes an audit trail, and masks
  # sensitive values on the way back. It owns no routing and terminates no
  # downstream TLS — Envoy keeps both. It DOES originate TLS upstream to
  # appdb, which is a different thing: it is the client on that hop, so it
  # decrypts what it reads and inspection is unaffected.
  hoop-inspect:
    image: hoop-inspect:local
    build:
      context: ../../../hoopinspect
      dockerfile: ../deploy/docker-compose/envoy-stack/hoopinspect/Dockerfile
    networks: [inspect]
    volumes:
      # INSPECT_CONFIG selects the lane set. The default file needs no
      # credential and no control plane; ./run.sh --review swaps in
      # config.review.yaml, which adds the analyzer and the approval gate.
      - ./hoopinspect/${INSPECT_CONFIG:-config.yaml}:/etc/hoop-inspect/config.yaml:ro
      # appdb's self-signed cert, used as the CA that verifies it.
      - ./upstream/certs/server.crt:/etc/hoop-inspect/certs/appdb.crt:ro
      # Written by review-bootstrap, empty in the default stack. A named
      # volume rather than a bind mount because the sidecar runs as uid 10001
      # and refuses a credential file anything else can read, which a host
      # bind mount cannot promise on every platform.
      - review-secrets:/etc/hoop-inspect/secrets:ro
      # The model credential, when there is one. Same reason.
      - analyzer-secrets:/etc/hoop-inspect/analyzer:ro
    ports:
      # Admin only: /healthz, /stats, /config and the audit query API. The
      # data-path listeners are reached over the compose network by Envoy,
      # never from the host.
      - "19000:19000"
    depends_on:
      appdb: { condition: service_healthy }
      # httpbin ships no healthcheck; service_started is the strongest
      # condition available and the sidecar dials lazily anyway.
      httpbin: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:19000/healthz || exit 1"]
      interval: "2s"
      timeout: "10s"
      retries: 15
      start_period: "5s"

  opa:
    image: openpolicyagent/opa:latest-envoy
    # opa:*-envoy publishes amd64 only. Harmless under Rosetta/qemu locally;
    # drop this line on an amd64 host.
    platform: linux/amd64
    networks: [inspect]
    volumes:
      - ./opa:/policy:ro
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --diagnostic-addr=0.0.0.0:8282
      - --set=plugins.envoy_ext_authz_grpc.addr=:9191
      - --set=plugins.envoy_ext_authz_grpc.path=envoy/authz/result
      - --set=decision_logs.console=true
      - --log-level=info
      - /policy/authz.rego
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: "3s"
      timeout: "10s"
      retries: 10
      start_period: "10s"

  envoy:
    image: envoyproxy/envoy:v1.33-latest
    networks: [inspect]
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./envoy/certs:/etc/envoy/certs:ro
    ports:
      - "8443:8443"   # HTTPS lane -> hoop-inspect (http codec)
      # 5433 on the host, because a developer laptop usually already has
      # something on 5432.
      - "5433:5432"   # TCP lane   -> hoop-inspect (postgres codec)
      - "9901:9901"   # admin
    command:
      - envoy
      - -c
      - /etc/envoy/envoy.yaml
      - --log-level
      - warn
      - --component-log-level
      - ext_authz:info
    depends_on:
      opa: { condition: service_healthy }
      hoop-inspect: { condition: service_healthy }

  # ------------------------------------------------------- review lane only
  #
  # Everything below carries `profiles: [review]`, so a plain `docker compose
  # up` never starts it and the default stack keeps its defining property: no
  # control-plane database, no API calls, one YAML file.
  #
  # The approval gate is the one feature that cannot work that way. A human
  # has to see the statement and answer it, which needs somewhere for the
  # review to live and someone to log in as.

  gateway-db:
    image: postgres:17.6
    attach: false
    profiles: [review]
    networks: [inspect]
    environment:
      POSTGRES_USER: hoop
      POSTGRES_PASSWORD: hoop
      POSTGRES_DB: hoopgw
      PGUSER: hoop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "hoop", "-d", "hoopgw"]
      interval: "2s"
      timeout: "30s"
      retries: 10
      start_period: "20s"

  # The hoop gateway: the control plane the sidecar files reviews with, and
  # the API a reviewer answers them on.
  #
  # Note what it is NOT doing. No agent connects to it, no session streams
  # through it, and the appdb connection it holds is never opened. The data
  # path is Envoy -> hoop-inspect -> appdb, exactly as in every other lane;
  # the gateway only ever sees three HTTPS calls about a statement.
  hoop-gateway:
    image: hoop-gateway:local
    profiles: [review]
    build:
      context: ./gateway
    networks: [inspect]
    environment:
      - GIN_MODE=release
      - LOG_LEVEL=info
      - POSTGRES_DB_URI=postgres://hoop:hoop@gateway-db:5432/hoopgw?sslmode=disable
      - API_URL=http://hoop-gateway:8009
      - GRPC_URL=grpc://hoop-gateway:8010
      - AUTH_METHOD=local
    command: ["start", "gateway"]
    ports:
      # Published so demo-review.sh (and you) can approve from the host.
      - "8009:8009"
    depends_on:
      gateway-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8009/api/healthz || exit 1"]
      interval: "2s"
      timeout: "30s"
      retries: 30
      start_period: "20s"

  # One-shot: registers the admin, creates the connection and the review rule,
  # mints the sandbox's hpk_ token and writes it where hoop-inspect will read
  # it. Exits 0. ./run.sh runs it between bringing up the gateway and bringing
  # up the sidecar, because the sidecar refuses to start without the token.
  review-bootstrap:
    image: alpine:3.20
    # A profile of its OWN, not [review], so `up --profile review` never
    # starts it. It must run BETWEEN the gateway coming up and the sidecar
    # starting, and `docker compose run` enables a target service's profile
    # automatically, so run.sh drives it explicitly. Left in the review
    # profile it would also race the sidecar on every `up`.
    profiles: [review-bootstrap]
    networks: [inspect]
    volumes:
      - ./gateway/bootstrap.sh:/bootstrap.sh:ro
      # Both secret volumes are declared HERE rather than passed with a `-v`
      # on the command line. `docker compose run -v analyzer-secrets:/x`
      # does not resolve to the project's volume — it creates a bare one of
      # that name — so the file lands somewhere nothing else mounts and the
      # sidecar starts to a missing credential.
      - review-secrets:/secrets
      - analyzer-secrets:/analyzer
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    depends_on:
      hoop-gateway: { condition: service_healthy }

networks:
  inspect:

volumes:
  # Written by review-bootstrap (as uid 10001), read by hoop-inspect.
  review-secrets:
  # Written by ./run.sh --review from ANTHROPIC_API_KEY / OPENAI_API_KEY.
  analyzer-secrets:
