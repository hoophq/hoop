# Overlay: the sidecar terminates the login and presents a credential of
# its own upstream, on the postgres lane and on the GKE lane.
#
#   docker compose -f docker-compose.yml -f gke/docker-compose.gke.yml \
#     -f credentials/docker-compose.credentials.yml up -d --build --wait
#
# Run it from the envoy-stack directory, after `./run.sh --rebuild` has
# minted the parent certs and built the sidecar image from this tree. It
# stacks on the gke overlay: the fake Google and the cluster come from there.
# ./credentials/demo-credentials.sh walks it.
#
#   psql    ──TLS──> envoy :5432 ──TLS──> hoop-inspect :15432 ──TLS──> appdb
#   kubectl ──TLS──> envoy :443  ──h2c──> hoop-inspect :16443 ──TLS──> fake-google ──> k3s
#                                           │ ID token in, pool credential out
#                                           ├──> accounts.google.com  JWKS (fake-google)
#                                           ├──> fake-google:8080  metadata (pod identity)
#                                           └──> iamcredentials.googleapis.com (fake-google)
#
# What it adds:
#
#   creds-seed   fills the hoop-creds volume: two database roles' user and
#                password files, and the keypair the appdb lane terminates
#                TLS with. Modes the relay accepts: 0700 directories, 0400
#                files, owned by its uid
#   appdb        one more initdb script: the read-only role app_ro
#   fake-google  the same binary with its metadata server on :8080, an
#                iamcredentials alias (gke/docker-compose.gke.yml), and as
#                accounts.google.com the issuer of the ID tokens it writes
#                to the gke-tokens volume at startup
#   k3s          a static token for the gateway service account, and RBAC
#                that lets it impersonate and gives alice@example.com admin
#   client       a kubeconfig whose bearers are the ID tokens, not Google
#                access tokens; psql reads the same files
#
# The gke overlay's gke-pki step is skipped when its volume already holds
# certificates. The fake-google certificate gained SANs for
# iamcredentials.googleapis.com and accounts.google.com; a volume minted
# before that needs `down -v` once.

services:
  # The relay runs as uid 10001 and refuses a credential file anyone else can
  # read, and a bind mount from the host keeps the host's owner. So the
  # files are written inside a named volume, owned and locked down here.
  creds-seed:
    image: alpine:3.20
    networks: [inspect]
    volumes:
      - hoop-creds:/creds
    command:
      - /bin/sh
      - -ec
      - |
        [ -s /creds/tls/lane.crt ] && [ -s /creds/appdb-rw/password ] && exit 0
        apk add --no-cache openssl >/dev/null
        rm -rf /creds/appdb-ro /creds/appdb-rw /creds/tls
        mkdir -p /creds/appdb-ro /creds/appdb-rw /creds/tls
        printf 'app_ro'    > /creds/appdb-ro/user
        printf 'ro-secret' > /creds/appdb-ro/password
        printf 'appuser'   > /creds/appdb-rw/user
        printf 'apppass'   > /creds/appdb-rw/password
        # What the appdb lane presents to psql. Envoy passes the TCP stream
        # through, so this is the certificate the client sees.
        openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
          -keyout /creds/tls/lane.key -out /creds/tls/lane.crt -days 30 -subj "/CN=envoy" \
          -addext "subjectAltName=DNS:envoy,DNS:localhost,IP:127.0.0.1" 2>/dev/null
        chown -R 10001:10001 /creds
        chmod 0700 /creds /creds/appdb-ro /creds/appdb-rw /creds/tls
        chmod 0400 /creds/appdb-ro/* /creds/appdb-rw/* /creds/tls/*

  appdb:
    volumes:
      - ./upstream/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      # zz- so it runs AFTER seed.sql: it grants on the tables seed.sql
      # creates.
      - ./credentials/seed-roles.sql:/docker-entrypoint-initdb.d/zz-roles.sql:ro
      - ./upstream/certs/server.crt:/etc/postgresql/certs/server.crt:ro
      - ./upstream/certs/server.key:/etc/postgresql/certs/server.key:ro

  hoop-inspect:
    volumes:
      - ./credentials/config-credentials.yaml:/etc/hoop-inspect/config.yaml:ro
      - ./upstream/certs/server.crt:/etc/hoop-inspect/certs/appdb.crt:ro
      - gke-ca:/etc/hoop-inspect/gke-pki:ro
      - hoop-creds:/run/hoop-creds:ro
    depends_on:
      creds-seed: { condition: service_completed_successfully }
      gke-pki: { condition: service_completed_successfully }
      fake-google: { condition: service_healthy }

  fake-google:
    command: ["-metadata-addr", ":8080", "-tokens-dir", "/tokens"]
    networks:
      inspect:
        aliases: [accounts.google.com]
    volumes:
      - gke-tokens:/tokens

  k3s:
    volumes:
      - k3s-server:/var/lib/rancher/k3s
      - ./credentials/tokens.csv:/etc/k3s/tokens.csv:ro
      - ./kubernetes/manifests/demo.yaml:/var/lib/rancher/k3s/server/manifests/demo.yaml:ro
      - ./credentials/manifests/impersonation.yaml:/var/lib/rancher/k3s/server/manifests/impersonation.yaml:ro

  client:
    volumes:
      - ./credentials/kubeconfig.yaml:/etc/kube/kubeconfig.yaml:ro
      - gke-ca:/etc/gke-pki:ro
      # The ID tokens, what a person holds after SSO: kubectl's tokenFile
      # and psql's password.
      - gke-tokens:/etc/gke-tokens:ro

volumes:
  hoop-creds:
  gke-tokens:
