# hoop-inspect with the login terminated on two lanes and a credential of the
# sidecar's own presented upstream. The client never holds a database
# password or a Google access token; it holds an ID token its identity
# provider issued after SSO, and the sidecar decides which upstream identity
# that maps to.
#
#   psql ──TLS──> envoy :5432 ──TLS──> :15432 lane "appdb" ──TLS──> appdb
#    user=alice@example.com           terminates TLS and the login;   as appuser (rw)
#    password=<id token>              jwt → select → secret_files
#
#   kubectl ──TLS──> envoy :443 (MITM) ──h2c──> :16443 lane "gke" ──TLS──> fake-google ──> k3s
#    token: <id token>                 jwt → gcp_impersonation   Impersonate-User: alice@example.com
#                                       ├──> accounts.google.com/.well-known/openid-configuration, the JWKS
#                                       └──> metadata server (fake-google:8080), then
#                                            iamcredentials.googleapis.com:generateAccessToken
#
# The issuer is accounts.google.com, which fake-google answers as: it signs
# one ID token per demo user at startup (sub, email, groups) and serves the
# JWKS the lanes verify against, through the customer CA in trust.ca_file.
# A real deployment names its identity provider there and adds nothing.
#
# This build enforces at most ONE guardrail and ONE mask rule per process:
# appdb spends the guardrail, gke the mask rule.
#
# Validate without starting anything:
#   cd sidecar/cmd && go run . -validate \
#     -config ../../deploy/docker-compose/envoy-stack/credentials/config-credentials.yaml

log_level: info

admin:
  listen: 0.0.0.0:19000

audit:
  file: "-"
  memory_buffer: 256
  async_queue_size: 1024
  query_sessions: 500

# The customer's MITM CA, ADDED to the system roots. Connect Gateway and
# iamcredentials both present certificates it signed.
trust:
  ca_file: /etc/hoop-inspect/gke-pki/ca.crt

# --------------------------------------------------------------- sources
# Process-wide, restart-bound. A pool entry names one of these.
credentials:
  # The directory the creds-seed service fills: 0700, files 0400, owned by
  # the relay's uid. The relay refuses a file anyone else can read.
  secret_files:
    dir: /run/hoop-creds
  # The pod's Workload Identity comes from the metadata server; the token it
  # mints for the pool entry's service account comes from
  # iamcredentials.googleapis.com. Both are fake-google here. The override
  # is the one the Google client libraries honor (GCE_METADATA_HOST).
  gcp_impersonation:
    metadata_host: fake-google:8080

guardrails:
  mode: enforce
  rules: []

mask:
  rules: []

listeners:
  # ------------------------------------------------------------- postgres
  # Envoy passes the TCP stream through untouched, so the SSLRequest reaches
  # the sidecar and the sidecar terminates the client's TLS. jwt on a TCP
  # postgres lane REQUIRES that: the token travels as a cleartext password
  # on the client leg and may not cross the wire in the clear.
  - name: appdb
    protocol: postgres
    listen: 0.0.0.0:15432
    upstream: appdb:5432
    downstream_tls:
      cert_file: /run/hoop-creds/tls/lane.crt
      key_file: /run/hoop-creds/tls/lane.key
    upstream_tls:
      ca_file: /etc/hoop-inspect/certs/appdb.crt
      server_name: appdb

    # The startup user is the person's email, the password field the ID
    # token. The email claim is the subject, so the trail and
    # application_name name the person, not Google's numeric sub.
    identity:
      type: jwt
      issuer: https://accounts.google.com
      claims: {subject: email}

    # Two database roles, chosen by the client's group. The role name is
    # never typed by the client: alice logs in as alice@example.com and the
    # database sees appuser.
    credentials:
      pool:
        - name: ro
          source: secret_files
          user_file: /run/hoop-creds/appdb-ro/user
          password_file: /run/hoop-creds/appdb-ro/password
        - name: rw
          source: secret_files
          user_file: /run/hoop-creds/appdb-rw/user
          password_file: /run/hoop-creds/appdb-rw/password
      select:
        rules:
          - when: {identity.groups: dba}
            credential: rw
          - when: {identity.groups: developers}
            credential: ro

    # Lane-wide facts the selector and propagation can name.
    context:
      env: demo

    # The database's own log then shows who is behind the shared role:
    # pg_stat_activity.application_name reads "alice@example.com via demo".
    propagate:
      application_name: "{{.Principal}} via {{.Context.env}}"

    guardrails:
      rules:
        - name: no-destructive-sql
          type: operation
          operations: [drop, delete, truncate]
          message: destructive statements are not permitted on appdb

  - name: httpbin
    protocol: http
    listen: 0.0.0.0:18080
    upstream: httpbin:8080

  # ------------------------------------------------------------------ gke
  # kubectl's bearer is the ID token. The sidecar swaps it for an access
  # token of the gateway service account, minted through impersonation
  # with the pod's own identity, and names the real caller to the cluster
  # in Impersonate-User, so RBAC still decides per person.
  - name: gke
    protocol: http
    listen: 0.0.0.0:16443
    upstream: fake-google:443
    upstream_tls:
      server_name: connectgateway.googleapis.com

    identity:
      type: jwt
      issuer: https://accounts.google.com
      claims: {subject: email}

    credentials:
      pool:
        - name: gateway
          source: gcp_impersonation
          service_account: hoop-sidecar@demo-project.iam.gserviceaccount.com
          scopes: [https://www.googleapis.com/auth/cloud-platform]
      select:
        rules:
          - credential: gateway

    propagate:
      impersonate_user: true

    http:
      headers:
        - Accept
        - Kubectl-Command
        - Upgrade
        - Sec-WebSocket-Protocol
        - X-Stream-Protocol-Version

    mask:
      rules:
        - name: k8s-data
          columns: [data]
          entities: [K8S_DATA]
          strategy: redact
