# kubectl's view from the sandbox, as in ../gke/kubeconfig.yaml, except that
# the bearers are ID tokens accounts.google.com (fake-google) issued for
# alice and bob, read from the gke-tokens volume. No Google access token
# and no gke-gcloud-auth-plugin on the laptop.
apiVersion: v1
kind: Config
clusters:
  - name: gke-demo
    cluster:
      server: https://connectgateway.googleapis.com/v1/projects/123456789012/locations/global/gkeMemberships/demo
      certificate-authority: /etc/gke-pki/ca.crt
users:
  - name: alice
    user:
      tokenFile: /etc/gke-tokens/alice
  - name: bob
    user:
      tokenFile: /etc/gke-tokens/bob
contexts:
  - name: alice
    context:
      cluster: gke-demo
      user: alice
  - name: bob
    context:
      cluster: gke-demo
      user: bob
current-context: alice
