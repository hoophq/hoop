# kubectl's view from the sandbox, as in ../gke/kubeconfig.yaml, except that
# the bearers are hoop credentials: keys the control plane minted for alice
# and bob on the "gke" lane (static here, see config-credentials.yaml). No
# Google token and no gke-gcloud-auth-plugin on the laptop.
apiVersion: v1
kind: Config
clusters:
  - name: gke-demo
    cluster:
      server: https://connectgateway.googleapis.com/v1/projects/123456789012/locations/global/gkeMemberships/demo
      certificate-authority: /etc/gke-pki/ca.crt
users:
  - name: alice
    user:
      token: hlc_demo_alice_gke_9d1f3a5c7e9b1d3f5a7c9e1b3d5f7a9c
  - name: bob
    user:
      token: hlc_demo_bob_gke_4c6e8a0b2d4f6a8c0e2b4d6f8a0c2e4b
contexts:
  - name: alice
    context:
      cluster: gke-demo
      user: alice
  - name: bob
    context:
      cluster: gke-demo
      user: bob
current-context: alice
