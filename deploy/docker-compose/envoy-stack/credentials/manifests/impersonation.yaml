# The gateway service account may only impersonate; what the impersonated
# person may do is their own binding. alice@example.com is an admin,
# bob@example.com has no binding and is refused by the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hoop-gateway-impersonator
rules:
  - apiGroups: [""]
    resources: [users, groups, userextras/email]
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hoop-gateway-impersonator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hoop-gateway-impersonator
subjects:
  - kind: Group
    name: hoop-gateway
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alice-example-com-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: User
    name: alice@example.com
    apiGroup: rbac.authorization.k8s.io
