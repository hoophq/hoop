# Base ../envoy/envoy.yaml plus four ClickHouse lanes. Envoy owns TLS on the
# HTTPS lanes, calls OPA for the "fat gate" decision there, and forwards to
# ordinary upstreams. hoop-inspect owns protocol enforcement and masking.
#
#   :8443  HTTPS -> ext_authz(OPA) -> hoop-inspect (http codec)     -> httpbin
#   :5432  TCP   -> hoop-inspect (postgres codec)                   -> appdb
#   :8446  HTTPS -> ext_authz(OPA) -> hoop-inspect (http codec)     -> clickhouse :8123
#   :9000  TCP   -> hoop-inspect (clickhouse native codec)          -> clickhouse :9000
#   :9004  TCP   -> hoop-inspect (mysql codec)                      -> clickhouse :9004
#   :9005  TCP   -> hoop-inspect (postgres codec)                   -> clickhouse :9005
#
# Database lanes have no ext_authz: Envoy cannot extract their statements.
# The sidecar codec is the policy boundary and returns a native error frame on
# denial.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    # ---------------------------------------------------------------- L7 lane
    # HTTPS -> hoop-inspect -> httpbin. Unchanged from the base stack.
    - name: https_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 8443 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: /etc/envoy/certs/server.crt }
                    private_key: { filename: /etc/envoy/certs/server.key }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_https
                codec_type: AUTO
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[envoy] %REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% user=%REQ(X-HOOP-USER)% -> %RESPONSE_CODE% flags=%RESPONSE_FLAGS% upstream=%UPSTREAM_CLUSTER% %DURATION%ms\n"
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: inspect
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: hoop_inspect_http
                            timeout: 60s
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: false
                      with_request_body:
                        max_request_bytes: 8192
                        allow_partial_message: true
                        pack_as_bytes: true
                      grpc_service:
                        envoy_grpc: { cluster_name: opa }
                        timeout: 2s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # ---------------------------------------------------------------- L4 lane
    # Raw TCP passthrough to hoop-inspect's postgres listener for appdb.
    # Unchanged from the base stack.
    - name: postgres_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 5432 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: ingress_pg
                cluster: hoop_inspect_pg
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[envoy] tcp pg bytes_in=%BYTES_RECEIVED% bytes_out=%BYTES_SENT% flags=%RESPONSE_FLAGS% %DURATION%ms\n"

    # ---------------------------------------------------------------- L7 lane
    # HTTPS -> ext_authz(OPA) -> hoop-inspect -> clickhouse :8123.
    #
    # The same shape as :8443 on its own port, so OPA can key the service on
    # the destination port (8446 -> "clickhouse" in ../opa/authz.rego) and
    # the sidecar can give the lane its own http block: capture_body is on
    # here, because the SQL is the POST body, and off on httpbin.
    - name: clickhouse_https_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 8446 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: /etc/envoy/certs/server.crt }
                    private_key: { filename: /etc/envoy/certs/server.key }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_clickhouse_https
                codec_type: AUTO
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[envoy] ch %REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% user=%REQ(X-HOOP-USER)% -> %RESPONSE_CODE% flags=%RESPONSE_FLAGS% upstream=%UPSTREAM_CLUSTER% %DURATION%ms\n"
                route_config:
                  name: clickhouse_route
                  virtual_hosts:
                    - name: inspect
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: hoop_inspect_ch_http
                            # Analytical queries run longer than httpbin.
                            timeout: 300s
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: false
                      with_request_body:
                        max_request_bytes: 8192
                        allow_partial_message: true
                        pack_as_bytes: true
                      grpc_service:
                        envoy_grpc: { cluster_name: opa }
                        timeout: 2s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # ---------------------------------------------------------------- L4 lane
    # Raw native ClickHouse TCP. The sidecar clamps the negotiated revision,
    # classifies Query packets, bounds LZ4 inflation, and rebuilds result
    # blocks for masking.
    - name: clickhouse_native_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 9000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: ingress_clickhouse_native
                cluster: hoop_inspect_ch_native
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[envoy] tcp ch-native bytes_in=%BYTES_RECEIVED% bytes_out=%BYTES_SENT% flags=%RESPONSE_FLAGS% %DURATION%ms\n"

    # ---------------------------------------------------------------- L4 lane
    # Raw TCP passthrough to hoop-inspect's mysql listener for ClickHouse's
    # MySQL emulation. Plaintext on purpose, as in ../mysql: MySQL negotiates
    # TLS in-band after the greeting, which tcp_proxy cannot terminate.
    # Clients connect with --ssl-mode=DISABLED.
    - name: clickhouse_mysql_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 9004 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: ingress_clickhouse_mysql
                cluster: hoop_inspect_ch_mysql
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[envoy] tcp ch-mysql bytes_in=%BYTES_RECEIVED% bytes_out=%BYTES_SENT% flags=%RESPONSE_FLAGS% %DURATION%ms\n"

    # ---------------------------------------------------------------- L4 lane
    # Raw TCP passthrough to hoop-inspect's postgres listener for ClickHouse's
    # PostgreSQL emulation.
    - name: clickhouse_pg_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 9005 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: ingress_clickhouse_pg
                cluster: hoop_inspect_ch_pg
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[envoy] tcp ch-pg bytes_in=%BYTES_RECEIVED% bytes_out=%BYTES_SENT% flags=%RESPONSE_FLAGS% %DURATION%ms\n"

  clusters:
    - name: opa
      type: STRICT_DNS
      connect_timeout: 2s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: opa
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: opa, port_value: 9191 }

    - name: hoop_inspect_http
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: hoop_inspect_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hoop-inspect, port_value: 18080 }

    - name: hoop_inspect_pg
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: hoop_inspect_pg
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hoop-inspect, port_value: 15432 }

    - name: hoop_inspect_ch_http
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: hoop_inspect_ch_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hoop-inspect, port_value: 18123 }

    - name: hoop_inspect_ch_native
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: hoop_inspect_ch_native
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hoop-inspect, port_value: 19006 }

    - name: hoop_inspect_ch_mysql
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: hoop_inspect_ch_mysql
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hoop-inspect, port_value: 19004 }

    - name: hoop_inspect_ch_pg
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: hoop_inspect_ch_pg
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hoop-inspect, port_value: 19005 }
