# hoop-inspect with the human-approval gate on.
#
# This is config.yaml plus two things: an `analyzer:` section (the gate is an
# ai_analysis action, so something has to classify) and a `review:` block
# naming the gateway. The httpbin lane is dropped — one lane keeps the demo
# readable, and the gate has nothing protocol-specific to show on HTTP.
#
# Brought up by:  ./run.sh --review
# Walked through by: ./demo-review.sh
#
# Validate without starting anything:
#   cd hoopinspect/cmd && go run . -validate \
#     -config ../../deploy/docker-compose/envoy-stack/hoopinspect/config.review.yaml
#   (the analyzer credential and the token file have to exist for this to pass)

log_level: info

admin:
  listen: 0.0.0.0:19000

audit:
  file: "-"
  memory_buffer: 256
  async_queue_size: 1024
  query_sessions: 500

pii:
  entities:
    - EMAIL_ADDRESS
    - US_SSN
    - CREDIT_CARD
    - BR_CPF
    - IBAN_CODE

# ------------------------------------------------------------------ analyzer
# Written by ./run.sh --review from ANTHROPIC_API_KEY or OPENAI_API_KEY.
#
# The gate needs this because require_review is an ai_analysis ACTION: the
# analyzer classifies, records the action on its finding, and forwards; the
# evaluator that refuses the statement and files the review runs after it.
#
# NOTE on send: redacted — it does not do what the name says. It appends a
# note naming the entity classes found and transmits the statement unchanged,
# values included (sidecar.redactorFor). Only `send: refuse` actually keeps a
# statement carrying a detected entity from leaving the process.
analyzer:
  provider: anthropic
  model: gemini-3.7-flash
  credentials_file: /app/ui/public/google-api-key
  timeout_sec: 20
  # FALSE, and this is the one setting worth arguing about.
  #
  # true is the default everywhere else, and for good reason: a classifier
  # that denies during a provider outage takes the database down with it. On a
  # review-gated lane it means something different. The gate fires on the
  # analyzer's finding, so a classification that never happened is not a flag
  # — and every statement an operator wrote `require_review` for would run
  # unreviewed, quietly, for as long as the provider is down.
  #
  # A guardrail whose failure mode is "stops guarding" is the thing this
  # config refuses everywhere else. Availability is the wrong side to fail
  # toward when the control is a human approval.
  fail_open: false
  send: redacted
  max_input_bytes: 8192
  # The verdict cache keys on the statement SHAPE, so an ORM repeating one
  # statement thousands of times is classified once. It does NOT feed the
  # approval key, which is exact — see the review block below.
  cache: {size: 4096, ttl_sec: 900}
  max_calls: 200

# -------------------------------------------------------------------- review
# Where a held statement goes, and what reaches the gateway to ask.
#
# One deployment shape: the sidecar talks to the gateway's HTTPS API and
# nothing else. There is no broker to select, so nothing here names one.
review:
  api_url: http://192.168.18.62:8009
  # A PATH, never the material. review-bootstrap writes it as 0600 owned by
  # this process's uid, and the relay refuses a credential file that anyone
  # else can read.
  token_file: /app/ui/public/hoop-api-key
  timeout_sec: 5
  # false, so the demo can show BOTH shapes: an unmarked statement files a
  # review per attempt, a marked one dedupes. Turn it on for a busy lane.
  require_marker: false
  # A refusal is remembered for 5s so an agent polling in a tight loop does
  # not turn one denial into a stream of gateway calls. Refusals only: an
  # APPROVED answer is never cached, because a cached approval is a
  # revocation that cannot be honored.
  poll_cache_ttl_sec: 5

policy:
  enforce: true
  rules:
    - name: no-cpf-in-query
      type: pii
      entities: [BR_CPF]
      message: do not put a taxpayer id in a query; it lands in the database's own logs

mask:
  enabled: true
  rules:
    - {name: emails, entity: EMAIL_ADDRESS, strategy: redact}
    - {name: ssn, entity: US_SSN, strategy: partial, keep_last: 4}
    - {name: cards, entity: CREDIT_CARD, strategy: partial, keep_last: 4}
    - {name: cpf, entity: BR_CPF, strategy: redact}
    - {name: iban, entity: IBAN_CODE, strategy: partial, keep_last: 4}

listeners:
  - name: pghoop
    protocol: postgres
    listen: 0.0.0.0:25432
    upstream: 192.168.18.62:5432
    # REQUIRED on a gated lane, and it is doing real work: an approval is
    # scoped to a connection, so one for pghoop must not authorize the same SQL
    # against payments-db. It has to match a connection the gateway knows and
    # the sandbox's groups can reach; review-bootstrap creates it.
    connection: pghoop
    # upstream_tls:
    #   ca_file: /etc/hoop-inspect/certs/pghoop.crt
    #   server_name: pghoop
    policy:
      rules:
        # Kept AHEAD of the review rule on purpose. A statement a free local
        # rule already refuses never reaches a model and never troubles a
        # person: DROP and TRUNCATE are not "ask a human", they are "no".
        - name: no-destructive-ddl
          type: operation
          operations: [drop, truncate]
          message: destructive DDL is not permitted on pghoop, with or without approval

        # The gate. DELETE and UPDATE are classified, and anything the model
        # rates medium or high is held for a person.
        #
        # `low: warn` rather than `low: allow` so a statement the model waved
        # through still lands in the trail with its level. And note what the
        # trigger does for cost: everything else on this lane — every SELECT
        # an application makes — is never classified and never costs a
        # gateway round trip, because the claim phase narrows to the same set.
        # `unknown` is in the trigger, and on a gated lane it is not
        # optional. DO, CALL and EXECUTE decide their effect at runtime, so
        # the lexer reports `unknown` rather than guessing. Name only
        # [delete, update] and a caller walks straight past the gate:
        #
        #   PREPARE d (int) AS DELETE FROM customers WHERE id = $1;  -- delete, gated
        #   EXECUTE d(2);                                            -- unknown, NOT gated
        #
        # The second statement is what deletes the row. A trigger that cannot
        # see it is a review gate with a hole in it, so "we could not tell"
        # has to route to a human like anything else.
        - name: risky-writes
          type: ai_analysis
          trigger: {operations: [delete, update, unknown]}
          high: require_review
          medium: require_review
          low: warn
          prompt: |
            You are classifying statements against a production customer
            database. Treat any statement that deletes or modifies customer
            rows as at least medium risk. A statement scoped to a single row
            by primary key is medium; anything unscoped, or touching many
            rows, is high.
    mask:
      rules:
        - {name: ssn-column, columns: [ssn], strategy: partial, keep_last: 4}
        - {name: emails, entity: EMAIL_ADDRESS, strategy: redact}
        - {name: cpf, entity: BR_CPF, strategy: redact}
        - {name: iban, entity: IBAN_CODE, strategy: partial, keep_last: 4}
