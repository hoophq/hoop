# hoop-inspect with a third lane: Oracle.
#
#   envoy :8443 --cluster hoop_inspect_http-----> :18080  lane "httpbin"
#   envoy :5432 --cluster hoop_inspect_pg-------> :15432  lane "appdb"
#   envoy :1521 --cluster hoop_inspect_oracle---> :11521  lane "oracledb"
#
# The appdb and httpbin lanes are the LIVE parts of ../sidecar/config.yaml,
# verbatim; the worked commentary and the over-the-limit blocks live there
# and are not repeated. What is new here is the oracledb lane at the bottom.
#
# The oracledb lane adds NO rules. This build enforces one guardrail rule and
# one data masking rule for the whole process, both spent in the defaults
# below, and an Oracle lane inherits them like any other: no-cpf-in-query
# refuses a taxpayer id inside the SQL of a TTC call, and emails rewrites
# the character cells of a result set, for thin (python-oracledb) and thick
# (SQL*Plus / OCI) clients alike.
#
# Validate without starting anything:
#   cd sidecar/cmd && go run . -validate \
#     -config ../../deploy/docker-compose/envoy-stack/oracle/config-oracle.yaml

log_level: info

admin:
  listen: 0.0.0.0:19000

audit:
  file: "-"
  memory_buffer: 256
  async_queue_size: 1024
  query_sessions: 500

pii:
  entities:
    - EMAIL_ADDRESS
    - US_SSN
    - CREDIT_CARD
    - BR_CPF
    - IBAN_CODE

guardrails:
  mode: enforce
  rules:
    - name: no-cpf-in-query
      type: pii
      entities: [BR_CPF]
      message: do not put a taxpayer id in a query; it lands in the database's own logs

mask:
  rules:
    - {name: emails, entities: [EMAIL_ADDRESS], strategy: redact}

listeners:
  - name: appdb
    protocol: postgres
    listen: 0.0.0.0:15432
    upstream: appdb:5432
    upstream_tls:
      ca_file: /etc/hoop-inspect/certs/appdb.crt
      server_name: appdb

  - name: httpbin
    protocol: http
    listen: 0.0.0.0:18080
    upstream: httpbin:8080

  # Plaintext TNS on both legs: the oracle codec inspects plaintext TNS/TTC
  # only. It has no upstream_tls (TCPS), and it refuses a session that
  # negotiates Oracle native encryption or integrity (ANO).
  - name: oracledb
    protocol: oracle
    listen: 0.0.0.0:11521
    upstream: oracledb:1521
