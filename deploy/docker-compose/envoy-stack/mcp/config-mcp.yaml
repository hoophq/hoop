# One mcp lane in front of the test MCP server.
#
#   curl ──> lane 127.0.0.1:18901 ──> test MCP server 127.0.0.1:18900/mcp
#
# caller_token admits only a request with a token from caller-tokens, which
# demo-mcp.sh writes. The mcp_tool rule hides delete_customer and run_query
# from tools/list and refuses a call to either; mcp_gateway caps the session
# at three calls.

log_level: info

admin:
  listen: 127.0.0.1:19000
  api_listen: 127.0.0.1:19002 # /stats /metrics /config /events /api/*; no auth

audit:
  file: "-"
  memory_buffer: 256
  query_sessions: 100

# Metrics, and one trace per tool call, to the collector beside the lane.
telemetry:
  otlp:
    endpoint: 127.0.0.1:4317
    insecure: true
  metrics:
    interval_sec: 5
  traces:
    sample_ratio: 1

guardrails:
  rules:
    - name: no-destructive-tools
      type: mcp_tool
      tools: [delete_customer, run_query]
      message: this tool is not allowed through MCP

listeners:
  - name: test-mcp
    protocol: mcp
    listen: 127.0.0.1:18901
    upstream: http://127.0.0.1:18900/mcp
    caller_token:
      file: /demo/caller-tokens
      name: demo-agent
    mcp_gateway:
      transport: streamable-http
      max_calls_per_session: 3
