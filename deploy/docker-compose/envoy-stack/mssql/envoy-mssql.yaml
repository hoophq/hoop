# Envoy owns TLS, calls OPA for the "fat gate" decision, and forwards to an
# ordinary upstream. hoop-inspect never owns a socket the client can see.
#
# Two lanes:
#   :8443  HTTPS -> ext_authz(OPA) -> hoop-inspect (http codec)     -> httpbin
#   :5432  TCP   -> hoop-inspect (postgres codec)                   -> appdb
#
# The postgres lane has no ext_authz because Envoy has no pgwire parser: there
# is nothing for OPA to authorize on. That gap is the whole reason the sidecar
# exists.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    # ---------------------------------------------------------------- L7 lane
    # HTTPS -> hoop-inspect -> httpbin.
    #
    # ext_authz runs first, so tier 1 is unchanged: OPA answers "may alice
    # reach this service", and hoop-inspect answers "is this specific request
    # permitted, and what comes back".
    - name: https_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 8443 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: /etc/envoy/certs/server.crt }
                    private_key: { filename: /etc/envoy/certs/server.key }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_https
                codec_type: AUTO

                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[envoy] %REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% user=%REQ(X-HOOP-USER)% -> %RESPONSE_CODE% flags=%RESPONSE_FLAGS% upstream=%UPSTREAM_CLUSTER% %DURATION%ms\n"

                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: inspect
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: hoop_inspect_http
                            timeout: 60s

                http_filters:
                  # TIER 1 -- the fat gate. "Does this user reach this service
                  # at all?" OPA answers; hoop-inspect never sees a request
                  # OPA refused.
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      # Fail closed. A dead OPA must not open the gate.
                      failure_mode_allow: false
                      with_request_body:
                        max_request_bytes: 8192
                        allow_partial_message: true
                        pack_as_bytes: true
                      grpc_service:
                        envoy_grpc: { cluster_name: opa }
                        timeout: 2s

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # ---------------------------------------------------------------- L4 lane
    # Raw TCP passthrough to hoop-inspect's postgres listener. Envoy has no
    # pgwire parser, so no ext_authz here -- there is nothing for it to
    # authorize on. This lane exists to make the tier-2 argument concrete:
    # everything interesting about this connection is invisible to Envoy and
    # visible to hoop-inspect.
    - name: postgres_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 5432 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: ingress_pg
                cluster: hoop_inspect_pg
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[envoy] tcp pg bytes_in=%BYTES_RECEIVED% bytes_out=%BYTES_SENT% flags=%RESPONSE_FLAGS% %DURATION%ms\n"

    # -------------------------------------------------------- L4 lane, MSSQL
    # TDS 8.0. Envoy terminates the client's TLS here and hands plaintext TDS
    # to hoop-inspect, which is the ONLY reason the relay can read a statement
    # on this protocol.
    #
    # No ext_authz, for the same reason the postgres lane has none and a
    # stronger one: Envoy ships no TDS filter at any fidelity, so there is not
    # even a table name for OPA to authorize on. Everything interesting about
    # this connection is invisible here and visible one hop down.
    #
    # The certificate is issued for mssql.hoop.test, the name the client
    # dials. That name is an alias for THIS container, while the Kerberos
    # ticket the client carries is for the SQL Server's service key — a
    # service ticket names a service, not a host, so terminating TLS here
    # does not disturb it.
    - name: mssql_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 1433 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: /etc/envoy/mssql-certs/envoy-mssql.crt }
                    private_key: { filename: /etc/envoy/mssql-certs/envoy-mssql.key }
          filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: ingress_mssql
                cluster: hoop_inspect_mssql
                # A Kerberos handshake plus an interactive session idles for
                # long stretches between keystrokes. The default would drop a
                # developer mid-thought.
                idle_timeout: 3600s
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[envoy] tcp mssql bytes_in=%BYTES_RECEIVED% bytes_out=%BYTES_SENT% flags=%RESPONSE_FLAGS% %DURATION%ms\n"

  clusters:
    - name: opa
      type: STRICT_DNS
      connect_timeout: 2s
      # ext_authz speaks gRPC; the cluster must be HTTP/2.
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: opa
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: opa, port_value: 9191 }

    - name: hoop_inspect_http
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: hoop_inspect_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hoop-inspect, port_value: 18080 }

    - name: hoop_inspect_pg
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: hoop_inspect_pg
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hoop-inspect, port_value: 15432 }

    - name: hoop_inspect_mssql
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: hoop_inspect_mssql
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hoop-inspect, port_value: 11433 }
