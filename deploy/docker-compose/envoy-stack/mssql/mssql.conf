# SQL Server settings for the Kerberos lane.
#
# kerberoskeytabfile is how a Linux SQL Server does Windows authentication: it
# decrypts an inbound service ticket with a key from this file.
#
# privilegedadaccount is the account it authenticates AS when it queries the
# directory — the step that turns a decrypted principal into a SID. Kerberos
# proves who the client is; this is what lets SQL Server look that person up.
#
# disablesssd sends those lookups straight to LDAP instead of through SSSD,
# which is not installed in this image.
#
# NOT SET HERE, and worth knowing why: forcestrictencryption. TDS 8.0 is a
# SQL Server 2022 feature on WINDOWS; the Linux build ships no such key
# (`mssql-conf list` offers forceencryption and nothing stricter). So this
# server speaks TDS 7.x and the relay reaches it in plaintext inside the
# compose network. The CLIENT's leg — the one crossing a real network — is
# still TDS 8.0, terminated by Envoy.
# See mssql/README.md, "The upstream hop is plaintext".
[network]
kerberoskeytabfile = /keytabs/mssql.keytab
privilegedadaccount = mssqlsvc
disablesssd = true
enablekdcfromkrb5conf = true
tlscert = /var/opt/mssql/certs/mssql.crt
tlskey = /var/opt/mssql/certs/mssql.key
tlsprotocols = 1.2

[sqlagent]
enabled = false
