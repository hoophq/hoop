# kubectl's view of the cluster from the sandbox: the API server is
# envoy:8447, verified against the certificate ./run.sh minted for Envoy.
# Envoy terminates that TLS, so a client certificate could not reach the
# apiserver; the users below carry the bearer tokens ../tokens.csv declares.
apiVersion: v1
kind: Config
clusters:
  - name: k3s-via-envoy
    cluster:
      server: https://envoy:8447
      certificate-authority: /etc/envoy/certs/server.crt
users:
  - name: alice
    user:
      token: alice-token
  - name: bob
    user:
      token: bob-token
contexts:
  - name: alice
    context:
      cluster: k3s-via-envoy
      user: alice
  - name: bob
    context:
      cluster: k3s-via-envoy
      user: bob
current-context: alice
