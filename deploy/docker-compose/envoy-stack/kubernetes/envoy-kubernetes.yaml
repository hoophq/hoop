# Base ../envoy/envoy.yaml plus a Kubernetes API lane. Envoy owns TLS, calls
# OPA for the "fat gate" decision, and forwards to ordinary upstreams.
# hoop-inspect owns protocol enforcement and masking.
#
#   :8443  HTTPS -> ext_authz(OPA) -> hoop-inspect (http codec)     -> httpbin
#   :5432  TCP   -> hoop-inspect (postgres codec)                   -> appdb
#   :8447  HTTPS -> ext_authz(OPA) -> hoop-inspect (http codec)     -> k3s :6443
#
# The :8447 lane admits WebSocket upgrades, which kubectl exec, attach and
# port-forward need. Without upgrade_configs Envoy answers the Upgrade
# request with a plain 200 and kubectl reports "unable to upgrade".

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    # ---------------------------------------------------------------- L7 lane
    # HTTPS -> hoop-inspect -> httpbin. Unchanged from the base stack.
    - name: https_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 8443 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: /etc/envoy/certs/server.crt }
                    private_key: { filename: /etc/envoy/certs/server.key }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_https
                codec_type: AUTO
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[envoy] %REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% user=%REQ(X-HOOP-USER)% -> %RESPONSE_CODE% flags=%RESPONSE_FLAGS% upstream=%UPSTREAM_CLUSTER% %DURATION%ms\n"
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: inspect
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: hoop_inspect_http
                            timeout: 60s
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: false
                      with_request_body:
                        max_request_bytes: 8192
                        allow_partial_message: true
                        pack_as_bytes: true
                      grpc_service:
                        envoy_grpc: { cluster_name: opa }
                        timeout: 2s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # ---------------------------------------------------------------- L4 lane
    # Raw TCP passthrough to hoop-inspect's postgres listener for appdb.
    # Unchanged from the base stack.
    - name: postgres_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 5432 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: ingress_pg
                cluster: hoop_inspect_pg
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[envoy] tcp pg bytes_in=%BYTES_RECEIVED% bytes_out=%BYTES_SENT% flags=%RESPONSE_FLAGS% %DURATION%ms\n"

    # ---------------------------------------------------------------- L7 lane
    # HTTPS -> ext_authz(OPA) -> hoop-inspect -> kube-apiserver.
    #
    # The same shape as :8443 on its own port, so OPA can key the service on
    # the destination port (8447 -> "kubernetes" in ../opa/authz.rego).
    # kubectl cannot add a header, so on this port OPA reads the identity off
    # the bearer token instead of X-Hoop-User; the access log prints the
    # user OPA resolved.
    #
    # Two things differ from the httpbin lane. upgrade_configs lets an
    # Upgrade: websocket request through as a connection rather than a
    # request, which is what kubectl exec opens. And the route timeout is
    # off: exec and watch streams stay open as long as the user does, and a
    # route timeout would cut them at the mark.
    - name: kubernetes_https_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 8447 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: /etc/envoy/certs/server.crt }
                    private_key: { filename: /etc/envoy/certs/server.key }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_kubernetes_https
                codec_type: AUTO
                upgrade_configs:
                  - upgrade_type: websocket
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[envoy] k8s %REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% user=%REQ(X-HOOP-USER)% upgrade=%REQ(UPGRADE)% -> %RESPONSE_CODE% flags=%RESPONSE_FLAGS% upstream=%UPSTREAM_CLUSTER% %DURATION%ms\n"
                route_config:
                  name: kubernetes_route
                  virtual_hosts:
                    - name: inspect
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: hoop_inspect_k8s
                            timeout: 0s
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: false
                      with_request_body:
                        max_request_bytes: 8192
                        allow_partial_message: true
                        pack_as_bytes: true
                      grpc_service:
                        envoy_grpc: { cluster_name: opa }
                        timeout: 2s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: opa
      type: STRICT_DNS
      connect_timeout: 2s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: opa
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: opa, port_value: 9191 }

    - name: hoop_inspect_http
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: hoop_inspect_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hoop-inspect, port_value: 18080 }

    - name: hoop_inspect_pg
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: hoop_inspect_pg
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hoop-inspect, port_value: 15432 }

    - name: hoop_inspect_k8s
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: hoop_inspect_k8s
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hoop-inspect, port_value: 16443 }
