# Applied by k3s at start from /var/lib/rancher/k3s/server/manifests.
#
# The pod is the target of kubectl exec, the lane's WebSocket beat. The
# ConfigMap carries the same customers fixture as ../../upstream/seed.sql,
# so the process's one mask rule has an email to find in an apiserver
# response.
apiVersion: v1
kind: Pod
metadata:
  name: demo
  namespace: default
spec:
  containers:
    - name: shell
      image: busybox:1.37
      command: ["sleep", "infinity"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: customers
  namespace: default
data:
  ada: "Ada Lovelace,ada@example.com,123-45-6789,111.444.777-35,GB82WEST12345698765432"
  grace: "Grace Hopper,grace@example.com,987-65-4321,529.982.247-25,DE89370400440532013000"
  alan: "Alan Turing,alan@example.com,555-12-3456,390.533.447-05,FR1420041010050500013M02606"
