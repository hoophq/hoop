# One realm, one DC, no DNS discovery for the KDC itself.
#
# dns_lookup_kdc = false matters in compose: with it on the resolver asks for
# _kerberos._udp SRV records and every kinit waits on that round trip before
# falling back to this file. Naming the KDC makes the lookup instant.
#
# (SQL Server still needs DNS to find LDAP, which is why its container points
# its resolver at the DC. That is a different lookup from this one.)
#
# udp_preference_limit = 1 forces TCP. An AD ticket carries a PAC that
# overflows a UDP datagram, and the UDP-then-retry-over-TCP dance shows up as
# a multi-second stall on every login.
[libdefaults]
    default_realm = HOOP.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = false
    udp_preference_limit = 1
    forwardable = true
    rdns = false
    ticket_lifetime = 24h

[realms]
    HOOP.TEST = {
        kdc = dc.hoop.test
        admin_server = dc.hoop.test
        default_domain = hoop.test
    }

# The client asks for MSSQLSvc/<the name it dialled>. That name is
# mssql.hoop.test, which resolves to ENVOY, and the ticket it gets back is
# encrypted with the SQL Server service account's key. That is the whole
# trick: a service ticket names a SERVICE, not a box, so the relay in the
# middle is invisible to Kerberos.
[domain_realm]
    .hoop.test = HOOP.TEST
    hoop.test = HOOP.TEST
