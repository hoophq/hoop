# Scrapes the collector's Prometheus exporter. The sidecar never serves
# Prometheus itself in this stack: it pushes OTLP, and the collector is the
# one place every signal lands. 5s keeps the dashboard close to real time;
# the sidecar exports every 5s too (sidecar/config.yaml).
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
