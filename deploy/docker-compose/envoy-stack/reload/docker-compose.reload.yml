# Overlay: the sidecar reads its config from a directory the demo edits.
#
#   docker compose -f docker-compose.yml -f reload/docker-compose.reload.yml up -d
#
# Run it from the envoy-stack directory, after ./run.sh has minted the certs
# and built the image at least once. reload/run.sh does both lines.
#
# What changes: one mount and the -config path. The base stack binds
# sidecar/config.yaml as a single file, and Docker binds a file by inode, so
# an editor that writes a new file and renames it over the old one (sed -i,
# most editors) leaves the container reading the old inode forever. This
# overlay binds the directory reload/work/ instead, which the demo fills with
# a copy of the base config and then edits; the sidecar's
# stat-every-ten-seconds watcher (or a SIGHUP) sees every edit. A Kubernetes
# ConfigMap volume is a directory too, which is why it works there without
# this note.
#
# The data-path ports the demo adds are reached over the compose network
# from the client container, like appdb-opa's :15433, so nothing is
# published and nothing in Envoy changes.

services:
  hoop-inspect:
    command: ["-config", "/etc/hoop-inspect/live/config.yaml"]
    volumes:
      - ./reload/work:/etc/hoop-inspect/live:ro
