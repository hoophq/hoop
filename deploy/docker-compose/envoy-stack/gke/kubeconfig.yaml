# kubectl's view from the sandbox: the real Connect Gateway URL shape, the
# one `gcloud container fleet memberships get-credentials` writes. Compose
# resolves the hostname to the intercepting Envoy, and the customer CA (the
# corporate cabundle) is what verifies it.
#
# The tokens stand in for what gke-gcloud-auth-plugin prints: opaque Google
# access tokens that only tokeninfo can name.
apiVersion: v1
kind: Config
clusters:
  - name: gke-demo
    cluster:
      server: https://connectgateway.googleapis.com/v1/projects/123456789012/locations/global/gkeMemberships/demo
      certificate-authority: /etc/gke-pki/ca.crt
users:
  - name: alice
    user:
      token: tok-alice
  - name: bob
    user:
      token: tok-bob
contexts:
  - name: alice
    context:
      cluster: gke-demo
      user: alice
  - name: bob
    context:
      cluster: gke-demo
      user: bob
current-context: alice
