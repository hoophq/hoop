# pg_hba for the Kerberos lane. Order matters: Postgres takes the FIRST rule
# whose connection type, database, user and address all match, and never falls
# through to a later one after an auth failure.
#
# So appuser keeps its password auth (the existing demo, the check scripts and
# the masking walkthrough all use it) and everyone else authenticates with a
# Kerberos ticket.
local   all   all                trust
host    all   all   127.0.0.1/32 trust
host    all   all   ::1/128      trust

# The password path the rest of the stack already depends on.
host    all   appuser  all   scram-sha-256

# Everything else: GSSAPI.
#
# include_realm=1 keeps the realm on the name, so the Postgres role is
# "alice@HOOP.TEST" rather than a bare "alice". Dropping the realm invites a
# second realm's alice to log in as the first one, which is why Postgres has
# defaulted this to 1 since version 12.
#
# krb_realm pins the realm this rule accepts, so a ticket from a trusted-but-
# different realm cannot satisfy it.
host    all   all      all   gss include_realm=1 krb_realm=HOOP.TEST
