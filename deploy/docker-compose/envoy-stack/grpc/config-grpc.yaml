# hoop-inspect with a third lane: gRPC.
#
#   envoy :8443 --cluster hoop_inspect_http--> :18080  lane "httpbin"
#   envoy :5432 --cluster hoop_inspect_pg----> :15432  lane "appdb"
#   envoy :8444 --cluster hoop_inspect_grpc--> :18443  lane "ledger"
#   host  :18443 --------------h2c-----------> :18443  the same lane, no Envoy
#
# The appdb and httpbin lanes are the LIVE parts of ../sidecar/config.yaml,
# verbatim; the worked commentary and the over-the-limit blocks live there
# and are not repeated. What is new here is the ledger lane at the bottom.
#
# The ledger lane adds NO rules. This build enforces one guardrail rule and
# one data masking rule for the whole process, both spent in the defaults
# below, and a gRPC lane inherits them like any other: no-cpf-in-query
# refuses a taxpayer id inside a request message, and emails rewrites the
# customer_email field of a response. Same budget, third protocol.
#
# Validate without starting anything:
#   cd sidecar/cmd && go run . -validate \
#     -config ../../deploy/docker-compose/envoy-stack/grpc/config-grpc.yaml
# with one caveat this file adds: -validate OPENS the descriptor set (a
# missing or malformed one must fail before the listener binds), and
# grpc.descriptors below is a container path. On the host, point it at a
# locally compiled ledger.pb first, or read the verdict off the container:
# the sidecar refuses to start on exactly the same check.

log_level: info

admin:
  listen: 0.0.0.0:19000

audit:
  file: "-"
  memory_buffer: 256
  async_queue_size: 1024
  query_sessions: 500

pii:
  entities:
    - EMAIL_ADDRESS
    - US_SSN
    - CREDIT_CARD
    - BR_CPF
    - IBAN_CODE

guardrails:
  mode: enforce
  rules:
    - name: no-cpf-in-query
      type: pii
      entities: [BR_CPF]
      message: do not put a taxpayer id in a query; it lands in the database's own logs

mask:
  rules:
    - {name: emails, entities: [EMAIL_ADDRESS], strategy: redact}

listeners:
  - name: appdb
    protocol: postgres
    listen: 0.0.0.0:15432
    upstream: appdb:5432
    upstream_tls:
      ca_file: /etc/hoop-inspect/certs/appdb.crt
      server_name: appdb

  - name: httpbin
    protocol: http
    listen: 0.0.0.0:18080
    upstream: httpbin:8080

  # ------------------------------------------------------------- gRPC lane
  # Not a relay lane (ADR-0013): the sidecar terminates HTTP/2 here,
  # decodes each RPC into statements, and re-encodes responses it masked.
  # Two callers reach it, and the difference between them is the demo:
  #
  #   - Envoy's :8444 listener forwards to it over h2c, after TLS and the
  #     OPA fat gate. The client is told to go there.
  #   - The compose file also publishes 18443 on the host, which is the
  #     WITHOUT-Envoy path: `grpcurl -plaintext localhost:18443 ...` hits
  #     this lane directly. Same policy, same masking, same audit trail;
  #     nothing in this lane knows whether Envoy exists.
  #
  # No downstream_tls, so the lane listens for cleartext HTTP/2 (h2c) and
  # plaintext clients must opt in (grpcurl -plaintext; grpc-go
  # insecure.NewCredentials()). For a standalone deployment where this lane
  # owns the client's TLS instead, give it the cert pair:
  #   downstream_tls: {cert_file: ..., key_file: ...}
  - name: ledger
    protocol: grpc
    listen: 0.0.0.0:18443
    upstream: ledger:9000
    # Trusting a header is safe only when nothing but the authenticating
    # proxy can reach the listener. The published host port breaks that on
    # purpose, to make the direct path demonstrable: a direct caller can
    # assert any identity, and ./demo-grpc.sh shows exactly that. Behind
    # Envoy alone this line is the real pattern.
    identity_header: x-hoop-user
    grpc:
      # TWO descriptor sets, each compiled from its own .proto by its own
      # protoc run (see app/Dockerfile) — the multi-team shape: every
      # service's CI ships its own artifact and the lane lists them. The
      # sidecar merges the sets at startup; byte-identical shared imports
      # dedupe, diverged copies of one file refuse to load naming both
      # artifacts. A single-set lane spells this as a plain string.
      #
      # internal.pb is in the same volume and DELIBERATELY absent here:
      # /demo.internal.Maintenance/Purge is the method this lane cannot
      # read, which the demo uses to show lenient-vs-strict below.
      # Mandatory for payload work either way: without a set the lane
      # still enforces method-level rules but cannot capture, mask or
      # PII-scan a message (ADR-0013).
      descriptors:
        - /etc/hoop-inspect/descriptors/ledger.pb
        - /etc/hoop-inspect/descriptors/reports.pb
      # Render decoded request and response messages into per-message
      # statements, so the pii guardrail and the audit trail see field
      # values, not just "POST /demo.v1.Ledger/GetInvoice".
      capture_payload: true
      # strict is OFF here, the default: an RPC these sets do not define
      # (internal.pb's Purge) is forwarded with method-level inspection
      # only, and the lane logs "method not in the descriptor set". Flip
      # it on and the same call is refused before the upstream is dialed,
      # FAILED_PRECONDITION naming the path — the standalone stack runs
      # that way (config-standalone.yaml). Masking lanes refuse either
      # way: a redactor must not forward what it cannot decode.
      # strict: true
    # ---- over the limit: the lane's own guardrails --------------------
    # Both below are ALLOWED as shipped; the process's one rule is spent on
    # no-cpf-in-query above. ./demo-grpc.sh calls ExportAll and prints the
    # answer it got beside the rule that would have refused it.
    #
    # no-bulk-export is the method-identity rule: a gRPC statement carries
    # its un-normalized path as the resource, so http_resource matches RPCs
    # with no new rule type.
    # guardrails:
    #   rules:
    #     - name: no-bulk-export
    #       type: http_resource
    #       resources: ["/demo.v1.Ledger/ExportAll"]
    #       message: bulk export is not permitted through this proxy
    # grpc_status is the outcome rule: response-side, matching the
    # grpc-status trailer. The body has already reached the client when
    # trailers arrive, so a deny here cannot retract data; it replaces the
    # final status, and `action: defer` (with an opa: block) is the usual
    # pairing for recording outcomes instead.
    #     - name: no-permission-probing
    #       type: grpc_status
    #       statuses: [permission_denied]
    #       message: repeated permission denials are reported to security

  # ---- the strict/lenient contrast pair ---------------------------------
  # The ledger lane above cannot demonstrate `strict: false`: it MASKS, and
  # a masking lane refuses what it cannot decode regardless of strict — a
  # redactor that forwards an unreadable payload has leaked the bytes it
  # exists to rewrite. ./demo-grpc.sh proves that carve-out on the ledger
  # lane, then drives the SAME undescribed call into these two lanes,
  # identical except for one flag. `mask: {rules: []}` is the documented
  # opt-out of the inherited mask defaults; without it the carve-out would
  # decide before strict ever could. Reached in-network by the demo's
  # grpcurl; no Envoy listener and no host port on purpose.
  - name: internal-lenient
    protocol: grpc
    listen: 0.0.0.0:18444
    upstream: ledger:9000
    mask: {rules: []}
    grpc:
      descriptors:
        - /etc/hoop-inspect/descriptors/ledger.pb
        - /etc/hoop-inspect/descriptors/reports.pb
      capture_payload: true
      # strict off (default): /demo.internal.Maintenance/Purge is not in
      # the listed sets, so it forwards with method-level inspection only
      # and the lane logs the degradation. The upstream stays the
      # authority on methods the operator never described.

  - name: internal-strict
    protocol: grpc
    listen: 0.0.0.0:18445
    upstream: ledger:9000
    mask: {rules: []}
    grpc:
      descriptors:
        - /etc/hoop-inspect/descriptors/ledger.pb
        - /etc/hoop-inspect/descriptors/reports.pb
      capture_payload: true
      # The one-line difference: the same Purge call is refused BEFORE the
      # upstream is dialed, FAILED_PRECONDITION naming the path, and an
      # undecodable message ends the RPC instead of traveling uninspected.
      strict: true
