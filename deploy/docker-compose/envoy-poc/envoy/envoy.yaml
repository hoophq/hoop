# Envoy fronts hoop the way Citadel fronts everything: it owns TLS, it calls
# OPA for the "fat gate" decision, and it injects the per-user upstream
# credential. hoop is a plain HTTP upstream behind it -- it never owns a
# socket the sandbox can see.
#
# Two lanes:
#   :8443  HTTPS -> ext_authz(OPA) -> hoop httpproxy -> agent -> upstream
#   :5432  TCP   -> hoop postgres proxy  (no OPA: Envoy cannot parse pgwire,
#                   which is exactly the tier-2 gap hoop fills)

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    # ---------------------------------------------------------------- L7 lane
    - name: https_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 8443 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: /etc/envoy/certs/server.crt }
                    private_key: { filename: /etc/envoy/certs/server.key }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_https
                codec_type: AUTO

                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[envoy] %REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% user=%REQ(X-CITADEL-USER)% -> %RESPONSE_CODE% flags=%RESPONSE_FLAGS% upstream=%UPSTREAM_CLUSTER% %DURATION%ms\n"

                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: hoop
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: hoop_httpproxy
                            # LLM / long-poll friendly; hoop's own handler
                            # waits up to 5m for the first response packet.
                            timeout: 300s

                http_filters:
                  # TIER 1 -- the fat gate. "Does this user reach this service
                  # at all?" OPA answers, and on allow it returns the hoop
                  # proxy token for this user as a request header.
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      # Fail closed. A dead OPA must not open the gate.
                      failure_mode_allow: false
                      with_request_body:
                        max_request_bytes: 8192
                        allow_partial_message: true
                        pack_as_bytes: true
                      grpc_service:
                        envoy_grpc: { cluster_name: opa }
                        timeout: 2s

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # ---------------------------------------------------------------- L4 lane
    # Raw TCP passthrough to hoop's postgres proxy. Envoy has no pgwire
    # parser, so no ext_authz here -- there is nothing for it to authorize on.
    # This lane exists to make the tier-2 argument concrete: everything
    # interesting about this connection is invisible to Envoy and visible to
    # hoop.
    - name: postgres_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 5432 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: ingress_pg
                cluster: hoop_pgproxy
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[envoy] tcp pg bytes_in=%BYTES_RECEIVED% bytes_out=%BYTES_SENT% flags=%RESPONSE_FLAGS% %DURATION%ms\n"

    # SSH. Envoy has no SSH filter at all -- not a coarse one, none. The
    # handshake, the channel multiplexing and every keystroke are one opaque
    # TCP stream to it, and OPA is never consulted because there is nothing
    # to consult it about. hoop terminates the SSH protocol, so it sees the
    # exec command, the pty stream, and which human is at the keyboard.
    - name: ssh_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 2222 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: ingress_ssh
                cluster: hoop_sshproxy
                # Interactive sessions idle between keystrokes; the default
                # 1h would cut a long-lived shell.
                idle_timeout: 3600s
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[envoy] tcp ssh bytes_in=%BYTES_RECEIVED% bytes_out=%BYTES_SENT% flags=%RESPONSE_FLAGS% %DURATION%ms\n"

    # ---------------------------------------- hoop-inspect sidecar lanes
    # Same topology as the lanes above, but the upstream is the hoop-inspect
    # sidecar rather than the hoop gateway. Envoy still owns TLS, identity
    # and routing; hoop-inspect owns the payload.

    # HTTPS -> hoop-inspect (http codec) -> httpbin.
    # ext_authz still runs, so tier 1 is unchanged: OPA answers "may alice
    # reach this service", and hoop-inspect answers "is this specific
    # request permitted, and what comes back".
    - name: https_inspect_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 8444 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: /etc/envoy/certs/server.crt }
                    private_key: { filename: /etc/envoy/certs/server.key }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_inspect_https
                codec_type: AUTO
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[envoy] inspect %REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% user=%REQ(X-CITADEL-USER)% -> %RESPONSE_CODE% flags=%RESPONSE_FLAGS%\n"
                route_config:
                  name: inspect_route
                  virtual_hosts:
                    - name: inspect
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: hoop_inspect_http
                            timeout: 60s
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: false
                      grpc_service:
                        envoy_grpc: { cluster_name: opa }
                        timeout: 2s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # TCP -> hoop-inspect (postgres codec) -> appdb.
    # No ext_authz: Envoy has no pgwire parser, so there is nothing to
    # authorize on. hoop-inspect is the only layer that can read this.
    - name: postgres_inspect_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 5433 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: ingress_inspect_pg
                cluster: hoop_inspect_pg
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[envoy] inspect tcp pg bytes_in=%BYTES_RECEIVED% bytes_out=%BYTES_SENT% flags=%RESPONSE_FLAGS%\n"

  clusters:
    - name: opa
      type: STRICT_DNS
      connect_timeout: 2s
      # ext_authz speaks gRPC; the cluster must be HTTP/2.
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: opa
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: opa, port_value: 9191 }

    - name: hoop_httpproxy
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: hoop_httpproxy
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: gateway, port_value: 18888 }

    - name: hoop_pgproxy
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: hoop_pgproxy
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: gateway, port_value: 15432 }

    - name: hoop_sshproxy
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: hoop_sshproxy
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: gateway, port_value: 12222 }

    - name: hoop_inspect_http
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: hoop_inspect_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hoop-inspect, port_value: 18080 }

    - name: hoop_inspect_pg
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: hoop_inspect_pg
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hoop-inspect, port_value: 15432 }
