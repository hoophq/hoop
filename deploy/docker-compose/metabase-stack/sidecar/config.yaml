# hoop-inspect in front of the database Metabase reports on.
#
#   metabase --pgwire--> :15432 lane "metabase" --pgwire+TLS--> appdb:5432
#
# One lane, because there is one thing to protect. Metabase's own application
# database is H2 in its container and must not come here: a read-only rule
# would brick the product on its first write.
#
# Validate without starting anything:
#   cd sidecar/cmd && go run . -validate \
#     -config ../../deploy/docker-compose/metabase-stack/sidecar/config.yaml
#
# This build enforces ONE guardrail rule and ONE data masking rule for the
# whole process. This file is written to that limit: the rest of what the demo
# used to enforce is present as commented blocks, each marked "over the
# limit", so uncommenting is the only step on a build without the limit.

log_level: info

admin:
  listen: 0.0.0.0:19000

audit:
  file: "-" # stdout, for the container log pipeline
  memory_buffer: 256
  async_queue_size: 1024 # a slow disk must not block a dashboard load
  query_sessions: 500 # backs /api/sessions

# The union of every entity the lane uses below. The section is optional now
# and it NARROWS a permissive default: omit it and all 54 entity types are
# active. It is kept because the recognizers it leaves out rewrite ordinary
# numeric columns, since US_SSN fires on roughly a third of random nine-digit
# ids and this schema has an amount_cents column that would qualify.
pii:
  entities:
    - EMAIL_ADDRESS
    - US_SSN
    - CREDIT_CARD
    - BR_CPF
    - IBAN_CODE

listeners:
  - name: metabase # the name audit rows key on
    protocol: postgres
    listen: 0.0.0.0:15432
    upstream: appdb:5432

    # Headroom, not a measurement: this stack peaks at 6 connections. Size a
    # real one at or above MB_JDBC_DATA_WAREHOUSE_MAX_CONNECTION_POOL_SIZE,
    # which Metabase holds per database and runs syncs against concurrently. A
    # lane at its cap refuses rather than queues, and Metabase reports the
    # refusal as a table that silently never finished syncing.
    max_conns: 64

    # idle_timeout_sec unset on purpose. c3p0 keeps connections open between
    # dashboard loads, and closing them under it turns the next query into a
    # reconnect or an error the analyst sees.

    # hoop-inspect is the TLS CLIENT on this hop, so it decrypts on read and
    # the rules below still see plaintext. ca_file rather than
    # insecure_skip_verify: a relay that accepts any certificate on the path
    # it exists to protect is the wrong default to demonstrate.
    upstream_tls:
      ca_file: /etc/hoop-inspect/certs/appdb.crt
      server_name: appdb

    guardrails:
      mode: enforce

      # ORDER MATTERS. First match wins, so the narrow rules come first and
      # the lane-wide backstop comes last. Reverse them and every refusal
      # carries the generic message instead of the useful one.
      rules:
        # ---- over the limit: two per-table rules ----------------------
        # These are what the ordering note above was written for, and with
        # the cap in force there is nothing left to order. Restore them on a
        # build without it and put them back BEFORE the backstop.
        #
        # payroll-off-limits matches by bare name, and a bare name matches any
        # schema qualification, so it also catches public.payroll and
        # hr.payroll. If you need one schema and not another, that distinction
        # does not exist in a table rule; use a GRANT.
        # - name: payroll-off-limits
        #   type: table
        #   tables: [payroll]
        #   message: payroll is not exposed to reporting
        #
        # `access: write` narrows the same rule type to one direction, which
        # is how a table gets a refusal that names its owner instead of the
        # generic one below. Reads of customers still pass, masked.
        # - name: customers-is-crm-owned
        #   type: table
        #   tables: [customers]
        #   access: write
        #   message: customers is written by the CRM sync; change it there

        # ---- lane-wide backstop ---------------------------------------
        # The one rule this build allows, and the right one to spend it on:
        # it catches every table nobody wrote a rule for, the two above
        # included.
        # Catches every table nobody wrote a rule for, including the one
        # added next month. type: operation is lexer-derived, so it keys on
        # the effect and not the leading verb: a DELETE inside a CTE is
        # refused, and SELECT 'DROP TABLE customers' is not.
        #
        # Matching is exact per operation, so "read-only" has to be spelled
        # out in full. appuser owns this database, so anything left off this
        # list has the upstream privilege to succeed: create, alter, grant and
        # revoke change the warehouse as surely as insert does, and call runs
        # a procedure body no rule here can read.
        - name: read-only-lane
          type: operation
          operations: [insert, update, delete, truncate,
                       create, drop, alter, grant, revoke, call]
          message: this Metabase connection is read-only; writes are not permitted

        # `require_table_match: true` on a table rule ALSO denies statements
        # whose relations could not be resolved. It reads like the safe
        # choice and it would break this lane: SET, SHOW, BEGIN and ROLLBACK
        # carry no relations, and they are 59 of the 99 statements Metabase
        # sends here. Reach for the operation rule below instead, which
        # denies unclassifiable statements without touching session setup.

        # `unknown` and `other` are NOT denied here, against sidecar's
        # usual fail-closed guidance. A first boot, a full sync and a complete
        # ./demo.sh produce zero of either, but that covers this demo rather
        # than models, pulses, actions or pgjdbc autosave (SAVEPOINT
        # classifies as `other`). Turn it on for a real deployment and watch
        # a sync:
        #
        #   - name: unreadable-statement
        #     type: operation
        #     operations: [unknown, other]
        #     message: this statement cannot be classified, so it is refused

    mask:
      # There is no top-level mask block, so every rule the lane needs is
      # listed here. A lane block REPLACES an inherited set rather than
      # extending it, which is what would happen if one were added.
      #
      # Mask rules have no table scoping, unlike the guardrail rules above.
      # There is no `tables:` field on a mask rule: it keys on the column
      # name in RowDescription or on the detected entity, and it applies to
      # every result set on the lane. `iban` below therefore covers
      # customers.iban and payroll.bank_iban alike, which is why payroll
      # needs a guardrail rule and not a mask rule. To mask a column in one
      # table and leave it clear in another, give each table its own lane.
      rules:
        # The column rule rather than the entity rule, because a column rule
        # keys on the name in RowDescription and so catches the two
        # fixture-shaped SSNs alcatraz rejects. What it loses is an alias:
        # `SELECT ssn AS employee_code` defeats it, and that is the cost of
        # having one rule instead of the pair.
        - {name: ssn-column, columns: [ssn], strategy: partial, keep_last: 4}
        # ---- over the limit: the pair and the other entities ------------
        # ssn carries both kinds of rule because they fail in opposite
        # directions. An entity rule keys on the value, so it survives any
        # alias, and reshaping the value defeats it. README "Known gaps" has
        # the hole the pair still leaves.
        # - {name: ssn-entity, entities: [US_SSN], strategy: partial, keep_last: 4}
        # Entity rules for the rest: the same value turns up under names
        # nobody enumerates in advance (email, actor_email, whatever a join
        # calls them).
        # - {name: emails, entities: [EMAIL_ADDRESS], strategy: redact}
        # - {name: cpf, entities: [BR_CPF], strategy: redact}
        # - {name: iban, entities: [IBAN_CODE], strategy: partial, keep_last: 4}
