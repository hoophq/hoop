# The caller token the sidecar admits (caller_token.file holds the same
# line). No secret here: README.md, step 3, passes it on the command line.
display_name: hoop sidecar caller token
auth:
  type: environment_variable
  secret_name: HOOP_CALLER_TOKEN
  # Headers only: a placeholder in a body or URL goes out literally.
  injection_location: {header: true, body: false}
  # EDIT: the sidecar's host, the same as the environment's allowed_hosts.
  networking: {type: limited, allowed_hosts: [sidecar.example.com]}
