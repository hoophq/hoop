# The REST API's own token. The sidecar forwards the Authorization header
# unchanged, so the upstream gets the value the vault filled. Bound to the
# sidecar's host, not the API's: the sandbox never reaches the API itself.
display_name: customer API token
auth:
  type: environment_variable
  secret_name: CUSTOMER_API_TOKEN
  injection_location: {header: true, body: false}
  # EDIT: the sidecar's host.
  networking: {type: limited, allowed_hosts: [sidecar.example.com]}
