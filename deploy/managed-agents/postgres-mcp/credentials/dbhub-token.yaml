# The token dbhub admits (DBHUB_AUTH_TOKEN in .env). No secret here:
# README.md, step 3, passes it on the command line.
display_name: dbhub token
auth:
  type: static_bearer
  # EDIT: your MCP_HOST. Matched against the agent's server URL after
  # normalizing; another path or port does not match, and the call goes out
  # without a token.
  mcp_server_url: https://mcp.example.com/mcp
