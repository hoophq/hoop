# The agent's ServiceAccount token (rbac.yaml). No secret here: README.md,
# step 4, passes it on the command line. The sidecar forwards the
# Authorization header unchanged, so the API server gets the value the vault
# filled. Bound to the sidecar's host, not the API server's: the sandbox
# never reaches the API server itself.
display_name: kubernetes token
auth:
  type: environment_variable
  secret_name: KUBE_TOKEN
  # Headers only: a placeholder in a body or URL goes out literally.
  injection_location: {header: true, body: false}
  # EDIT: the sidecar's host, the same as the environment's allowed_hosts.
  networking: {type: limited, allowed_hosts: [sidecar.example.com]}
