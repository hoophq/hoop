# The Marketplace deploy form. Generated by
#   cft blueprint metadata -p . -q -d --nested=false
# then edited by hand: hidden publisher inputs, GKE pickers, the protocol and
# config-source lists, and fields shown only for the chosen config source.
# Check it with: cft blueprint metadata -p . -v
apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: hoop-sidecar-on-google-kubernetes-engine-display
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  info:
    title: hoop sidecar on Google Kubernetes Engine
    source:
      repo: https://github.com/hoophq/hoop.git
      sourceType: git
      dir: /deploy/gcp-marketplace/sidecar
  ui:
    input:
      variables:
        # Set by Marketplace or by the publish script, never by the customer.
        project_id:
          name: project_id
          title: Project Id
          invisible: true
        helm_chart_repo:
          name: helm_chart_repo
          title: Helm Chart Repo
          invisible: true
        helm_chart_name:
          name: helm_chart_name
          title: Helm Chart Name
          invisible: true
        helm_chart_version:
          name: helm_chart_version
          title: Helm Chart Version
          invisible: true
        image_repo:
          name: image_repo
          title: Image Repo
          invisible: true
        image_tag:
          name: image_tag
          title: Image Tag
          invisible: true
        consumption_tracking_label:
          name: consumption_tracking_label
          title: Consumption Tracking Label
          invisible: true

        create_cluster:
          name: create_cluster
          title: Create a new cluster
          section: cluster
          xGoogleProperty:
            type: ET_CREATE_RESOURCE
        cluster_location:
          name: cluster_location
          title: Cluster location
          section: cluster
          xGoogleProperty:
            type: ET_GCE_LOCATION
        cluster_name:
          name: cluster_name
          title: Cluster
          section: cluster
          xGoogleProperty:
            type: ET_GKE_CLUSTER
            gkeCluster:
              locationVariable: cluster_location
              clusterCreationVariable: create_cluster
        namespace:
          name: namespace
          title: Namespace
          section: cluster
        goog_cm_deployment_name:
          name: goog_cm_deployment_name
          title: Deployment name
          section: cluster

        config_source:
          name: config_source
          title: Configuration
          section: sidecar
          enumValueLabels:
            - label: One resource (protocol and address)
              value: simple
            - label: Whole config document
              value: document
            - label: Existing ConfigMap
              value: configmap
            - label: hoop control plane
              value: control_plane
        protocol:
          name: protocol
          title: Protocol
          section: sidecar
          enumValueLabels:
            - {label: PostgreSQL, value: postgres}
            - {label: MySQL, value: mysql}
            - {label: SQL Server, value: mssql}
            - {label: MongoDB, value: mongodb}
            - {label: Oracle, value: oracle}
            - {label: ClickHouse, value: clickhouse}
            - {label: HTTP, value: http}
          toggleUsingVariable: &simple
            variableName: config_source
            variableValues: [simple]
            type: DISPLAY_VARIABLE_TOGGLE_TYPE_STRING
        upstream:
          name: upstream
          title: Resource address
          placeholder: appdb.default.svc.cluster.local:5432
          tooltip: Where the sidecar reaches the resource, as host:port.
          section: sidecar
          toggleUsingVariable: *simple
        service_port:
          name: service_port
          title: Client port
          tooltip: The port clients connect to. 0 uses the protocol's usual port.
          section: sidecar
          level: 1
          toggleUsingVariable: *simple
        config_document:
          name: config_document
          title: Config document
          tooltip: The whole sidecar config, YAML or JSON. admin.listen must be 0.0.0.0:19000.
          section: sidecar
          xGoogleProperty:
            type: ET_MULTI_LINE_STRING
          toggleUsingVariable:
            variableName: config_source
            variableValues: [document]
            type: DISPLAY_VARIABLE_TOGGLE_TYPE_STRING
        existing_config_map:
          name: existing_config_map
          title: ConfigMap name
          tooltip: A ConfigMap in the namespace whose key config.yaml is the config.
          section: sidecar
          toggleUsingVariable:
            variableName: config_source
            variableValues: [configmap]
            type: DISPLAY_VARIABLE_TOGGLE_TYPE_STRING
        control_plane_url:
          name: control_plane_url
          title: Control plane URL
          section: sidecar
          toggleUsingVariable: &control_plane
            variableName: config_source
            variableValues: [control_plane]
            type: DISPLAY_VARIABLE_TOGGLE_TYPE_STRING
        # Not masked: the Blueprint UI schema has no secret or masked input.
        # Terraform still marks it sensitive and Helm gets it via set_sensitive.
        control_plane_token:
          name: control_plane_token
          title: Sidecar token
          tooltip: The control plane must already hold this sidecar's configuration.
          section: sidecar
          toggleUsingVariable: *control_plane
        lane_ports:
          name: lane_ports
          title: Listener ports to publish
          tooltip: The listener ports of the config, comma separated, e.g. 15432,18080.
          section: sidecar
          toggleUsingVariable:
            variableName: config_source
            variableValues: [configmap, control_plane]
            type: DISPLAY_VARIABLE_TOGGLE_TYPE_STRING
        service_type:
          name: service_type
          title: Client access
          section: sidecar
          enumValueLabels:
            - label: Inside the cluster (ClusterIP)
              value: ClusterIP
            - label: Inside the VPC (internal load balancer)
              value: InternalLoadBalancer
        # Hidden in control_plane mode: the organization's license applies there.
        license:
          name: license
          title: License
          tooltip: Empty runs the free tier, one guardrail rule and one masking rule.
          section: sidecar
          toggleUsingVariable:
            variableName: config_source
            variableValues: [simple, document, configmap]
            type: DISPLAY_VARIABLE_TOGGLE_TYPE_STRING

        replicas:
          name: replicas
          title: Replicas
          section: sidecar
          level: 1
        cpu:
          name: cpu
          title: CPU
          section: sidecar
          level: 1
        memory:
          name: memory
          title: Memory
          section: sidecar
          level: 1
      sections:
        - name: cluster
          title: Cluster
        - name: sidecar
          title: Sidecar
