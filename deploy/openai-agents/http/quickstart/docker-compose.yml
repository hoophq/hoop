# The quick start: the sidecar, with hoop's demo API inside it, and a
# Cloudflare quick tunnel that gives it a public HTTPS host. ./run.sh starts it.
name: hoop-openai-agents-quickstart

services:
  sidecar:
    # The same release as ../values.yaml; CI fails if they differ.
    image: hoophq/hoopsidecar:1.263.0@sha256:1cbddabd563ea67a885e4fa5767f97599f978e8edd2cb6ac3f1eba4e385f5992
    environment:
      HOOP_SIDECAR_CONFIG: /etc/hoop-quickstart/sidecar.yaml
      HOOP_SIDECAR_INSTALL_SOURCE: openai-agents-http
      # Empty runs the free tier. The document itself, not a path: no host
      # file is mounted for it. README.md, "Free tier".
      HOOP_LICENSE: ${HOOP_LICENSE:-}
    volumes:
      # The folder, not the file: an editor that saves by rename gives the
      # file a new inode, which a file mount never sees.
      - ./config:/etc/hoop-quickstart:ro
      # Long form: a missing token stops Compose. The short form leaves a
      # folder in its place, which run.sh then takes for the token.
      - type: bind
        source: ./.secrets/caller-token
        target: /run/secrets/caller-token
        read_only: true
        bind: { create_host_path: false }
    healthcheck:
      # The image has bash and no curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/19000 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: "2s"
      timeout: "10s"
      retries: 15
      start_period: "5s"

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    command: ["tunnel", "--no-autoupdate", "--url", "http://sidecar:8080"]
    depends_on:
      sidecar: { condition: service_healthy }
